---
name: 'PR build and test images (riscv64)'

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-image-riscv64-${{ github.head_ref || github.ref }}-${{ github.repository }}
  cancel-in-progress: true

# PR-only pipeline: RISC-V build, entirely on x86+QEMU. No GHCR releases, no ISO.
#
# Dependency graph:
#   stage0 → stage1 → rsync ─┬→ cmake ────────────────┐
#                             ├→ kernel (cloud+default) ┤→ toolchain → container → hadron-bios (x86+QEMU, default)
#                             ├→ systemd ─────────────┤
#                             └→ python ────────────────┘
#
# Used to be split into hadron-bios-warm (x86+QEMU, stops before systemctl
# preset-all) pushing an OCI image, then a native riscv64 runner importing it
# to run preset-all onward — preset-all used to SIGSEGV under QEMU. Retested
# 2026-08-13 with qemu-user 10.2.2: 21/21 clean runs, the failure this split
# existed for no longer reproduces (see Dockerfile.tmpl's full-image-final
# comment). hadron-bios now builds the whole `default` target in one job, on
# the same x86+QEMU runners as everything else in this pipeline — no OCI
# hand-off, no native riscv64 runner.

env:
  CACHE_TO: mode=max,ignore-error=true,compression=zstd,compression-level=3,oci-mediatypes=true,image-manifest=true
  CACHE_TO_MIN: mode=min,ignore-error=true,compression=zstd,compression-level=3,oci-mediatypes=true,image-manifest=true

jobs:
  # Ensure every ghcr source image the Dockerfile references is
  # published before any docker/build-push-action starts. Skipped
  # while the riscv64 pipeline is gated off; the amd64 and arm64 PR
  # workflows populate ghcr anyway, so nothing regresses.
  populate-sources:
    if: ${{ false }}
    uses: ./.github/workflows/populate-sources.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit

  riscv64-disabled:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: RISC-V64 pipeline disabled
        run: echo "RISC-V64 CI pipeline is temporarily disabled."

  check-kernel-configs:
    if: ${{ false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install PyYAML
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Verify riscv64 kernel configs are resolved against current kernel version
        run: |
          KERNEL_VERSION=$(python3 -c "import yaml; print(yaml.safe_load(open('sources.yaml'))['packages']['linux']['version'])")
          [[ "$KERNEL_VERSION" =~ ^[0-9]+\.[0-9]+$ ]] && KERNEL_VERSION="${KERNEL_VERSION}.0"
          FAILED=0
          for cfg in files/kernel/cloud-riscv64.config files/kernel/default-riscv64.config; do
            CONFIG_VERSION=$(grep '^# Linux/' "$cfg" | grep -oP '\d+\.\d+(\.\d+)?' || true)
            [[ "$CONFIG_VERSION" =~ ^[0-9]+\.[0-9]+$ ]] && CONFIG_VERSION="${CONFIG_VERSION}.0"
            if [ "$CONFIG_VERSION" != "$KERNEL_VERSION" ]; then
              echo "ERROR: $cfg is stale (generated for ${CONFIG_VERSION:-unknown}, current kernel is $KERNEL_VERSION)"
              echo "Run 'make update-kernel-configs' and commit the result."
              FAILED=1
            else
              echo "OK: $cfg matches kernel $KERNEL_VERSION"
            fi
          done
          exit $FAILED

  stage0:
    if: ${{ false }}
    needs: populate-sources
    runs-on: oracle-vm-32cpu-128gb-x86-64
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4
      - name: Log in to quay.io for cache
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
      - name: Build stage0 (mussel cross-compiler)
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./
          file: ./Dockerfile
          platforms: linux/riscv64
          labels: ${{ steps.meta.outputs.labels }}
          target: stage0
          cache-from: |
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage0-riscv64,mode=max
          cache-to: type=registry,ref=quay.io/kairos/hadron-build-cache:stage0-riscv64,${{ env.CACHE_TO }}
          build-args: |
            ARCH=riscv64
            BUILD_ARCH=riscv64

  stage1:
    runs-on: oracle-vm-32cpu-128gb-x86-64
    needs: [stage0]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4
      - name: Log in to quay.io for cache
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
      - name: Build stage1-merge
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./
          file: ./Dockerfile
          platforms: linux/riscv64
          labels: ${{ steps.meta.outputs.labels }}
          target: stage1-merge
          cache-from: |
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage0-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage1-merge-riscv64,mode=max
          cache-to: type=registry,ref=quay.io/kairos/hadron-build-cache:stage1-merge-riscv64,${{ env.CACHE_TO }}
          build-args: |
            ARCH=riscv64
            BUILD_ARCH=riscv64

  rsync:
    runs-on: oracle-vm-32cpu-128gb-x86-64
    needs: [stage1]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4
      - name: Log in to quay.io for cache
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
      - name: Build rsync stage (and its full dependency chain)
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./
          file: ./Dockerfile
          platforms: linux/riscv64
          labels: ${{ steps.meta.outputs.labels }}
          target: rsync
          cache-from: |
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage0-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage1-merge-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:rsync-riscv64,mode=max
          cache-to: type=registry,ref=quay.io/kairos/hadron-build-cache:rsync-riscv64,${{ env.CACHE_TO }}
          build-args: |
            ARCH=riscv64
            BUILD_ARCH=riscv64

  cmake:
    runs-on: oracle-vm-32cpu-128gb-x86-64
    needs: [rsync]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4
      - name: Log in to quay.io for cache
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
      - name: Build cmake
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./
          file: ./Dockerfile
          platforms: linux/riscv64
          labels: ${{ steps.meta.outputs.labels }}
          target: cmake
          cache-from: |
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage0-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage1-merge-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:rsync-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:cmake-riscv64,mode=max
          cache-to: type=registry,ref=quay.io/kairos/hadron-build-cache:cmake-riscv64,${{ env.CACHE_TO }}
          build-args: |
            ARCH=riscv64
            BUILD_ARCH=riscv64

  # One job per KERNEL_TYPE so hadron-grub (default) can reuse kernel-misc-default-riscv64.
  kernel:
    runs-on: oracle-vm-32cpu-128gb-x86-64
    needs: [rsync]
    strategy:
      matrix:
        kernel: [cloud, default]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4
      - name: Log in to quay.io for cache
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
      - name: Build kernel + modules (kernel-misc target)
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./
          file: ./Dockerfile
          platforms: linux/riscv64
          labels: ${{ steps.meta.outputs.labels }}
          target: kernel-misc
          cache-from: |
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage0-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage1-merge-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:rsync-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:kernel-misc-${{ matrix.kernel }}-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:kernel-misc-riscv64,mode=max
          cache-to: type=registry,ref=quay.io/kairos/hadron-build-cache:kernel-misc-${{ matrix.kernel }}-riscv64,${{ env.CACHE_TO }}
          build-args: |
            ARCH=riscv64
            BUILD_ARCH=riscv64
            KERNEL_TYPE=${{ matrix.kernel }}

  systemd:
    runs-on: oracle-vm-32cpu-128gb-x86-64
    needs: [rsync]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4
      - name: Log in to quay.io for cache
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
      - name: Build systemd
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./
          file: ./Dockerfile
          platforms: linux/riscv64
          labels: ${{ steps.meta.outputs.labels }}
          target: systemd
          cache-from: |
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage0-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage1-merge-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:rsync-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:systemd-riscv64,mode=max
          cache-to: type=registry,ref=quay.io/kairos/hadron-build-cache:systemd-riscv64,${{ env.CACHE_TO }}
          build-args: |
            ARCH=riscv64
            BUILD_ARCH=riscv64

  python:
    runs-on: oracle-vm-32cpu-128gb-x86-64
    needs: [rsync]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4
      - name: Log in to quay.io for cache
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
      - name: Build python-build
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./
          file: ./Dockerfile
          platforms: linux/riscv64
          labels: ${{ steps.meta.outputs.labels }}
          target: python-build
          cache-from: |
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage0-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage1-merge-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:rsync-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:python-build-riscv64,mode=max
          cache-to: type=registry,ref=quay.io/kairos/hadron-build-cache:python-build-riscv64,${{ env.CACHE_TO }}
          build-args: |
            ARCH=riscv64
            BUILD_ARCH=riscv64

  toolchain:
    runs-on: oracle-vm-32cpu-128gb-x86-64
    needs: [cmake, kernel, systemd, python]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4
      - name: Log in to quay.io for cache
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
      - name: Build toolchain
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./
          file: ./Dockerfile
          platforms: linux/riscv64
          push: true
          tags: ttl.sh/hadron-toolchain-riscv64:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          target: toolchain
          cache-from: |
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage0-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage1-merge-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:rsync-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:cmake-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:kernel-misc-cloud-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:kernel-misc-default-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:kernel-misc-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:systemd-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:python-build-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:toolchain-riscv64,mode=max
          cache-to: type=registry,ref=quay.io/kairos/hadron-build-cache:toolchain-riscv64,${{ env.CACHE_TO }}
          build-args: |
            ARCH=riscv64
            BUILD_ARCH=riscv64

  container:
    runs-on: oracle-vm-32cpu-128gb-x86-64
    needs: [toolchain]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4
      - name: Log in to quay.io for cache
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
      - name: Build container
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./
          file: ./Dockerfile
          platforms: linux/riscv64
          push: true
          tags: ttl.sh/hadron-container-riscv64:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          target: container
          cache-from: |
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage0-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage1-merge-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:rsync-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:cmake-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:kernel-misc-cloud-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:kernel-misc-default-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:kernel-misc-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:systemd-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:python-build-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:toolchain-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:container-riscv64,mode=max
          cache-to: type=registry,ref=quay.io/kairos/hadron-build-cache:container-riscv64,${{ env.CACHE_TO }}
          build-args: |
            ARCH=riscv64
            BUILD_ARCH=riscv64
      - name: Test container image
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./
          file: ./Dockerfile
          platforms: linux/riscv64
          target: container-test
          cache-from: |
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage0-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage1-merge-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:rsync-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:cmake-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:kernel-misc-cloud-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:kernel-misc-default-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:kernel-misc-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:systemd-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:python-build-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:toolchain-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:container-riscv64,mode=max
          build-args: |
            ARCH=riscv64
            BUILD_ARCH=riscv64

  # x86+QEMU, whole way through: builds default (which now includes what used
  # to be the native-only preset-all step) in one job, no OCI hand-off.
  hadron-bios:
    runs-on: oracle-vm-32cpu-128gb-x86-64
    needs: [container]
    timeout-minutes: 360
    strategy:
      matrix:
        kernel: [cloud, default]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4
      - name: Log in to quay.io for cache
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
      - name: Build and push default image (${{ matrix.kernel }})
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./
          file: ./Dockerfile
          platforms: linux/riscv64
          push: true
          provenance: false
          tags: ttl.sh/hadron${{ matrix.kernel == 'cloud' && '-cloud' || '' }}-riscv64:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          target: default
          cache-from: |
