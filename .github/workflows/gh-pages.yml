name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    # Note: the `paths:` filter below applies to tag pushes too, so a `v*` tag
    # that points at an existing commit (touching none of the filtered paths)
    # will NOT trigger this workflow. That's intentional: tag manifests are
    # regenerated on every main build (eventual consistency), so new tags
    # appear on the next main rebuild. The `tags:` trigger only fires
    # immediately when a tag push also touches one of the filtered paths.
    tags:
      - 'v*'
    paths:
      - 'docs/**'
      - 'Dockerfile'
      - 'updatecli.d/**'
      - 'hack/gen-components.sh'
      - 'hack/gen-snapshot.sh'
      - 'hack/gen-external.sh'
      - 'hack/components-template.html'
      - '.github/workflows/gh-pages.yml'
  # Rebuild on a schedule so external firmware/layers snapshots (fetched by
  # hack/gen-external.sh during the build) stay fresh even when nothing in this
  # repo changes. Every 2 hours keeps data at most ~2h stale.
  schedule:
    - cron: '0 */2 * * *'
  # Allow sibling repos (hadron-layers, hadron-firmware) to trigger a rebuild
  # immediately after they publish new data, via a repository_dispatch POST to
  # this repo's API with this event type.
  repository_dispatch:
    types: [external-data-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: ./docs/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        working-directory: ./docs
        run: npm ci

      - name: Generate component snapshots
        run: ./hack/gen-snapshot.sh

      - name: Fetch firmware + layers snapshots
        run: ./hack/gen-external.sh

      - name: Build with Docusaurus
        working-directory: ./docs
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
