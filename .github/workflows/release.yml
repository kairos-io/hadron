name: Release

# Every Monday and Thursday, releases the newest green main commit when
# something landed since the last release. The version comes from the
# commits, following
# Conventional Commits and SemVer (.github/scripts/next-release.sh):
# a breaking change is a major release, `feat` a minor one, anything else a
# patch. This job creates the tag and release, then starts "Build main and release
# images" on it, which builds the images and adds the component list to the release notes.
#
# The commit is the newest one whose main build passed. It uses
# only the workflow's GITHUB_TOKEN. The tag is created with the releases
# API, which GitHub accepts even when the commit's workflow files differ
# from main (a git push of the tag is refused). A tag made with that token
# starts no workflow, but GitHub does let the token start one with
# workflow_dispatch, so the build is started explicitly.
#
# It posts to Slack (the SLACK_RELEASE_WEBHOOK secret) when it starts a
# release and when it skips because main has no green build. With
# no secret set, or on a dry run, the message is only printed as a
# warning, and a failed post never fails the run.
on:
  schedule:
    # 04:00 UTC on Monday and Thursday.
    - cron: "0 4 * * 1,4"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would be tagged"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      # gh release create makes the tag and the release.
      contents: write
      # gh workflow run of the release build.
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Pick commit and version, then tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          SLACK_RELEASE_WEBHOOK: ${{ secrets.SLACK_RELEASE_WEBHOOK }}
        run: |
          set -euo pipefail

          notify() {
            if [ "${DRY_RUN}" = "true" ]; then
              echo "::notice::Dry run, not posted to Slack: $1"
              return 0
            fi
            if [ -z "${SLACK_RELEASE_WEBHOOK:-}" ]; then
              echo "::warning::$1"
              return 0
            fi
            if ! curl -fsS -X POST -H 'Content-Type: application/json' \
              --data "$(jq -n --arg t "$1" '{text:$t}')" "${SLACK_RELEASE_WEBHOOK}"; then
              echo "::warning::Slack post failed: $1"
            fi
          }

          last=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          if [ -z "${last}" ]; then
            echo "No vMAJOR.MINOR.PATCH tag to release from" >&2
            exit 1
          fi
          echo "Last release: ${last}"

          # Release the newest main commit whose image build passed, not
          # just HEAD, so a red main never gets tagged. A red newest build
          # does not block the release: the newest green one is used.
          sha=$(gh run list --repo "${GITHUB_REPOSITORY}" \
            --workflow build-multiarch-images.yml --branch main --event push \
            --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
          if [ -z "${sha}" ]; then
            notify "Hadron release skipped: no green main build found."
            exit 0
          fi
          echo "Newest green main commit: ${sha}"

          if git merge-base --is-ancestor "${sha}" "${last}"; then
            echo "No changes since ${last}, skipping"
            exit 0
          fi

          next=$(.github/scripts/next-release.sh "${last}" "${sha}")
          if [ -z "${next}" ]; then
            echo "No changes since ${last}, skipping"
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/${next}" >/dev/null; then
            echo "${next} already exists, skipping" >&2
            exit 0
          fi

          echo "Changes since ${last}:"
          git log --oneline "${last}..${sha}"

          if [ "${DRY_RUN}" = "true" ]; then
            echo "Dry run: would tag ${sha} as ${next}"
            exit 0
          fi

          # The tag is made through the releases API on exactly the green
          # commit. Unlike a git push of the tag, this is not refused when
          # the commit's workflow files differ from main.
          gh release create "${next}" --repo "${GITHUB_REPOSITORY}" --target "${sha}" \
            --title "${next}" --generate-notes
          gh workflow run build-multiarch-images.yml --repo "${GITHUB_REPOSITORY}" --ref "${next}"
          echo "Tagged ${sha} as ${next} (from ${last}) and started the release build" >> "$GITHUB_STEP_SUMMARY"
          notify "Hadron \`${next}\` is building (tagged ${sha:0:7}, from ${last})."
