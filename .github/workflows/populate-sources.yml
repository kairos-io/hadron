name: Populate source caches

# Publishes upstream source tarballs to
# ghcr.io/kairos-io/hadron-sources/<pkg>:<version> so the main build
# never fetches from upstream mirrors. Each package is cached as its
# own OCI image, tagged by version; bumping one package's version
# invalidates only that image's tag, never the others.
#
# Runs whenever sources.yaml, Dockerfile, or this workflow changes.
# Idempotent per-package: if the target tag already exists on ghcr AND
# covers every required platform, the matrix cell short-circuits after
# one manifest inspect. Only missing tags (or tags missing platforms)
# trigger a fetch-verify-publish. SHA256 mismatch fails the cell; only
# this workflow is allowed to talk to upstream mirrors from CI.
#
# The set of cached packages is driven by sources.yaml. Adding a
# package is: append an entry to sources.yaml with its version_arg,
# sha256, url template, and filename; flip the corresponding
# Dockerfile downloader stage to
# `FROM ghcr.io/kairos-io/hadron-sources/<pkg>:${<version_arg>}`.

on:
  # PR workflows and build-multiarch-images call this via
  # workflow_call, then depend on it via `needs: populate-sources`.
  # That gates every docker/build-push-action until each ghcr
  # source image the Dockerfile references has been published (or
  # short-circuited as "already published"). Without this gating,
  # toolchain runs in parallel with populate-sources and its
  # `FROM ghcr.io/.../pkg:VER` can fail with "not found" on a cold
  # cache push where populate-sources hasn't finished yet.
  workflow_call: {}
  # Manual button on the Actions page for one-off publishes.
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REPO_PREFIX: ghcr.io/kairos-io/hadron-sources
  REQUIRED_PLATFORMS: linux/amd64 linux/arm64 linux/riscv64

jobs:
  # Read sources.yaml, emit a JSON array of package names so the
  # populate job can matrix-fan-out over them. If the file is missing
  # or empty, the matrix will be empty and populate becomes a no-op.
  discover:
    runs-on: ubuntu-latest
    outputs:
      pkgs: ${{ steps.list.outputs.pkgs }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        run: |
          set -euo pipefail
          pkgs=$(python3 <<'PY'
          import json, sys
          try:
              import yaml
          except ImportError:
              import subprocess
              subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--quiet', 'PyYAML'])
              import yaml
          data = yaml.safe_load(open('sources.yaml')) or {}
          names = sorted((data.get('packages') or {}).keys())
          print(json.dumps(names))
          PY
          )
          echo "pkgs=$pkgs" >> "$GITHUB_OUTPUT"
          echo "Discovered packages: $pkgs"

  populate:
    needs: discover
    runs-on: ubuntu-latest
    # Fork PRs don't have secrets.GITHUB_TOKEN with packages:write; skip
    # them here. When a fork bumps a version, the maintainer runs this
    # workflow via workflow_dispatch on a maintainer-owned branch first.
    if: >-
      needs.discover.outputs.pkgs != '[]' && (
        github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository
      )
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        pkg: ${{ fromJSON(needs.discover.outputs.pkgs) }}
    steps:
      - uses: actions/checkout@v5

      - name: Extract metadata for ${{ matrix.pkg }}
        id: meta
        env:
          PKG: ${{ matrix.pkg }}
        # Reads sources.yaml for this package and writes the computed
        # (version, url, filename, sha256, tag) to step outputs. sources.yaml
        # is the single source of truth for versions, so we no longer parse
        # the Dockerfile here. Fails loudly if the entry is missing or has
        # required fields blank.
        run: |
          set -euo pipefail
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import os, sys
          try:
              import yaml
          except ImportError:
              import subprocess
              subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--quiet', 'PyYAML'])
              import yaml
          pkg = os.environ['PKG']
          data = yaml.safe_load(open('sources.yaml')) or {}
          spec = (data.get('packages') or {}).get(pkg)
          if spec is None:
              sys.exit(f'package {pkg!r} missing from sources.yaml')
          for field in ('version', 'sha256', 'filename', 'urls'):
              if not spec.get(field):
                  sys.exit(f'package {pkg!r} missing field {field!r}')
          if not isinstance(spec['urls'], list) or not spec['urls']:
              sys.exit(f'package {pkg!r}: urls must be a non-empty list')
          version = str(spec['version'])
          urls = [u.replace('${version}', version) for u in spec['urls']]
          if any(' ' in u or '\t' in u or '\n' in u for u in urls):
              sys.exit(f'package {pkg!r} URL contains whitespace, would break the fetch loop')
          filename = spec['filename']
          sha256 = spec['sha256']
          tag = f"{os.environ['REPO_PREFIX']}/{pkg}:{version}"
          print(f'version={version}')
          print(f'urls={" ".join(urls)}')
          print(f'filename={filename}')
          print(f'sha256={sha256}')
          print(f'tag={tag}')
          PY

      - name: Log in to ghcr
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether tag has all required platforms on ghcr
        id: check
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        # docker buildx build --push always wraps output in an OCI
        # image-index, even for a single --platform. So the wrapper's
        # media type does not tell us whether the tag covers all the
        # architectures toolchain builds need; we have to walk the
        # manifests[] list and check each platform is present.
        # Attestation sub-manifests (platform.architecture == "unknown")
        # are ignored.
        run: |
          set -uo pipefail
          if ! docker manifest inspect "$TAG" >/dev/null 2>&1; then
              echo "Missing: $TAG, will fetch and publish"
              echo "exists=false" >> "$GITHUB_OUTPUT"
              exit 0
          fi
          present=$(docker manifest inspect "$TAG" | python3 -c '
          import sys, json
          m = json.load(sys.stdin)
          if m.get("mediaType") not in (
              "application/vnd.oci.image.index.v1+json",
              "application/vnd.docker.distribution.manifest.list.v2+json",
          ):
              sys.exit(0)
          for sub in m.get("manifests", []):
              p = sub.get("platform", {})
              arch = p.get("architecture", "")
              os_ = p.get("os", "")
              if arch and os_ and arch != "unknown":
                  print(f"{os_}/{arch}")
          ' | sort -u)
          missing=""
          for p in $REQUIRED_PLATFORMS; do
              if ! echo "$present" | grep -qxF "$p"; then
                  missing="$missing $p"
              fi
          done
          if [ -n "$missing" ]; then
              echo "Existing $TAG is missing platforms:$missing"
              echo "Present: $(echo "$present" | tr '\n' ' ')"
              echo "exists=false" >> "$GITHUB_OUTPUT"
          else
              echo "All required platforms present in $TAG"
              echo "Present: $(echo "$present" | tr '\n' ' ')"
              echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.check.outputs.exists == 'false'
        uses: docker/setup-qemu-action@v3

      - name: Set up buildx
        if: steps.check.outputs.exists == 'false'
        uses: docker/setup-buildx-action@master

      - name: Fetch, verify, publish
        if: steps.check.outputs.exists == 'false'
        env:
          PKG: ${{ matrix.pkg }}
          VERSION: ${{ steps.meta.outputs.version }}
          URLS: ${{ steps.meta.outputs.urls }}
          FILENAME: ${{ steps.meta.outputs.filename }}
          EXPECTED_SHA: ${{ steps.meta.outputs.sha256 }}
          TAG: ${{ steps.meta.outputs.tag }}
        # Canonical upstream fetch. Runs only in this workflow (which
        # gates on Dockerfile / sources.yaml changes) so a transient
        # upstream outage here does not affect regular builds - once a
        # version has been published to ghcr, no upstream is touched.
        # URLS is a whitespace-separated list of candidate URLs, tried
        # in order. Single-url packages just have one entry.
        #
        # SHA verification happens INSIDE the loop so a URL that returns
        # non-empty-but-wrong content (a 502 HTML error page, a redirect
        # to a directory listing, an entirely different tarball) is
        # rejected and the next URL is tried. Otherwise the first URL
        # that responds with any bytes wins even if those bytes are
        # bogus, and every fallback URL becomes useless.
        run: |
          set -uo pipefail
          mkdir -p ctx/sources/downloads
          out="ctx/sources/downloads/$FILENAME"
          matched=0
          for url in $URLS; do
              echo "Fetching $url"
              rm -f "$out"
              if ! wget -q --timeout=60 --tries=2 "$url" -O "$out"; then
                  echo "  fetch failed, trying next URL"
                  continue
              fi
              actual=$(sha256sum "$out" | awk '{print $1}')
              if [ "$actual" = "$EXPECTED_SHA" ]; then
                  echo "  SHA256 verified: $actual"
                  matched=1
                  break
              fi
              echo "  SHA256 mismatch (expected $EXPECTED_SHA, got $actual), trying next URL"
          done
          if [ "$matched" -eq 0 ]; then
              echo "No URL served the expected bytes for $PKG-$VERSION."
              echo "Either every upstream is down, or the pinned sha in sources.yaml"
              echo "no longer matches what upstream serves (retagged / repacked)."
              exit 1
          fi

          # Minimal scratch image with just the tarball at the exact
          # path the Dockerfile expects downstream via COPY --from.
          # Built for every arch the toolchain targets; since the
          # tarball is arch-independent, all sub-manifests share the
          # same content-addressed layer.
          cat > ctx/Dockerfile <<EOF
          FROM scratch
          COPY sources/downloads/$FILENAME /sources/downloads/$FILENAME
          EOF

          docker buildx build \
              --push \
              --platform linux/amd64,linux/arm64,linux/riscv64 \
              --tag "$TAG" \
              ctx/
          echo "Published $TAG"
