  build-bios-iso-amd64:
    runs-on: ubuntu-latest
    needs:
      - build-kairos-bios-amd64
    strategy:
      matrix:
        fips: [ "no-fips", "fips" ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
      - name: Download the image
        uses: actions/download-artifact@v8
        with:
          name: hadron-init-bios${{ matrix.fips == 'fips' && '-fips' || '' }}-amd64-image
      - name: Load the image
        run: |
          gunzip -c hadron-init-bios-amd64.tar.gz | docker load
      # AuroraBoot mounts the docker socket, so it resolves docker:<name> from
      # the local image store that the load step above populated.
      - name: Build ISO
        run: |
          mkdir build
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
          -v $PWD/build/:/output \
          quay.io/kairos/auroraboot:v0.21.0-alpha.4 --debug build-iso --output /output/ \
          --override-name kairos-hadron-bios${{ matrix.fips == 'fips' && '-fips' || '' }}-${{ github.sha }} \
          docker:hadron-init-bios${{ matrix.fips == 'fips' && '-fips' || '' }}-amd64:${{ github.sha }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: kairos-hadron-bios${{ matrix.fips == 'fips' && '-fips' || '' }}-${{ github.sha }}.iso.zip
          path: build/*.iso

  build-trusted-iso-amd64:
    runs-on: ubuntu-latest
    needs:
      - build-kairos-trusted-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
      - name: Download the image
        uses: actions/download-artifact@v8
        with:
          name: hadron-init-trusted-image
      - name: Load the image
        run: |
          gunzip -c hadron-init-trusted.tar.gz | docker load
      # AuroraBoot mounts the docker socket, so it resolves docker:<name> from
      # the local image store that the load step above populated.
      - name: Build ISO
        run: | # when agent has fixed the bootentry selection, we can add --sdboot-in-source to use the bundled sdboot
          mkdir build
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
          -v $PWD/tests/assets/keys:/keys \
          -v $PWD/build/:/output \
          -v $PWD/tests/assets/sysext/:/overlay \
          quay.io/kairos/auroraboot:v0.21.0-alpha.4 --debug build-uki \
          --output-dir /output/ --public-keys /keys \
          --tpm-pcr-private-key /keys/tpm2-pcr-private.pem \
          --sb-key /keys/db.key \
          --sb-cert /keys/db.pem \
          --output-type iso \
          --overlay-iso /overlay \
          docker:hadron-init-trusted:${{ github.sha }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: kairos-hadron-trusted-${{ github.sha }}.iso.zip
          path: build/*.iso

  tests-bios-amd64:
    runs-on: cncf-ubuntu-16-64-x86
    name: ${{ matrix.test }} tests
    needs:
      - build-bios-iso-amd64
    strategy:
      matrix:
        test:
          - "acceptance"
          - "reset"
          - "custom-partitioning"
          - "recovery"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Go
        uses: actions/setup-go@v7
        # These workers cap at 100Mb/s, so a congested one turns even the Go
        # toolchain download into a crawl, and a worker that cannot manage two
        # minutes here is not going to manage the image pulls later either.
        # Fail it fast rather than burn five minutes first
        # (kairos-io/kairos#4564).
        timeout-minutes: 2
        with:
          go-version-file: tests/go.mod
          # The dependency cache costs more than it saves. Restoring it moves
          # ~305MB where a cold "go mod download" of tests/go.sum moves 124MB,
          # and in run 35681926163 it missed nine times out of twelve. It also
          # writes from a post step, and a step's timeout-minutes covers its
          # post action too, so packing the 449MB module cache ran past the
          # budget above and failed two jobs whose work had already passed.
          cache: false
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: kairos-hadron-bios-${{ github.sha }}.iso.zip
      - name: Enable KVM group perms
        run: |
          sudo apt-get update
          sudo apt-get install -y libvirt-clients libvirt-daemon-system libvirt-daemon virtinst bridge-utils qemu-system qemu-system-x86 qemu-system-x86 qemu-utils qemu-kvm acl udev mkisofs swtpm
          sudo setfacl -m u:$(id -un):rwx /dev/kvm
      - name: Run tests
        env:
          USE_QEMU: true
          KVM: true
          MEMORY: 5000
          DRIVE_SIZE: 50000
          CREATE_VM: true
          CPUS: 4
        run: |
          export ISO=$PWD/$(ls *.iso|grep -v ipxe | head -1 )
          echo "ISO is: $ISO"
          cp tests/go.* .
          go mod download
          go run github.com/onsi/ginkgo/v2/ginkgo -v --fail-fast -r --label-filter "${{ matrix.test }}" ./tests/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: ${{ matrix.test }}-${{github.sha}}.logs.zip
          path: tests/**/logs/*
          if-no-files-found: warn

  tests-trusted-amd64:
    runs-on: cncf-ubuntu-16-64-x86
