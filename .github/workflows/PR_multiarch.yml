  image-size-report-amd64:
    # Informational only: compares the full images built for this PR against
    # the published :main baseline and posts a sticky PR comment. Never fails.
    runs-on: ubuntu-latest
    needs:
      - hadron-bios-amd64
      - hadron-trusted-amd64
    permissions:
      contents: read
      packages: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Log in to ghcr.io (for :main baseline images)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The four PR image variants this report compares against :main all
      # arrive as tarball artifacts now, not a ttl.sh pull. Each producer job
      # gave its tarball a variant-specific file name, so all four can be
      # downloaded into this one workspace without clobbering each other.
      # Named individually rather than by glob/pattern: hadron-bios-amd64 also
      # produces a hadron-cloud-fips-amd64-image artifact this report does not
      # use, and a broad pattern risks picking up the (differently named)
      # hadron-init-*-image artifacts from the build-kairos-*-amd64 jobs too.
      - name: Download hadron-amd64-image
        uses: actions/download-artifact@v8
        with:
          name: hadron-amd64-image
      - name: Download hadron-cloud-amd64-image
        uses: actions/download-artifact@v8
        with:
          name: hadron-cloud-amd64-image
      - name: Download hadron-trusted-image
        uses: actions/download-artifact@v8
        with:
          name: hadron-trusted-image
      - name: Download hadron-cloud-trusted-image
        uses: actions/download-artifact@v8
        with:
          name: hadron-cloud-trusted-image
      - name: Load the images
        run: |
          for f in hadron-amd64.tar.gz hadron-cloud-amd64.tar.gz hadron-trusted.tar.gz hadron-cloud-trusted.tar.gz; do
            gunzip -c "$f" | docker load
          done
      - name: Generate size report
        run: |
          .github/scripts/image-size-report.sh "${{ github.sha }}" "${{ github.repository }}" | tee report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post sticky PR comment
        # Fork PRs only get a read-only token, so posting will fail there; the
        # step summary above is still written. Never block the pipeline on it.
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: image-size-report
          path: report.md

  hadron-grub-arm64:
    runs-on: oracle-vm-32cpu-128gb-arm64
    needs:
      - container-arm64  # Take advantage of cached layers from the container build
    strategy:
      matrix:
        kernel: [ "cloud" ]
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
      # ttl.sh tags must not match the amd64 jobs in this workflow: both trigger on the same
      # github.sha, so last-writer wins would cause amd64 BIOS jobs to silently pull linux/arm64.
      - name: Log in to quay.io (push per-PR build cache)
        if: ${{ env.PR_CACHE_WRITE == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}
      - name: Build PR
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./
          file: ./Dockerfile
          platforms: linux/arm64
          # Loaded into the local image store and handed to the next job as a
          # tarball artifact. No registry is involved, so this works on a pull
          # request from a fork, which has no secrets.
          load: true
          tags: hadron${{ matrix.kernel == 'cloud' && '-cloud' || '' }}-arm64:${{ github.sha }}
          labels: |
            ${{ steps.meta.outputs.labels }}
          target: default
          cache-from: |
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-grub-${{ matrix.kernel }}-arm64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-container-arm64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-toolchain-arm64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-stage0-arm64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-stage1-merge-arm64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-rsync-arm64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-cmake-arm64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-kernel-misc-${{ matrix.kernel }}-arm64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-systemd-arm64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-python-build-arm64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage0-arm64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage1-merge-arm64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:rsync-arm64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:cmake-arm64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:kernel-misc-${{ matrix.kernel }}-arm64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:systemd-arm64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:python-build-arm64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:toolchain-arm64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:container-arm64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:grub-${{ matrix.kernel }}-arm64,mode=max
          cache-to: ${{ env.PR_CACHE_WRITE == 'true' && format('type=registry,ref=quay.io/kairos/hadron-build-cache:pr-{0}-grub-{1}-arm64,mode=max,ignore-error=true,compression=zstd,compression-level=3,oci-mediatypes=true,image-manifest=true', env.PR_NUM, matrix.kernel) || '' }}
          build-args: |
            BOOTLOADER=grub
            KERNEL_TYPE=${{ matrix.kernel }}
            ARCH=aarch64
            BUILD_ARCH=aarch64

      - name: Save the image as a tarball
        run: |
          docker save hadron${{ matrix.kernel == 'cloud' && '-cloud' || '' }}-arm64:${{ github.sha }} | gzip > hadron-arm64.tar.gz
      - name: Upload the image
        uses: actions/upload-artifact@v7
        with:
          name: hadron${{ matrix.kernel == 'cloud' && '-cloud' || '' }}-arm64-image
          path: hadron-arm64.tar.gz
          if-no-files-found: error
          retention-days: 1
          # already gzipped
          compression-level: 0

  build-kairos-grub-arm64:
    runs-on: ubuntu-26.04-arm
    needs:
      - hadron-grub-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Download the image
        uses: actions/download-artifact@v8
        with:
          name: hadron-cloud-arm64-image
      - name: Load the image
        run: |
          gunzip -c hadron-arm64.tar.gz | docker load
      - name: Download Dockerfile from kairos repository
        run: |
          mkdir -p build
          curl -sSL https://raw.githubusercontent.com/kairos-io/kairos/${{ env.KAIROS_DOCKERFILE_REF }}/images/Dockerfile -o build/Dockerfile.kairos
      # Plain docker build, not buildx. The buildx docker-container driver
      # cannot resolve a FROM against the local image store, and the base image
      # arrives here as a tarball rather than from a registry. This job is a
      # native arm64 build with no cache export, so it needs nothing buildx adds.
      - name: Build the kairos image
        env:
          SOURCE_DATE_EPOCH: 0
        run: |
          docker build ./ \
            --file ./build/Dockerfile.kairos \
            --tag hadron-init-bios-arm64:${{ github.sha }} \
            --build-arg BASE_IMAGE=hadron-cloud-arm64:${{ github.sha }} \
            --build-arg VERSION=v0.0.1-${{ github.sha }} \
            --build-arg TRUSTED_BOOT=false
      - name: Save the image as a tarball
        run: |
          docker save hadron-init-bios-arm64:${{ github.sha }} | gzip > hadron-init-bios-arm64.tar.gz
      - name: Upload the image
        uses: actions/upload-artifact@v7
        with:
          name: hadron-init-bios-arm64-image
          path: hadron-init-bios-arm64.tar.gz
          if-no-files-found: error
          retention-days: 1
          # already gzipped
          compression-level: 0

  build-grub-iso-arm64:
    # Pinned to 24.04 while the rest of the arm64 lane is on 26.04 (#630). This
    # job hands a docker-daemon image to auroraboot, and on ubuntu-26.04-arm
    # auroraboot reads it back as an empty tree: the copy into
    # /output/temp-rootfs "finishes" in seconds, then os-release and the kernel
    # are both missing and the ISO build dies with
    # "No file found with prefixes: [uImage Image zImage vmlinuz image]".
    # build-kairos-grub-arm64, which only builds and uploads that same image,
    # is fine on 26.04 -- so it is the daemon read, not the image. Raise this
    # back once auroraboot copes with the newer engine's image store.
    runs-on: ubuntu-24.04-arm
    needs:
      - build-kairos-grub-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download the image
        uses: actions/download-artifact@v8
        with:
          name: hadron-init-bios-arm64-image
      - name: Load the image
        run: |
          gunzip -c hadron-init-bios-arm64.tar.gz | docker load
      # AuroraBoot mounts the docker socket, so it resolves docker:<name> from
      # the local image store that the load step above populated.
      - name: Build ISO
        run: |
          mkdir build
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock --platform=arm64 \
          -v $PWD/build/:/output \
          quay.io/kairos/auroraboot:v0.21.0-alpha.4 --debug build-iso --output /output/ \
          --override-name kairos-hadron-bios-arm64-${{ github.sha }} \
          docker:hadron-init-bios-arm64:${{ github.sha }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: kairos-hadron-bios-arm64-${{ github.sha }}.iso.zip
          path: build/*.iso

