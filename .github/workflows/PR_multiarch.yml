        uses: actions/setup-go@v7
        # These workers cap at 100Mb/s, so a congested one turns even the Go
        # toolchain download into a crawl, and a worker that cannot manage two
        # minutes here is not going to manage the image pulls later either.
        # Fail it fast rather than burn five minutes first
        # (kairos-io/kairos#4564).
        timeout-minutes: 2
        with:
          go-version-file: tests/go.mod
          # The dependency cache costs more than it saves. Restoring it moves
          # ~305MB where a cold "go mod download" of tests/go.sum moves 124MB,
          # and in run 35681926163 it missed nine times out of twelve. It also
          # writes from a post step, and a step's timeout-minutes covers its
          # post action too, so packing the 449MB module cache ran past the
          # budget above and failed two jobs whose work had already passed.
          cache: false
