---
name: 'PR build and test images (multiarch)'

on:
  pull_request:
  workflow_dispatch:

# Read-only by default. A job that needs more (packages, attestations,
# id-token, pull-requests) asks for it in its own permissions block.
permissions:
  contents: read

concurrency:
  group: ci-image-multiarch-${{ github.head_ref || github.ref }}-${{ github.repository }}
  cancel-in-progress: true

env:
  # Reading the shared BuildKit cache that main writes needs no secret. WRITING
  # a per-PR copy of it does, and the build job only does that when the
  # repository variable PR_CACHE_TO is "true" (default: off, see
  # .github/bake/pr.hcl). Only a run that can read repository secrets may write,
  # and two kinds of run get none; both have to be excluded here. A run that is
  # not excluded does not quietly skip the push: the login step fails with
  # "Username and password required", which fails the build job and skips every
  # job that needs it, so the image is never built and never tested.
  #
  #   1. A pull request from a fork. Its head repository is not this one.
  #   2. A pull request raised by dependabot. Its branch IS in this repository,
  #      so the head check passes, but GitHub withholds secrets from a
  #      pull_request event whose actor is dependabot. See kairos-io/kairos#5481.
  #
  # tests/workflow-secret-gates.sh reads this line and the gate on the login
  # step in build-amd64, and fails if this workflow stops reading a quay
  # credential. Stale pr-* tags are reclaimed by pr-cache-cleanup.yml.
  PR_CACHE_WRITE: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
  PR_NUM: ${{ github.event.pull_request.number }}
  # Pinned commit, not a branch: see the matching comment on
  # KAIROS_DOCKERFILE_REF in the Makefile. Keep the two in sync.
  KAIROS_DOCKERFILE_REF: c2426c11c34198fcb50bfe4d43e827619292e26f
  # Temporary override until a kairos-init release cuts with the merged
  # kairos-io/kairos#5035 (sshd-hardening consolidation this PR carries
  # on the Hadron side). Without it the built ISO ships the released
  # kairos-init (v0.17.3) whose 05-kairos-hardening.conf still sets
  # `PermitRootLogin no`, and assertSSHHardening fails expecting
  # `prohibit-password`. PR 5035 has already merged; the `:master-scratch`
  # kairos-init image tracks kairos master (untested-but-freshest, unlike `:master` which promotes only on green) and carries the merged
  # drop-in content.
  #
  # The pinned images/Dockerfile at KAIROS_DOCKERFILE_REF hard-wires
  # `FROM quay.io/kairos/kairos-init:${KAIROS_INIT}`, so overriding the
  # image reference alone (KAIROS_INIT_IMAGE, etc.) is silently ignored.
  # The kairos-image build job pulls KAIROS_INIT_OVERRIDE_SOURCE, retags
  # it as `quay.io/kairos/kairos-init:${KAIROS_INIT_OVERRIDE_TAG}` in the
  # local docker image store (plain `docker build` resolves FROM against
  # that store), and passes `--build-arg KAIROS_INIT=<tag>` so the FROM
  # in the pinned Dockerfile resolves to the retagged image. It also
  # asserts the override actually took effect on the built image so a
  # dropped arg never masquerades as a wait-for-release.
  #
  # Remove all of this (env + pull + tag + build-arg + assertion) once
  # a kairos release lands with the merged 05-kairos-hardening.conf and
  # the pinned images/Dockerfile's ARG KAIROS_INIT default points at it.
  KAIROS_INIT_OVERRIDE_SOURCE: ghcr.io/kairos-io/kairos/kairos-init:master-scratch
  KAIROS_INIT_OVERRIDE_TAG: master-scratch

jobs:
  # This is the light pass. A pull request builds and boot-tests two flavors,
  # both amd64, default kernel, no FIPS: the bios (grub) image and the trusted
  # (systemd-boot) image. arm64, the cloud kernel and the FIPS flavors are
  # built on main by build-multiarch-images.yml, and the cache tags that main
  # writes are what every job below falls back to, so most of a pull request
  # run is cache hits.
  #
  # Ensure every ghcr source image the Dockerfile references is
  # published before the build starts. On a warm
  # cache this is a quick matrix of manifest inspects; on a cold
  # cache (fresh version bump) it actually fetches and publishes,
  # which can take a couple of minutes. Either way, the build must
  # wait, otherwise its FROM ghcr.io/.../pkg:VER can fail with
  # "not found" while populate-sources is still catching up.
  populate-sources:
    uses: ./.github/workflows/populate-sources.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit

  # The static checks live in quick-checks.yml so the merge queue runs the
  # same list.
  check-kernel-configs:
    uses: ./.github/workflows/quick-checks.yml

  # ============================================================================
  # One build job
  # ============================================================================
  # container, bios, trusted and toolchain are built by one `docker buildx bake`
  # in one BuildKit session on one runner (.github/bake/pr.hcl). A step that
  # two of them share runs once, so the kernel is compiled once (the staged
  # pipeline compiled it in the kernel, toolchain, bios and trusted jobs), and
  # nothing is handed from job to job through a registry: a fork pull request
  # has no secrets to write one with.
  #
  # The only thing the build reads is main's cache (quay.io/kairos/hadron-build-cache,
  # public) and the ghcr source images. What it hands on are three docker-save
  # archives, as artifacts: hadron-amd64-image and hadron-trusted-image, as
  # before, and hadron-container-image for structure-tests-amd64.
  #
  # Runner: the 24-core pool that main builds its kernel, cmake, systemd and
  # bios images on (24 CPUs, 94 GiB, docker 28 on the classic image store, the
  # same host family the cache was written on). 8 steps may run at once.
  build-amd64:
    runs-on: cncf-ubuntu-24-96-x86
    needs: populate-sources
    # A build with nothing cached is expected to take 80 to 100 minutes on this
    # pool. Anything past 150 is a hang (run 43261264198 sat 1h40m without
    # output on a smaller runner).
    timeout-minutes: 150
    permissions:
      contents: read
    env:
      SOURCE_DATE_EPOCH: 0
      SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Disk before the build
        run: df -h / /var/lib/docker
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          cleanup: false
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 8
      - name: Log in to quay.io (push per-PR build cache)
        if: ${{ env.PR_CACHE_WRITE == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}
      - name: Build container, bios, trusted and toolchain in one BuildKit session
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
          # Empty, so nothing is exported, unless an in-repo pull request opts in
          # with the repository variable PR_CACHE_TO=true.
          CACHE_TO_PREFIX: ${{ env.PR_CACHE_WRITE == 'true' && vars.PR_CACHE_TO == 'true' && format('pr-{0}-', env.PR_NUM) || '' }}
        run: |
          set -uo pipefail
          # BuildKit sometimes loses its own content store while it imports the
          # large registry cache layers ("failed commit on ref", "UtimesNanoAt
          # ... no such file or directory"), and a registry can drop a
          # connection in the middle of a pull. That is builder or network
          # state, not the build, so try once more on the same builder, which
          # keeps what the first attempt had finished (kairos-io/hadron#806).
          # A failure that matches none of these is a real one and is not tried
          # again: one RUN of the kernel build takes half an hour.
          flake='failed commit on ref|UtimesNanoAt|buildkit/.*no such file or directory|unexpected EOF|connection reset by peer|TLS handshake timeout|i/o timeout'
          for attempt in 1 2; do
            log="${RUNNER_TEMP}/bake-${attempt}.log"
            if docker buildx bake --builder "${BUILDER}" -f .github/bake/pr.hcl \
                 --provenance=false --sbom=false pr 2>&1 | tee "${log}"; then
              exit 0
            fi
            if [ "${attempt}" -eq 1 ] && grep -qE "${flake}" "${log}"; then
              echo "::warning title=bake attempt 1 failed::the log shows a builder or network error, building again on the same builder"
              continue
            fi
            break
          done
          exit 1
      # Stages that main's cache holds should not run here unless this pull
      # request changed their inputs. This turns a silent rebuild (the kernel
      # taking an hour) into a warning on the run summary.
      - name: Warn about rebuilt upstream stages
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          for log in "${RUNNER_TEMP}"/bake-*.log; do
            [ -e "${log}" ] || continue
            echo "${log##*/}"
            ./hack/ci-rebuild-guard.sh "${log}" '^(skeleton|stage1|stage1-merge|[a-z0-9-]+-stage0|kernel-(base|build|modules|misc|default|cloud))$'
          done
      # The file names carry the variant: image-size-report-amd64 downloads the
      # bios and trusted archives into one workspace, so a shared name would
      # silently overwrite the earlier download.
      - name: Save the images as tarballs
        run: |
          set -euo pipefail
          save() { docker save "$1" | gzip > "$2"; }
          save "hadron-trusted-${SHA}:24h" hadron-trusted.tar.gz &
          trusted=$!
          save "hadron-amd64:${SHA}" hadron-amd64.tar.gz &
          bios=$!
          save "hadron-container-amd64:${SHA}" hadron-container.tar.gz &
          container=$!
          wait "${trusted}"
          wait "${bios}"
          wait "${container}"
      # The trusted chain has the longest tests, so its archive goes up first.
      - name: Upload the trusted image
        uses: actions/upload-artifact@v7
        with:
          name: hadron-trusted-image
          path: hadron-trusted.tar.gz
          if-no-files-found: error
          retention-days: 1
          # already gzipped
          compression-level: 0
      - name: Upload the bios image
        uses: actions/upload-artifact@v7
        with:
          name: hadron-amd64-image
          path: hadron-amd64.tar.gz
          if-no-files-found: error
          retention-days: 1
          # already gzipped
          compression-level: 0
      - name: Upload the container image
        uses: actions/upload-artifact@v7
        with:
          name: hadron-container-image
          path: hadron-container.tar.gz
          if-no-files-found: error
          retention-days: 1
          # already gzipped
          compression-level: 0
      # How much disk one session used, to size the next runner pool by.
      - name: Disk after the build
        if: ${{ !cancelled() }}
        env:
          BUILDER: ${{ steps.buildx.outputs.name }}
        run: |
          df -h / /var/lib/docker
          docker buildx du --builder "${BUILDER}" | tail -n 3 || true

  # The structure tests need only the loaded images, so they run beside the
  # kairos image, ISO and boot-test chain instead of in front of it.
  structure-tests-amd64:
    runs-on: ubuntu-latest
    needs: [build-amd64]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        # These workers cap at 100Mb/s, so a congested one turns even the Go
        # toolchain download into a crawl, and a worker that cannot manage two
        # minutes here is not going to manage the image pulls later either.
        # Fail it fast rather than burn five minutes first
        # (kairos-io/kairos#4564).
        timeout-minutes: 2
        with:
          go-version-file: tests/go.mod
          # The dependency cache costs more than it saves. Restoring it moves
          # ~305MB where a cold "go mod download" of tests/go.sum moves 124MB,
          # and in run 35681926163 it missed nine times out of twelve. It also
          # writes from a post step, and a step's timeout-minutes covers its
          # post action too, so packing the 449MB module cache ran past the
          # budget above and failed two jobs whose work had already passed.
          cache: false
      - name: Download the container image
        uses: actions/download-artifact@v8
        with:
          name: hadron-container-image
      - name: Download the bios image
        uses: actions/download-artifact@v8
        with:
          name: hadron-amd64-image
      - name: Load the images
        run: |
          for f in hadron-container.tar.gz hadron-amd64.tar.gz; do
            gunzip -c "$f" | docker load
          done
      - name: Run image-structure tests
        env:
          CONTAINER_IMAGE: hadron-container-amd64:${{ github.sha }}
        run: |
          cp tests/go.* .
          go mod download
          go run github.com/onsi/ginkgo/v2/ginkgo -v -r --label-filter "image-structure" ./tests/
      - name: Run full-image structure tests
        env:
          # The image-structure run above tests the minimal base. Specs labelled
          # full-image (sshd, sysctl, PAM, firmware layout and the rest)
          # skip there, and the full image is also what downstream
          # consumers pull, so assert them here.
          CONTAINER_IMAGE: hadron-amd64:${{ github.sha }}
        run: |
          go run github.com/onsi/ginkgo/v2/ginkgo -v -r --label-filter "full-image" ./tests/

  component-versions-report-amd64:
    # Informational only: posts a single sticky PR comment with a collapsed
    # section per image showing the full component/version table.
    # Runs on ubuntu-latest (no Docker needed; script reads from the worktree).
    # Never fails the pipeline.
    runs-on: ubuntu-latest
    needs:
      - build-amd64
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Generate combined component versions report
        run: |
          SHA="${{ github.sha }}"

          # Same stage lists the build manifests use, so the report describes
          # the package set actually baked into each image. This block used to
          # carry its own copy of them; the single definition now lives in
          # hack/gen-manifests.sh.
          sh hack/gen-manifests.sh --format md --out-dir /tmp/components --quiet

          {
            printf '## 🧩 Component versions (amd64)\n\n'

            for variant in \
              "container|hadron-container-amd64:${SHA}|container (stage2-merge)" \
              "full-image-no-fips-grub|hadron-amd64:${SHA}|bios / no-fips" \
              "full-image-no-fips-systemd|hadron-trusted-${SHA}:24h|trusted (systemd / no-fips)"
            do
              name="${variant%%|*}"; rest="${variant#*|}"
              image="${rest%%|*}"; label="${rest#*|}"
              printf '<details>\n<summary><code>%s</code> — <code>%s</code></summary>\n\n' "$label" "$image"
              cat "/tmp/components/${name}.md"
              printf '\n</details>\n\n'
            done
          } > /tmp/component-comment.md
      - name: Post sticky PR comment
        # Fork PRs only get a read-only token; never block the pipeline on it.
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: component-versions-report
          path: /tmp/component-comment.md

  build-kairos-bios-amd64:
    runs-on: ubuntu-latest
    needs:
      - build-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # From 2026-10-19 the ubuntu-latest label is Ubuntu 26.04, whose runner
      # image ships docker 29 on the containerd image store. The archive this
      # job saves is read by go-containerregistry inside AuroraBoot, which
      # needs the legacy layout, so ask for the classic store before anything
      # here builds or saves an image.
      - name: Use the classic image store
        uses: ./.github/actions/classic-image-store
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Download the image
        uses: actions/download-artifact@v8
        with:
          name: hadron-amd64-image
      - name: Load the image
        run: |
          gunzip -c hadron-amd64.tar.gz | docker load
      - name: Download Dockerfile from kairos repository
        run: |
          mkdir -p build
          curl -sSL https://raw.githubusercontent.com/kairos-io/kairos/${{ env.KAIROS_DOCKERFILE_REF }}/images/Dockerfile -o build/Dockerfile.kairos
      # Plain docker build, not buildx. The buildx docker-container driver
      # cannot resolve a FROM against the local image store, and the base image
      # arrives here as a tarball rather than from a registry.
      - name: Retag kairos-init PR image into local store as quay tag
        run: |
          docker pull "${KAIROS_INIT_OVERRIDE_SOURCE}"
          docker tag  "${KAIROS_INIT_OVERRIDE_SOURCE}" "quay.io/kairos/kairos-init:${KAIROS_INIT_OVERRIDE_TAG}"
      - name: Build the kairos image
        env:
          SOURCE_DATE_EPOCH: 0
        run: |
          docker build ./ \
            --file ./build/Dockerfile.kairos \
            --tag hadron-init-bios-amd64:${{ github.sha }} \
            --build-arg BASE_IMAGE=hadron-amd64:${{ github.sha }} \
            --build-arg KAIROS_INIT=${{ env.KAIROS_INIT_OVERRIDE_TAG }} \
            --build-arg VERSION=v0.0.1-${{ github.sha }} \
            --build-arg TRUSTED_BOOT=false \
            --build-arg FIPS=no-fips
      - name: Assert the kairos-init override was actually consumed
        # Fails fast if docker silently dropped the KAIROS_INIT build-arg
        # (wrong ARG name, older pinned Dockerfile that hard-codes the
        # image, etc.), so the acceptance red stays honest rather than
        # reading as "waiting on a kairos-init release" forever.
        run: |
          image="hadron-init-bios-amd64:${{ github.sha }}"
          out=$(docker run --rm --entrypoint sh "$image" -c \
            "cat /etc/ssh/sshd_config.d/05-kairos-hardening.conf 2>/dev/null || true")
          if ! printf '%s\n' "$out" | grep -q '^PermitRootLogin prohibit-password'; then
            echo "kairos-init override did NOT reach the built image:"
            echo "$out"
            echo "expected 05-kairos-hardening.conf to carry 'PermitRootLogin prohibit-password' from the merged 05-kairos-hardening.conf"
            exit 1
          fi
      # The recovery test needs an extension inside the image. /var/lib/kairos
      # is an ephemeral overlay, not persistent, so a file written at runtime
      # does not survive a reboot and is not visible to another boot mode. The
      # UKI path uses --overlay-iso for this; the BIOS path has no equivalent,
      # so the fixture goes in as a layer here. It is the verity-only image
      # from tests/assets/sysext-recovery, because a GRUB boot skips a signed
      # extension (kairos-io/kairos#5004).
      - name: Add the recovery extension fixture
        run: |
          # The repository .dockerignore excludes tests/, so the fixture cannot
          # be COPYed from a build context rooted at the repository. It is
          # staged into its own small context instead. Relaxing .dockerignore
          # would pull test files into every hadron image build.
          mkdir -p build/sysext-ctx
          cp tests/assets/sysext-recovery/work.sysext.raw build/sysext-ctx/
          cat > build/sysext-ctx/Dockerfile <<'DOCKERFILE'
          ARG SOURCE_IMAGE
          FROM ${SOURCE_IMAGE}
          COPY work.sysext.raw /var/lib/kairos/extensions/recovery/work.sysext.raw
          DOCKERFILE
          IMAGE=hadron-init-bios-amd64:${{ github.sha }}
          docker build build/sysext-ctx \
            --build-arg SOURCE_IMAGE="${IMAGE}" \
            --tag "${IMAGE}"
      - name: Save the image as a tarball
        run: |
          docker save hadron-init-bios-amd64:${{ github.sha }} | gzip > hadron-init-bios-amd64.tar.gz
      - name: Assert the archive is in the legacy docker-save format
        uses: ./.github/actions/assert-legacy-image-archive
        with:
          archive: hadron-init-bios-amd64.tar.gz
      - name: Upload the image
        uses: actions/upload-artifact@v7
        with:
          name: hadron-init-bios-amd64-image
          path: hadron-init-bios-amd64.tar.gz
          if-no-files-found: error
          retention-days: 1
          # already gzipped
          compression-level: 0

  build-kairos-trusted-amd64:
    runs-on: ubuntu-latest
    needs:
      - build-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # From 2026-10-19 the ubuntu-latest label is Ubuntu 26.04, whose runner
      # image ships docker 29 on the containerd image store. The archive this
      # job saves is read by go-containerregistry inside AuroraBoot, which
      # needs the legacy layout, so ask for the classic store before anything
      # here builds or saves an image.
      - name: Use the classic image store
        uses: ./.github/actions/classic-image-store
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Download the image
        uses: actions/download-artifact@v8
        with:
          name: hadron-trusted-image
      - name: Load the image
        run: |
          gunzip -c hadron-trusted.tar.gz | docker load
      - name: Download Dockerfile from kairos repository
        run: |
          mkdir -p build
          curl -sSL https://raw.githubusercontent.com/kairos-io/kairos/${{ env.KAIROS_DOCKERFILE_REF }}/images/Dockerfile -o build/Dockerfile.kairos
      # Plain docker build, not buildx. The buildx docker-container driver
      # cannot resolve a FROM against the local image store, and the base image
      # arrives here as a tarball rather than from a registry.
      - name: Retag kairos-init PR image into local store as quay tag
        run: |
          docker pull "${KAIROS_INIT_OVERRIDE_SOURCE}"
          docker tag  "${KAIROS_INIT_OVERRIDE_SOURCE}" "quay.io/kairos/kairos-init:${KAIROS_INIT_OVERRIDE_TAG}"
      - name: Build the kairos image
        env:
          SOURCE_DATE_EPOCH: 0
        run: |
          docker build ./ \
            --file ./build/Dockerfile.kairos \
            --tag hadron-init-trusted:${{ github.sha }} \
            --build-arg BASE_IMAGE=hadron-trusted-${{ github.sha }}:24h \
            --build-arg KAIROS_INIT=${{ env.KAIROS_INIT_OVERRIDE_TAG }} \
            --build-arg VERSION=v0.0.1-${{ github.sha }} \
            --build-arg TRUSTED_BOOT=true
      - name: Assert the kairos-init override was actually consumed
        run: |
          image="hadron-init-trusted:${{ github.sha }}"
          out=$(docker run --rm --entrypoint sh "$image" -c \
            "cat /etc/ssh/sshd_config.d/05-kairos-hardening.conf 2>/dev/null || true")
          if ! printf '%s\n' "$out" | grep -q '^PermitRootLogin prohibit-password'; then
            echo "kairos-init override did NOT reach the built image:"
            echo "$out"
            echo "expected 05-kairos-hardening.conf to carry 'PermitRootLogin prohibit-password' from the merged 05-kairos-hardening.conf"
            exit 1
          fi
      - name: Save the image as a tarball
        run: |
          docker save hadron-init-trusted:${{ github.sha }} | gzip > hadron-init-trusted.tar.gz
      - name: Assert the archive is in the legacy docker-save format
        uses: ./.github/actions/assert-legacy-image-archive
        with:
          archive: hadron-init-trusted.tar.gz
      - name: Upload the image
        uses: actions/upload-artifact@v7
        with:
          name: hadron-init-trusted-image
          path: hadron-init-trusted.tar.gz
          if-no-files-found: error
          retention-days: 1
          # already gzipped
          compression-level: 0

  build-bios-iso-amd64:
    runs-on: ubuntu-latest
    needs:
      - build-kairos-bios-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # AuroraBoot resolves docker:<name> through the socket below, so this
      # daemon exports the image as well as holding it, and the export has to
      # be the legacy layout for the same reason the producer's save does.
      # Before Set up Docker Buildx: restarting the daemon would strand a
      # builder container started ahead of it.
      - name: Use the classic image store
        uses: ./.github/actions/classic-image-store
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          cleanup: false
      - name: Download the image
        uses: actions/download-artifact@v8
        with:
          name: hadron-init-bios-amd64-image
      - name: Load the image
        run: |
          gunzip -c hadron-init-bios-amd64.tar.gz | docker load
      # AuroraBoot mounts the docker socket, so it resolves docker:<name> from
      # the local image store that the load step above populated.
      - name: Build ISO
        run: |
          mkdir build
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
          -v $PWD/build/:/output \
          quay.io/kairos/auroraboot:v0.28.0 --debug build-iso --output /output/ \
          --override-name kairos-hadron-bios-${{ github.sha }} \
          docker:hadron-init-bios-amd64:${{ github.sha }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: kairos-hadron-bios-${{ github.sha }}.iso.zip
          path: build/*.iso

  build-trusted-iso-amd64:
    runs-on: ubuntu-latest
    needs:
      - build-kairos-trusted-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # AuroraBoot resolves docker:<name> through the socket below, so this
      # daemon exports the image as well as holding it, and the export has to
      # be the legacy layout for the same reason the producer's save does.
      # Before Set up Docker Buildx: restarting the daemon would strand a
      # builder container started ahead of it.
      - name: Use the classic image store
        uses: ./.github/actions/classic-image-store
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          cleanup: false
      - name: Download the image
        uses: actions/download-artifact@v8
        with:
          name: hadron-init-trusted-image
      - name: Load the image
        run: |
          gunzip -c hadron-init-trusted.tar.gz | docker load
      # AuroraBoot mounts the docker socket, so it resolves docker:<name> from
      # the local image store that the load step above populated.
      - name: Build ISO
        run: | # when agent has fixed the bootentry selection, we can add --sdboot-in-source to use the bundled sdboot
          mkdir build
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
          -v $PWD/tests/assets/keys:/keys \
          -v $PWD/build/:/output \
          -v $PWD/tests/assets/sysext/:/overlay \
          quay.io/kairos/auroraboot:v0.28.0 --debug build-uki \
          --output-dir /output/ --public-keys /keys \
          --tpm-pcr-private-key /keys/tpm2-pcr-private.pem \
          --sb-key /keys/db.key \
          --sb-cert /keys/db.pem \
          --output-type iso \
          --overlay-iso /overlay \
          docker:hadron-init-trusted:${{ github.sha }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: kairos-hadron-trusted-${{ github.sha }}.iso.zip
          path: build/*.iso

  tests-bios-amd64:
    runs-on: cncf-ubuntu-16-64-x86
    name: ${{ matrix.test }} tests
    needs:
      - build-bios-iso-amd64
    permissions:
      contents: read
    strategy:
      matrix:
        test:
          - "acceptance"
          - "reset"
          - "custom-partitioning"
          - "recovery"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Go
        uses: actions/setup-go@v7
        # These workers cap at 100Mb/s, so a congested one turns even the Go
        # toolchain download into a crawl, and a worker that cannot manage two
        # minutes here is not going to manage the image pulls later either.
        # Fail it fast rather than burn five minutes first
        # (kairos-io/kairos#4564).
        timeout-minutes: 2
        with:
          go-version-file: tests/go.mod
          # The dependency cache costs more than it saves. Restoring it moves
          # ~305MB where a cold "go mod download" of tests/go.sum moves 124MB,
          # and in run 35681926163 it missed nine times out of twelve. It also
          # writes from a post step, and a step's timeout-minutes covers its
          # post action too, so packing the 449MB module cache ran past the
          # budget above and failed two jobs whose work had already passed.
          cache: false
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: kairos-hadron-bios-${{ github.sha }}.iso.zip
      - name: Enable KVM group perms
        run: |
          sudo apt-get update
          sudo apt-get install -y libvirt-clients libvirt-daemon-system libvirt-daemon virtinst bridge-utils qemu-system qemu-system-x86 qemu-system-x86 qemu-utils qemu-kvm acl udev mkisofs swtpm
          sudo setfacl -m u:$(id -un):rwx /dev/kvm
      - name: Run tests
        env:
          USE_QEMU: true
          KVM: true
          MEMORY: 5000
          DRIVE_SIZE: 50000
          CREATE_VM: true
          CPUS: 4
        run: |
          export ISO=$PWD/$(ls *.iso|grep -v ipxe | head -1 )
          echo "ISO is: $ISO"
          cp tests/go.* .
          go mod download
          go run github.com/onsi/ginkgo/v2/ginkgo -v --fail-fast -r --label-filter "${{ matrix.test }}" ./tests/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: ${{ matrix.test }}-${{github.sha}}.logs.zip
          path: tests/**/logs/*
          if-no-files-found: warn

  tests-trusted-amd64:
    runs-on: cncf-ubuntu-16-64-x86
    name: ${{ matrix.test }} tests
    needs:
      - build-trusted-iso-amd64
    permissions:
      contents: read
    strategy:
      matrix:
        test:
          - "acceptance-trusted-generic"
          # Breaks every boot of the active entry until systemd-boot's boot
          # assessment fails over to passive (tests/assets/uki-assessment.yaml).
          # It was selected by no job before, so it never ran
          # (kairos-io/kairos#5742).
          - "acceptance-trusted-boot-assessment"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Go
        uses: actions/setup-go@v7
        # These workers cap at 100Mb/s, so a congested one turns even the Go
        # toolchain download into a crawl, and a worker that cannot manage two
        # minutes here is not going to manage the image pulls later either.
        # Fail it fast rather than burn five minutes first
        # (kairos-io/kairos#4564).
        timeout-minutes: 2
        with:
          go-version-file: tests/go.mod
          # The dependency cache costs more than it saves. Restoring it moves
          # ~305MB where a cold "go mod download" of tests/go.sum moves 124MB,
          # and in run 35681926163 it missed nine times out of twelve. It also
          # writes from a post step, and a step's timeout-minutes covers its
          # post action too, so packing the 449MB module cache ran past the
          # budget above and failed two jobs whose work had already passed.
          cache: false
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: kairos-hadron-trusted-${{ github.sha }}.iso.zip
      - name: Enable KVM group perms
        run: |
          sudo apt-get update
          sudo apt-get install -y libvirt-clients libvirt-daemon-system libvirt-daemon virtinst bridge-utils qemu-system qemu-system-x86 qemu-system-x86 qemu-utils qemu-kvm acl udev mkisofs swtpm
          sudo setfacl -m u:$(id -un):rwx /dev/kvm
      - name: Run tests
        env:
          USE_QEMU: true
          KVM: true
          MEMORY: 5000
          DRIVE_SIZE: 50000
          CREATE_VM: true
          CPUS: 4
          FIRMWARE: /usr/share/OVMF/OVMF_CODE_4M.secboot.fd
          EMULATE_TPM: true
          UKI_TEST: true
        run: |
          export ISO=$PWD/$(ls *.iso|grep -v ipxe | head -1 )
          echo "ISO is: $ISO"
          cp tests/go.* .
          go mod download
          go run github.com/onsi/ginkgo/v2/ginkgo -v --fail-fast -r --label-filter "${{ matrix.test }}" ./tests/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          # One name per matrix cell: two failing cells uploading under the
          # same name would make the second upload fail.
          name: ${{ matrix.test }}-${{github.sha}}.logs.zip
          path: tests/**/logs/*
          if-no-files-found: warn

  image-size-report-amd64:
    # Informational only: compares the full images built for this PR against
    # the published :main baseline and posts a sticky PR comment. Never fails.
    runs-on: ubuntu-latest
    needs:
      - build-amd64
    permissions:
      contents: read
      packages: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Log in to ghcr.io (for :main baseline images)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The two PR image variants this report compares against :main arrive as
      # tarball artifacts. Each producer job gave its tarball a variant-specific
      # file name, so both can be downloaded into this one workspace without
      # clobbering each other. Named individually rather than by glob/pattern:
      # a broad pattern risks picking up the (differently named)
      # hadron-init-*-image artifacts from the build-kairos-*-amd64 jobs too.
      # The cloud kernel variants are not built on a pull request, so the
      # report skips them (see image-size-report.sh).
      - name: Download hadron-amd64-image
        uses: actions/download-artifact@v8
        with:
          name: hadron-amd64-image
      - name: Download hadron-trusted-image
        uses: actions/download-artifact@v8
        with:
          name: hadron-trusted-image
      - name: Load the images
        run: |
          for f in hadron-amd64.tar.gz hadron-trusted.tar.gz; do
            gunzip -c "$f" | docker load
          done
      - name: Generate size report
        run: |
          .github/scripts/image-size-report.sh "${{ github.sha }}" "${{ github.repository }}" | tee report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post sticky PR comment
        # Fork PRs only get a read-only token, so posting will fail there; the
        # step summary above is still written. Never block the pipeline on it.
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: image-size-report
          path: report.md

  # One check to require on main instead of every test leg by name. It fails
  # unless every job it needs succeeded, so a skipped or cancelled leg counts
  # as a failure, not as a pass. The merge queue reports a check with the
  # same name from merge-queue.yml, which runs only the quick checks: this
  # pipeline already passed on the pull request, and running it again on the
  # queue branch would add hours to every merge.
  hadron-ci:
    name: hadron-ci
    if: always()
    needs:
      - check-kernel-configs
      - build-amd64
      - structure-tests-amd64
      - tests-bios-amd64
      - tests-trusted-amd64
    runs-on: ubuntu-latest
    steps:
      - name: Every required job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error title=hadron-ci::Not every required job passed: ${failed}"
            exit 1
          fi

  # How long every job waited for a runner and how long it ran, on the run
  # summary and as an artifact, so changes to runners and caching can be
  # compared run to run.
  timing-report:
    if: ${{ always() && !cancelled() }}
    needs:
      - hadron-ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: hack
      - name: Report job timings
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./hack/ci-timing-report.sh timings.json
      - uses: actions/upload-artifact@v7
        if: ${{ hashFiles('timings.json') != '' }}
        with:
          name: ci-timings
          path: timings.json
          retention-days: 30