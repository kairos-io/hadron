---
name: 'PR build and test images (multiarch)'

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-image-multiarch-${{ github.head_ref || github.ref }}-${{ github.repository }}
  cancel-in-progress: true

env:
  # Per-PR BuildKit cache. Each build job reads its own pr-<number>-* tag first
  # (warm from a prior push or an earlier job in this same run) and falls back to
  # the shared main cache tag. Only same-repo PRs can WRITE it (fork PRs have no
  # secrets) — they still read the public cache. Stale pr-* tags are reclaimed by
  # pr-cache-cleanup.yml when the PR closes.
  PR_CACHE_WRITE: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
  PR_NUM: ${{ github.event.pull_request.number }}
  # Pinned commit, not a branch: see the matching comment on
  # KAIROS_DOCKERFILE_REF in the Makefile. Keep the two in sync.
  KAIROS_DOCKERFILE_REF: c2426c11c34198fcb50bfe4d43e827619292e26f

jobs:
  # Ensure every ghcr source image the Dockerfile references is
  # published before any docker/build-push-action starts. On a warm
  # cache this is a quick matrix of manifest inspects; on a cold
  # cache (fresh version bump) it actually fetches and publishes,
  # which can take a couple of minutes. Either way, toolchain must
  # wait, otherwise its FROM ghcr.io/.../pkg:VER can fail with
  # "not found" while populate-sources is still catching up.
  populate-sources:
    uses: ./.github/workflows/populate-sources.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit

  # Kernel config version + BTF checks are arch-independent (they read the
  # single linux version pinned in the Dockerfile), so run them once for
  # all four config files: x86_64 (cloud.config, default.config) and
  # arm64 (cloud-arm64.config, default-arm64.config).
  check-kernel-configs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install PyYAML
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Verify fork-PR upstream source rewrite
        run: make test-render
      - name: Verify the local base image tag invariant
        run: make test-image-tags
      - name: Verify the sources.yaml checksum refresher
        run: make test-source-checksums
      - name: Verify the component-manifest generator
        run: make test-components
      - name: Verify kernel configs are resolved against current kernel version
        run: |
          KERNEL_VERSION=$(awk -F= '/^ARG KERNEL_VERSION=/{print $2; exit}' Dockerfile)
          [[ "$KERNEL_VERSION" =~ ^[0-9]+\.[0-9]+$ ]] && KERNEL_VERSION="${KERNEL_VERSION}.0"
          FAILED=0
          for cfg in files/kernel/cloud.config files/kernel/default.config files/kernel/cloud-arm64.config files/kernel/default-arm64.config; do
            CONFIG_VERSION=$(grep '^# Linux/' "$cfg" | grep -oP '\d+\.\d+(\.\d+)?' || true)
            [[ "$CONFIG_VERSION" =~ ^[0-9]+\.[0-9]+$ ]] && CONFIG_VERSION="${CONFIG_VERSION}.0"
            if [ "$CONFIG_VERSION" != "$KERNEL_VERSION" ]; then
              echo "ERROR: $cfg is stale (generated for $CONFIG_VERSION, current kernel is $KERNEL_VERSION)"
              echo "Run 'make update-kernel-configs' and commit the result."
              FAILED=1
            else
              echo "OK: $cfg matches kernel $KERNEL_VERSION"
            fi
          done
          exit $FAILED
      - name: Verify BTF is enabled in all kernel configs
        run: |
          FAILED=0
          for cfg in files/kernel/cloud.config files/kernel/default.config files/kernel/cloud-arm64.config files/kernel/default-arm64.config; do
            if ! grep -q '^CONFIG_DEBUG_INFO_BTF=y' "$cfg"; then
              echo "ERROR: $cfg is missing CONFIG_DEBUG_INFO_BTF=y"
              FAILED=1
            else
              echo "OK: $cfg has CONFIG_DEBUG_INFO_BTF=y"
            fi
          done
          exit $FAILED

  # ============================================================================
  # amd64 per-stage cache jobs (PR-scoped)
  # ============================================================================
  # Same shape as the main-branch pipeline: one job per compiled sub-tree so
  # each writes its own per-PR cache tag. Splitting the tags means a subsequent
  # push to the same PR gets an already-warm cache down to whichever stage
  # actually changed, instead of a single monolithic toolchain tag that fails
  # to help once anything mid-way is edited.

  stage0-amd64:
    runs-on: cncf-ubuntu-32-128-x86
    needs: populate-sources
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
      - name: Log in to quay.io (push per-PR build cache)
        if: ${{ env.PR_CACHE_WRITE == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}
      - name: Build stage0
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          target: stage0
          cache-from: |
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-stage0-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage0-amd64,mode=max
          cache-to: ${{ env.PR_CACHE_WRITE == 'true' && format('type=registry,ref=quay.io/kairos/hadron-build-cache:pr-{0}-stage0-amd64,mode=max,ignore-error=true,compression=zstd,compression-level=3,oci-mediatypes=true,image-manifest=true', env.PR_NUM) || '' }}

  stage1-amd64:
    runs-on: cncf-ubuntu-32-128-x86
    needs: [stage0-amd64]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
      - name: Log in to quay.io (push per-PR build cache)
        if: ${{ env.PR_CACHE_WRITE == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}
      - name: Build stage1-merge
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          target: stage1-merge
          cache-from: |
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-stage1-merge-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-stage0-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage0-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage1-merge-amd64,mode=max
          cache-to: ${{ env.PR_CACHE_WRITE == 'true' && format('type=registry,ref=quay.io/kairos/hadron-build-cache:pr-{0}-stage1-merge-amd64,mode=max,ignore-error=true,compression=zstd,compression-level=3,oci-mediatypes=true,image-manifest=true', env.PR_NUM) || '' }}

  rsync-amd64:
    runs-on: cncf-ubuntu-16-64-x86
    needs: [stage1-amd64]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
      - name: Log in to quay.io (push per-PR build cache)
        if: ${{ env.PR_CACHE_WRITE == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}
      - name: Build rsync
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          target: rsync
          cache-from: |
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-rsync-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-stage1-merge-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-stage0-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage0-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage1-merge-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:rsync-amd64,mode=max
          cache-to: ${{ env.PR_CACHE_WRITE == 'true' && format('type=registry,ref=quay.io/kairos/hadron-build-cache:pr-{0}-rsync-amd64,mode=max,ignore-error=true,compression=zstd,compression-level=3,oci-mediatypes=true,image-manifest=true', env.PR_NUM) || '' }}

  cmake-amd64:
    runs-on: cncf-ubuntu-32-128-x86
    needs: [rsync-amd64]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
      - name: Log in to quay.io (push per-PR build cache)
        if: ${{ env.PR_CACHE_WRITE == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}
      - name: Build cmake
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          target: cmake
          cache-from: |
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-cmake-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-rsync-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-stage1-merge-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-stage0-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage0-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage1-merge-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:rsync-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:cmake-amd64,mode=max
          cache-to: ${{ env.PR_CACHE_WRITE == 'true' && format('type=registry,ref=quay.io/kairos/hadron-build-cache:pr-{0}-cmake-amd64,mode=max,ignore-error=true,compression=zstd,compression-level=3,oci-mediatypes=true,image-manifest=true', env.PR_NUM) || '' }}

  kernel-amd64:
    runs-on: cncf-ubuntu-32-128-x86
    strategy:
      matrix:
        kernel: [cloud, default]
    needs: [rsync-amd64]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
      - name: Log in to quay.io (push per-PR build cache)
        if: ${{ env.PR_CACHE_WRITE == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}
      - name: Build kernel-misc
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          target: kernel-misc
          cache-from: |
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-kernel-misc-${{ matrix.kernel }}-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-rsync-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-stage1-merge-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-stage0-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage0-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage1-merge-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:rsync-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:kernel-misc-${{ matrix.kernel }}-amd64,mode=max
          cache-to: ${{ env.PR_CACHE_WRITE == 'true' && format('type=registry,ref=quay.io/kairos/hadron-build-cache:pr-{0}-kernel-misc-{1}-amd64,mode=max,ignore-error=true,compression=zstd,compression-level=3,oci-mediatypes=true,image-manifest=true', env.PR_NUM, matrix.kernel) || '' }}
          build-args: |
            KERNEL_TYPE=${{ matrix.kernel }}

  systemd-amd64:
    runs-on: cncf-ubuntu-16-64-x86
    needs: [rsync-amd64]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
      - name: Log in to quay.io (push per-PR build cache)
        if: ${{ env.PR_CACHE_WRITE == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}
      - name: Build systemd
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          target: systemd
          cache-from: |
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-systemd-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-rsync-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-stage1-merge-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-stage0-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage0-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage1-merge-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:rsync-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:systemd-amd64,mode=max
          cache-to: ${{ env.PR_CACHE_WRITE == 'true' && format('type=registry,ref=quay.io/kairos/hadron-build-cache:pr-{0}-systemd-amd64,mode=max,ignore-error=true,compression=zstd,compression-level=3,oci-mediatypes=true,image-manifest=true', env.PR_NUM) || '' }}

  python-amd64:
    runs-on: cncf-ubuntu-16-64-x86
    needs: [rsync-amd64]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
      - name: Log in to quay.io (push per-PR build cache)
        if: ${{ env.PR_CACHE_WRITE == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}
      - name: Build python-build
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          target: python-build
          cache-from: |
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-python-build-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-rsync-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-stage1-merge-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-stage0-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage0-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage1-merge-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:rsync-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:python-build-amd64,mode=max
          cache-to: ${{ env.PR_CACHE_WRITE == 'true' && format('type=registry,ref=quay.io/kairos/hadron-build-cache:pr-{0}-python-build-amd64,mode=max,ignore-error=true,compression=zstd,compression-level=3,oci-mediatypes=true,image-manifest=true', env.PR_NUM) || '' }}

  # ============================================================================
  # arm64 per-stage cache jobs (PR-scoped)
  # ============================================================================
  # Same shape as the main-branch pipeline: one job per compiled sub-tree so
  # each writes its own per-PR cache tag. Splitting the tags means a subsequent
  # push to the same PR gets an already-warm cache down to whichever stage
  # actually changed, instead of a single monolithic toolchain tag that fails
  # to help once anything mid-way is edited.

  stage0-arm64:
    runs-on: cncf-ubuntu-32-128-arm
    needs: populate-sources
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
      - name: Log in to quay.io (push per-PR build cache)
        if: ${{ env.PR_CACHE_WRITE == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}
      - name: Build stage0
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./
          file: ./Dockerfile
          platforms: linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          target: stage0
          cache-from: |
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-stage0-arm64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage0-arm64,mode=max
          cache-to: ${{ env.PR_CACHE_WRITE == 'true' && format('type=registry,ref=quay.io/kairos/hadron-build-cache:pr-{0}-stage0-arm64,mode=max,ignore-error=true,compression=zstd,compression-level=3,oci-mediatypes=true,image-manifest=true', env.PR_NUM) || '' }}
          build-args: |
            ARCH=aarch64
            BUILD_ARCH=aarch64

  stage1-arm64:
    runs-on: cncf-ubuntu-32-128-arm
    needs: [stage0-arm64]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
      - name: Log in to quay.io (push per-PR build cache)
        if: ${{ env.PR_CACHE_WRITE == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}
      - name: Build stage1-merge
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./
          file: ./Dockerfile
          platforms: linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          target: stage1-merge
          cache-from: |
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-stage1-merge-arm64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-stage0-arm64,mode=max
