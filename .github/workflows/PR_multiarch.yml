  component-versions-report-amd64:
    # Informational only: posts a single sticky PR comment with a collapsed
    # section per image showing the full component/version table.
    # Runs on ubuntu-latest (no Docker needed; script reads from the worktree).
    # Never fails the pipeline.
    runs-on: ubuntu-latest
    needs:
      - hadron-bios-amd64
      - hadron-trusted-amd64
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Generate combined component versions report
        run: |
          SHA="${{ github.sha }}"

          # Same stage lists the build manifests use, so the report describes
          # the package set actually baked into each image. This block used to
          # carry its own copy of them; the single definition now lives in
          # hack/gen-manifests.sh.
          sh hack/gen-manifests.sh --format md --out-dir /tmp/components --quiet

          {
            printf '## 🧩 Component versions (amd64)\n\n'

            for variant in \
              "container|hadron-container-amd64:${SHA}|container (stage2-merge)" \
              "full-image-no-fips-grub|hadron-amd64:${SHA}|bios / no-fips" \
              "full-image-no-fips-systemd|hadron-trusted-${SHA}:24h|trusted (systemd / no-fips)"
            do
              name="${variant%%|*}"; rest="${variant#*|}"
              image="${rest%%|*}"; label="${rest#*|}"
              printf '<details>\n<summary><code>%s</code> — <code>%s</code></summary>\n\n' "$label" "$image"
              cat "/tmp/components/${name}.md"
              printf '\n</details>\n\n'
            done
          } > /tmp/component-comment.md
      - name: Post sticky PR comment
        # Fork PRs only get a read-only token; never block the pipeline on it.
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: component-versions-report
          path: /tmp/component-comment.md

  build-kairos-bios-amd64:
    runs-on: ubuntu-latest
    needs:
      - hadron-bios-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # From 2026-10-19 the ubuntu-latest label is Ubuntu 26.04, whose runner
      # image ships docker 29 on the containerd image store. The archive this
      # job saves is read by go-containerregistry inside AuroraBoot, which
      # needs the legacy layout, so ask for the classic store before anything
      # here builds or saves an image.
      - name: Use the classic image store
        uses: ./.github/actions/classic-image-store
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Download the image
        uses: actions/download-artifact@v8
        with:
          name: hadron-amd64-image
      - name: Load the image
        run: |
          gunzip -c hadron-amd64.tar.gz | docker load
      - name: Download Dockerfile from kairos repository
        run: |
          mkdir -p build
          curl -sSL https://raw.githubusercontent.com/kairos-io/kairos/${{ env.KAIROS_DOCKERFILE_REF }}/images/Dockerfile -o build/Dockerfile.kairos
      # Plain docker build, not buildx. The buildx docker-container driver
      # cannot resolve a FROM against the local image store, and the base image
      # arrives here as a tarball rather than from a registry.
      - name: Retag kairos-init PR image into local store as quay tag
        run: |
          docker pull "${KAIROS_INIT_OVERRIDE_SOURCE}"
          docker tag  "${KAIROS_INIT_OVERRIDE_SOURCE}" "quay.io/kairos/kairos-init:${KAIROS_INIT_OVERRIDE_TAG}"
      - name: Build the kairos image
        env:
          SOURCE_DATE_EPOCH: 0
        run: |
          docker build ./ \
            --file ./build/Dockerfile.kairos \
            --tag hadron-init-bios-amd64:${{ github.sha }} \
            --build-arg BASE_IMAGE=hadron-amd64:${{ github.sha }} \
            --build-arg KAIROS_INIT=${{ env.KAIROS_INIT_OVERRIDE_TAG }} \
            --build-arg VERSION=v0.0.1-${{ github.sha }} \
            --build-arg TRUSTED_BOOT=false \
            --build-arg FIPS=no-fips
      - name: Assert the kairos-init override was actually consumed
        # Fails fast if docker silently dropped the KAIROS_INIT build-arg
        # (wrong ARG name, older pinned Dockerfile that hard-codes the
        # image, etc.), so the acceptance red stays honest rather than
        # reading as "waiting on a kairos-init release" forever.
        run: |
          image="hadron-init-bios-amd64:${{ github.sha }}"
          out=$(docker run --rm --entrypoint sh "$image" -c \
            "cat /etc/ssh/sshd_config.d/05-kairos-hardening.conf 2>/dev/null || true")
          if ! printf '%s\n' "$out" | grep -q '^PermitRootLogin prohibit-password'; then
            echo "kairos-init override did NOT reach the built image:"
            echo "$out"
            echo "expected 05-kairos-hardening.conf to carry 'PermitRootLogin prohibit-password' from the merged 05-kairos-hardening.conf"
            exit 1
          fi
      # The recovery test needs an extension inside the image. /var/lib/kairos
      # is an ephemeral overlay, not persistent, so a file written at runtime
      # does not survive a reboot and is not visible to another boot mode. The
      # UKI path uses --overlay-iso for this; the BIOS path has no equivalent,
      # so the fixture goes in as a layer here. It is the verity-only image
      # from tests/assets/sysext-recovery, because a GRUB boot skips a signed
      # extension (kairos-io/kairos#5004).
      - name: Add the recovery extension fixture
        run: |
          # The repository .dockerignore excludes tests/, so the fixture cannot
          # be COPYed from a build context rooted at the repository. It is
          # staged into its own small context instead. Relaxing .dockerignore
          # would pull test files into every hadron image build.
          mkdir -p build/sysext-ctx
          cp tests/assets/sysext-recovery/work.sysext.raw build/sysext-ctx/
          cat > build/sysext-ctx/Dockerfile <<'DOCKERFILE'
          ARG SOURCE_IMAGE
          FROM ${SOURCE_IMAGE}
          COPY work.sysext.raw /var/lib/kairos/extensions/recovery/work.sysext.raw
          DOCKERFILE
          IMAGE=hadron-init-bios-amd64:${{ github.sha }}
          docker build build/sysext-ctx \
            --build-arg SOURCE_IMAGE="${IMAGE}" \
            --tag "${IMAGE}"
      - name: Save the image as a tarball
        run: |
          docker save hadron-init-bios-amd64:${{ github.sha }} | gzip > hadron-init-bios-amd64.tar.gz
      - name: Assert the archive is in the legacy docker-save format
        uses: ./.github/actions/assert-legacy-image-archive
        with:
          archive: hadron-init-bios-amd64.tar.gz
      - name: Upload the image
        uses: actions/upload-artifact@v7
        with:
          name: hadron-init-bios-amd64-image
          path: hadron-init-bios-amd64.tar.gz
          if-no-files-found: error
          retention-days: 1
          # already gzipped
          compression-level: 0

  build-kairos-trusted-amd64:
    runs-on: ubuntu-latest
    needs:
      - hadron-trusted-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # From 2026-10-19 the ubuntu-latest label is Ubuntu 26.04, whose runner
      # image ships docker 29 on the containerd image store. The archive this
      # job saves is read by go-containerregistry inside AuroraBoot, which
      # needs the legacy layout, so ask for the classic store before anything
      # here builds or saves an image.
      - name: Use the classic image store
        uses: ./.github/actions/classic-image-store
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Download the image
        uses: actions/download-artifact@v8
        with:
          name: hadron-trusted-image
      - name: Load the image
        run: |
          gunzip -c hadron-trusted.tar.gz | docker load
      - name: Download Dockerfile from kairos repository
        run: |
          mkdir -p build
          curl -sSL https://raw.githubusercontent.com/kairos-io/kairos/${{ env.KAIROS_DOCKERFILE_REF }}/images/Dockerfile -o build/Dockerfile.kairos
      # Plain docker build, not buildx. The buildx docker-container driver
      # cannot resolve a FROM against the local image store, and the base image
      # arrives here as a tarball rather than from a registry.
      - name: Retag kairos-init PR image into local store as quay tag
        run: |
          docker pull "${KAIROS_INIT_OVERRIDE_SOURCE}"
          docker tag  "${KAIROS_INIT_OVERRIDE_SOURCE}" "quay.io/kairos/kairos-init:${KAIROS_INIT_OVERRIDE_TAG}"
      - name: Build the kairos image
        env:
          SOURCE_DATE_EPOCH: 0
        run: |
          docker build ./ \
            --file ./build/Dockerfile.kairos \
            --tag hadron-init-trusted:${{ github.sha }} \
            --build-arg BASE_IMAGE=hadron-trusted-${{ github.sha }}:24h \
            --build-arg KAIROS_INIT=${{ env.KAIROS_INIT_OVERRIDE_TAG }} \
            --build-arg VERSION=v0.0.1-${{ github.sha }} \
            --build-arg TRUSTED_BOOT=true
      - name: Assert the kairos-init override was actually consumed
        run: |
          image="hadron-init-trusted:${{ github.sha }}"
          out=$(docker run --rm --entrypoint sh "$image" -c \
            "cat /etc/ssh/sshd_config.d/05-kairos-hardening.conf 2>/dev/null || true")
          if ! printf '%s\n' "$out" | grep -q '^PermitRootLogin prohibit-password'; then
            echo "kairos-init override did NOT reach the built image:"
            echo "$out"
            echo "expected 05-kairos-hardening.conf to carry 'PermitRootLogin prohibit-password' from the merged 05-kairos-hardening.conf"
            exit 1
          fi
      - name: Save the image as a tarball
        run: |
          docker save hadron-init-trusted:${{ github.sha }} | gzip > hadron-init-trusted.tar.gz
      - name: Assert the archive is in the legacy docker-save format
        uses: ./.github/actions/assert-legacy-image-archive
        with:
          archive: hadron-init-trusted.tar.gz
      - name: Upload the image
        uses: actions/upload-artifact@v7
        with:
          name: hadron-init-trusted-image
          path: hadron-init-trusted.tar.gz
          if-no-files-found: error
          retention-days: 1
          # already gzipped
          compression-level: 0

  build-bios-iso-amd64:
    runs-on: ubuntu-latest
    needs:
      - build-kairos-bios-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # AuroraBoot resolves docker:<name> through the socket below, so this
      # daemon exports the image as well as holding it, and the export has to
      # be the legacy layout for the same reason the producer's save does.
      # Before Set up Docker Buildx: restarting the daemon would strand a
      # builder container started ahead of it.
      - name: Use the classic image store
        uses: ./.github/actions/classic-image-store
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          cleanup: false
      - name: Download the image
        uses: actions/download-artifact@v8
        with:
          name: hadron-init-bios-amd64-image
      - name: Load the image
        run: |
          gunzip -c hadron-init-bios-amd64.tar.gz | docker load
      # AuroraBoot mounts the docker socket, so it resolves docker:<name> from
      # the local image store that the load step above populated.
      - name: Build ISO
        run: |
          mkdir build
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
          -v $PWD/build/:/output \
          quay.io/kairos/auroraboot:v0.28.0 --debug build-iso --output /output/ \
          --override-name kairos-hadron-bios-${{ github.sha }} \
          docker:hadron-init-bios-amd64:${{ github.sha }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: kairos-hadron-bios-${{ github.sha }}.iso.zip
          path: build/*.iso

  build-trusted-iso-amd64:
    runs-on: ubuntu-latest
    needs:
      - build-kairos-trusted-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      # AuroraBoot resolves docker:<name> through the socket below, so this
      # daemon exports the image as well as holding it, and the export has to
      # be the legacy layout for the same reason the producer's save does.
      # Before Set up Docker Buildx: restarting the daemon would strand a
      # builder container started ahead of it.
      - name: Use the classic image store
        uses: ./.github/actions/classic-image-store
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          cleanup: false
      - name: Download the image
        uses: actions/download-artifact@v8
        with:
          name: hadron-init-trusted-image
      - name: Load the image
        run: |
          gunzip -c hadron-init-trusted.tar.gz | docker load
      # AuroraBoot mounts the docker socket, so it resolves docker:<name> from
      # the local image store that the load step above populated.
      - name: Build ISO
        run: | # when agent has fixed the bootentry selection, we can add --sdboot-in-source to use the bundled sdboot
          mkdir build
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
          -v $PWD/tests/assets/keys:/keys \
          -v $PWD/build/:/output \
          -v $PWD/tests/assets/sysext/:/overlay \
          quay.io/kairos/auroraboot:v0.28.0 --debug build-uki \
          --output-dir /output/ --public-keys /keys \
          --tpm-pcr-private-key /keys/tpm2-pcr-private.pem \
          --sb-key /keys/db.key \
          --sb-cert /keys/db.pem \
          --output-type iso \
          --overlay-iso /overlay \
          docker:hadron-init-trusted:${{ github.sha }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: kairos-hadron-trusted-${{ github.sha }}.iso.zip
          path: build/*.iso

  tests-bios-amd64:
    runs-on: cncf-ubuntu-16-64-x86
    name: ${{ matrix.test }} tests
    needs:
      - build-bios-iso-amd64
    permissions:
      contents: read
    strategy:
      matrix:
        test:
          - "acceptance"
          - "reset"
          - "custom-partitioning"
          - "recovery"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Go
        uses: actions/setup-go@v7
        # These workers cap at 100Mb/s, so a congested one turns even the Go
        # toolchain download into a crawl, and a worker that cannot manage two
        # minutes here is not going to manage the image pulls later either.
        # Fail it fast rather than burn five minutes first
        # (kairos-io/kairos#4564).
        timeout-minutes: 2
        with:
          go-version-file: tests/go.mod
          # The dependency cache costs more than it saves. Restoring it moves
          # ~305MB where a cold "go mod download" of tests/go.sum moves 124MB,
          # and in run 35681926163 it missed nine times out of twelve. It also
          # writes from a post step, and a step's timeout-minutes covers its
          # post action too, so packing the 449MB module cache ran past the
          # budget above and failed two jobs whose work had already passed.
          cache: false
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: kairos-hadron-bios-${{ github.sha }}.iso.zip
      - name: Enable KVM group perms
        run: |
          sudo apt-get update
          sudo apt-get install -y libvirt-clients libvirt-daemon-system libvirt-daemon virtinst bridge-utils qemu-system qemu-system-x86 qemu-system-x86 qemu-utils qemu-kvm acl udev mkisofs swtpm
          sudo setfacl -m u:$(id -un):rwx /dev/kvm
      - name: Run tests
        env:
          USE_QEMU: true
          KVM: true
          MEMORY: 5000
          DRIVE_SIZE: 50000
          CREATE_VM: true
          CPUS: 4
        run: |
          export ISO=$PWD/$(ls *.iso|grep -v ipxe | head -1 )
          echo "ISO is: $ISO"
          cp tests/go.* .
          go mod download
          go run github.com/onsi/ginkgo/v2/ginkgo -v --fail-fast -r --label-filter "${{ matrix.test }}" ./tests/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: ${{ matrix.test }}-${{github.sha}}.logs.zip
          path: tests/**/logs/*
          if-no-files-found: warn

  tests-trusted-amd64:
    runs-on: cncf-ubuntu-16-64-x86
    name: ${{ matrix.test }} tests
    needs:
      - build-trusted-iso-amd64
    permissions:
      contents: read
    strategy:
      matrix:
        test:
          - "acceptance-trusted-generic"
          # Breaks every boot of the active entry until systemd-boot's boot
          # assessment fails over to passive (tests/assets/uki-assessment.yaml).
          # It was selected by no job before, so it never ran
          # (kairos-io/kairos#5742).
          - "acceptance-trusted-boot-assessment"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Go
        uses: actions/setup-go@v7
        # These workers cap at 100Mb/s, so a congested one turns even the Go
        # toolchain download into a crawl, and a worker that cannot manage two
        # minutes here is not going to manage the image pulls later either.
        # Fail it fast rather than burn five minutes first
        # (kairos-io/kairos#4564).
        timeout-minutes: 2
        with:
          go-version-file: tests/go.mod
          # The dependency cache costs more than it saves. Restoring it moves
          # ~305MB where a cold "go mod download" of tests/go.sum moves 124MB,
          # and in run 35681926163 it missed nine times out of twelve. It also
          # writes from a post step, and a step's timeout-minutes covers its
          # post action too, so packing the 449MB module cache ran past the
          # budget above and failed two jobs whose work had already passed.
          cache: false
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: kairos-hadron-trusted-${{ github.sha }}.iso.zip
      - name: Enable KVM group perms
        run: |
          sudo apt-get update
          sudo apt-get install -y libvirt-clients libvirt-daemon-system libvirt-daemon virtinst bridge-utils qemu-system qemu-system-x86 qemu-system-x86 qemu-utils qemu-kvm acl udev mkisofs swtpm
          sudo setfacl -m u:$(id -un):rwx /dev/kvm
      - name: Run tests
        env:
          USE_QEMU: true
          KVM: true
          MEMORY: 5000
          DRIVE_SIZE: 50000
          CREATE_VM: true
          CPUS: 4
          FIRMWARE: /usr/share/OVMF/OVMF_CODE_4M.secboot.fd
          EMULATE_TPM: true
          UKI_TEST: true
        run: |
          export ISO=$PWD/$(ls *.iso|grep -v ipxe | head -1 )
          echo "ISO is: $ISO"
          cp tests/go.* .
          go mod download
          go run github.com/onsi/ginkgo/v2/ginkgo -v --fail-fast -r --label-filter "${{ matrix.test }}" ./tests/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          # One name per matrix cell: two failing cells uploading under the
          # same name would make the second upload fail.
          name: ${{ matrix.test }}-${{github.sha}}.logs.zip
          path: tests/**/logs/*
          if-no-files-found: warn

  image-size-report-amd64:
    # Informational only: compares the full images built for this PR against
    # the published :main baseline and posts a sticky PR comment. Never fails.
    runs-on: ubuntu-latest
    needs:
      - hadron-bios-amd64
      - hadron-trusted-amd64
    permissions:
      contents: read
      packages: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Log in to ghcr.io (for :main baseline images)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The two PR image variants this report compares against :main arrive as
      # tarball artifacts. Each producer job gave its tarball a variant-specific
      # file name, so both can be downloaded into this one workspace without
      # clobbering each other. Named individually rather than by glob/pattern:
      # a broad pattern risks picking up the (differently named)
      # hadron-init-*-image artifacts from the build-kairos-*-amd64 jobs too.
      # The cloud kernel variants are not built on a pull request, so the
      # report skips them (see image-size-report.sh).
      - name: Download hadron-amd64-image
        uses: actions/download-artifact@v8
        with:
          name: hadron-amd64-image
      - name: Download hadron-trusted-image
        uses: actions/download-artifact@v8
        with:
          name: hadron-trusted-image
      - name: Load the images
        run: |
          for f in hadron-amd64.tar.gz hadron-trusted.tar.gz; do
            gunzip -c "$f" | docker load
          done
      - name: Generate size report
        run: |
          .github/scripts/image-size-report.sh "${{ github.sha }}" "${{ github.repository }}" | tee report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post sticky PR comment
        # Fork PRs only get a read-only token, so posting will fail there; the
        # step summary above is still written. Never block the pipeline on it.
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: image-size-report
          path: report.md

  # One check to require on main instead of every test leg by name. It fails
  # unless every job it needs succeeded, so a skipped or cancelled leg counts
  # as a failure, not as a pass. The merge queue reports a check with the
  # same name from merge-queue.yml, which runs only the quick checks: this
  # pipeline already passed on the pull request, and running it again on the
  # queue branch would add hours to every merge.
  hadron-ci:
    name: hadron-ci
    if: always()
    needs:
      - check-kernel-configs
      - tests-bios-amd64
      - tests-trusted-amd64
    runs-on: ubuntu-latest
    steps:
      - name: Every required job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error title=hadron-ci::Not every required job passed: ${failed}"
            exit 1
          fi
