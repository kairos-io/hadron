---
name: 'PR build and test images (multiarch)'

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-image-multiarch-${{ github.head_ref || github.ref }}-${{ github.repository }}
  cancel-in-progress: true

env:
  # Per-PR BuildKit cache. Each build job reads its own pr-<number>-* tag first
  # (warm from a prior push or an earlier job in this same run) and falls back to
  # the shared main cache tag. Only same-repo PRs can WRITE it (fork PRs have no
  # secrets) — they still read the public cache. Stale pr-* tags are reclaimed by
  # pr-cache-cleanup.yml when the PR closes.
  PR_CACHE_WRITE: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
  PR_NUM: ${{ github.event.pull_request.number }}

jobs:
  # Ensure every ghcr source image the Dockerfile references is
  # published before any docker/build-push-action starts. On a warm
  # cache this is a quick matrix of manifest inspects; on a cold
  # cache (fresh version bump) it actually fetches and publishes,
  # which can take a couple of minutes. Either way, toolchain must
  # wait, otherwise its FROM ghcr.io/.../pkg:VER can fail with
  # "not found" while populate-sources is still catching up.
  populate-sources:
    uses: ./.github/workflows/populate-sources.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit

  # Kernel config version + BTF checks are arch-independent (they read the
  # single linux version from sources.yaml), so run them once for all four
  # config files: x86_64 (cloud.config, default.config) and arm64
  # (cloud-arm64.config, default-arm64.config).
  check-kernel-configs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Verify kernel configs are resolved against current kernel version
        run: |
          KERNEL_VERSION=$(python3 -c "import yaml; print(yaml.safe_load(open('sources.yaml'))['packages']['linux']['version'])")
          [[ "$KERNEL_VERSION" =~ ^[0-9]+\.[0-9]+$ ]] && KERNEL_VERSION="${KERNEL_VERSION}.0"
          FAILED=0
          for cfg in files/kernel/cloud.config files/kernel/default.config files/kernel/cloud-arm64.config files/kernel/default-arm64.config; do
            CONFIG_VERSION=$(grep '^# Linux/' "$cfg" | grep -oP '\d+\.\d+(\.\d+)?' || true)
            [[ "$CONFIG_VERSION" =~ ^[0-9]+\.[0-9]+$ ]] && CONFIG_VERSION="${CONFIG_VERSION}.0"
            if [ "$CONFIG_VERSION" != "$KERNEL_VERSION" ]; then
              echo "ERROR: $cfg is stale (generated for $CONFIG_VERSION, current kernel is $KERNEL_VERSION)"
              echo "Run 'make update-kernel-configs' and commit the result."
              FAILED=1
            else
              echo "OK: $cfg matches kernel $KERNEL_VERSION"
            fi
          done
          exit $FAILED
      - name: Verify BTF is enabled in all kernel configs
        run: |
          FAILED=0
          for cfg in files/kernel/cloud.config files/kernel/default.config files/kernel/cloud-arm64.config files/kernel/default-arm64.config; do
            if ! grep -q '^CONFIG_DEBUG_INFO_BTF=y' "$cfg"; then
              echo "ERROR: $cfg is missing CONFIG_DEBUG_INFO_BTF=y"
              FAILED=1
            else
              echo "OK: $cfg has CONFIG_DEBUG_INFO_BTF=y"
            fi
          done
          exit $FAILED

  toolchain-amd64:
    runs-on: oracle-vm-32cpu-128gb-x86-64
    needs: populate-sources
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
      - name: Log in to quay.io (push per-PR build cache)
        if: ${{ env.PR_CACHE_WRITE == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}
      - name: Build PR
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64
          tags: ttl.sh/hadron-toolchain-amd64:${{ github.sha }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            cache-label=quay-remote-amd64
          cache-from: |
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-toolchain-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:toolchain-amd64,mode=max
          cache-to: ${{ env.PR_CACHE_WRITE == 'true' && format('type=registry,ref=quay.io/kairos/hadron-build-cache:pr-{0}-toolchain-amd64,mode=max,ignore-error=true,compression=zstd,compression-level=3,oci-mediatypes=true,image-manifest=true', env.PR_NUM) || '' }}
          target: toolchain

  toolchain-arm64:
    runs-on: oracle-vm-32cpu-128gb-arm64
    needs: populate-sources
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
      - name: Log in to quay.io (push per-PR build cache)
        if: ${{ env.PR_CACHE_WRITE == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}
      - name: Build PR
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./
          file: ./Dockerfile
          platforms: linux/arm64
          tags: ttl.sh/hadron-toolchain-arm64:${{ github.sha }}
          labels: |
            ${{ steps.meta.outputs.labels }}
          target: toolchain
          cache-from: |
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-toolchain-arm64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:toolchain-arm64,mode=max
          cache-to: ${{ env.PR_CACHE_WRITE == 'true' && format('type=registry,ref=quay.io/kairos/hadron-build-cache:pr-{0}-toolchain-arm64,mode=max,ignore-error=true,compression=zstd,compression-level=3,oci-mediatypes=true,image-manifest=true', env.PR_NUM) || '' }}
          build-args: |
            ARCH=aarch64
            BUILD_ARCH=aarch64

  container-amd64:
    runs-on: oracle-vm-32cpu-128gb-x86-64
    needs:
      - toolchain-amd64
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
      - name: Log in to quay.io (push per-PR build cache)
        if: ${{ env.PR_CACHE_WRITE == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}
      - name: Build PR
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64
          # load into the local docker image store so the structure tests below
          # can `docker run` it without a registry round-trip.
          load: true
          tags: ttl.sh/hadron-container-amd64:${{ github.sha }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            cache-label=quay-remote-amd64
          cache-from: |
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-container-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-toolchain-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:toolchain-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:container-amd64,mode=max
          cache-to: ${{ env.PR_CACHE_WRITE == 'true' && format('type=registry,ref=quay.io/kairos/hadron-build-cache:pr-{0}-container-amd64,mode=max,ignore-error=true,compression=zstd,compression-level=3,oci-mediatypes=true,image-manifest=true', env.PR_NUM) || '' }}
          target: container
      - name: Test container image (build-time smoke)
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64
          target: container-test
          cache-from: |
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-container-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-toolchain-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:toolchain-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:container-amd64,mode=max
      - name: Install Go
        uses: actions/setup-go@v7
        timeout-minutes: 5
        with:
          go-version-file: tests/go.mod
          cache-dependency-path: tests/go.sum
      - name: Run image-structure tests
        env:
          # Image was loaded locally by the build step above (no push needed).
          CONTAINER_IMAGE: ttl.sh/hadron-container-amd64:${{ github.sha }}
        run: |
          cp tests/go.* .
          go mod download
          go run github.com/onsi/ginkgo/v2/ginkgo -v -r --label-filter "image-structure" ./tests/

  container-arm64:
    runs-on: oracle-vm-32cpu-128gb-arm64
    needs:
      - toolchain-arm64
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
      - name: Log in to quay.io (push per-PR build cache)
        if: ${{ env.PR_CACHE_WRITE == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}
      - name: Build PR
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./
          file: ./Dockerfile
          platforms: linux/arm64
          # load into the local docker image store so the structure tests below
          # can `docker run` it without a registry round-trip.
          load: true
          tags: ttl.sh/hadron-container-arm64:${{ github.sha }}
          labels: |
            ${{ steps.meta.outputs.labels }}
          target: container
          cache-from: |
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-container-arm64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-toolchain-arm64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:toolchain-arm64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:container-arm64,mode=max
          cache-to: ${{ env.PR_CACHE_WRITE == 'true' && format('type=registry,ref=quay.io/kairos/hadron-build-cache:pr-{0}-container-arm64,mode=max,ignore-error=true,compression=zstd,compression-level=3,oci-mediatypes=true,image-manifest=true', env.PR_NUM) || '' }}
          build-args: |
            ARCH=aarch64
            BUILD_ARCH=aarch64
      - name: Test container image (build-time smoke)
        uses: docker/build-push-action@v7
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./
          file: ./Dockerfile
          platforms: linux/arm64
          target: container-test
          cache-from: |
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-container-arm64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-toolchain-arm64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:toolchain-arm64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:container-arm64,mode=max
          build-args: |
            ARCH=aarch64
            BUILD_ARCH=aarch64
      - name: Install Go
        uses: actions/setup-go@v7
        timeout-minutes: 5
        with:
          go-version-file: tests/go.mod
          cache-dependency-path: tests/go.sum
      - name: Run image-structure tests
        env:
          # Image was loaded locally by the build step above (no push needed).
          CONTAINER_IMAGE: ttl.sh/hadron-container-arm64:${{ github.sha }}
        run: |
          cp tests/go.* .
          go mod download
          go run github.com/onsi/ginkgo/v2/ginkgo -v -r --label-filter "image-structure" ./tests/

  hadron-bios-amd64:
    runs-on: oracle-vm-32cpu-128gb-x86-64
    needs:
      - container-amd64  # Take advantage of cached layers from the container build
    strategy:
      matrix:
        kernel: ["cloud", "default"]
        fips: [ "no-fips" ]
        include:
          - kernel: "cloud"
            fips: "fips"
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
      - name: Log in to quay.io (push per-PR build cache)
        if: ${{ env.PR_CACHE_WRITE == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}
      - name: Build PR
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          # Keep ephemeral ttl.sh indexes simple; the arm64 pipeline in this workflow uses separate *-arm64 tags
          # so this tag is not clobbered by the arm64 jobs (same github.sha).
          provenance: false
          tags: ttl.sh/hadron${{ matrix.kernel == 'cloud' && '-cloud' || '' }}${{ matrix.fips == 'fips' && '-fips' || '' }}-amd64:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          target: default
          cache-from: |
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-bios-${{ matrix.kernel }}-${{ matrix.fips }}-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-container-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-toolchain-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:toolchain-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:container-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:bios-${{ matrix.kernel }}-${{ matrix.fips }}-amd64,mode=max
          cache-to: ${{ env.PR_CACHE_WRITE == 'true' && format('type=registry,ref=quay.io/kairos/hadron-build-cache:pr-{0}-bios-{1}-{2}-amd64,mode=max,ignore-error=true,compression=zstd,compression-level=3,oci-mediatypes=true,image-manifest=true', env.PR_NUM, matrix.kernel, matrix.fips) || '' }}
          build-args: |
            BOOTLOADER=grub
            KERNEL_TYPE=${{ matrix.kernel }}
            FIPS=${{ matrix.fips }}

  hadron-trusted-amd64:
    runs-on: oracle-vm-32cpu-128gb-x86-64
    needs:
      - container-amd64  # Take advantage of cached layers from the container build
    strategy:
      matrix:
        kernel: [ "cloud", "default" ]
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
      - name: Log in to quay.io (push per-PR build cache)
        if: ${{ env.PR_CACHE_WRITE == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}
      - name: Build PR
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ttl.sh/hadron${{ matrix.kernel == 'cloud' && '-cloud' || '' }}-trusted-${{ github.sha }}:24h
          labels: ${{ steps.meta.outputs.labels }}
          target: default
          cache-from: |
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-trusted-${{ matrix.kernel }}-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-container-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-toolchain-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:toolchain-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:container-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:trusted-${{ matrix.kernel }}-amd64,mode=max
          cache-to: ${{ env.PR_CACHE_WRITE == 'true' && format('type=registry,ref=quay.io/kairos/hadron-build-cache:pr-{0}-trusted-{1}-amd64,mode=max,ignore-error=true,compression=zstd,compression-level=3,oci-mediatypes=true,image-manifest=true', env.PR_NUM, matrix.kernel) || '' }}
          build-args: |
            BOOTLOADER=systemd
            KERNEL_TYPE=${{ matrix.kernel }}

  component-versions-report-amd64:
    # Informational only: posts a single sticky PR comment with a collapsed
    # section per image showing the full component/version table.
    # Runs on ubuntu-latest (no Docker needed; script reads from the worktree).
    # Never fails the pipeline.
    runs-on: ubuntu-latest
    needs:
      - hadron-bios-amd64
      - hadron-trusted-amd64
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Generate combined component versions report
        run: |
          SHA="${{ github.sha }}"
          mkdir -p /tmp/components

          # container image
          sh hack/gen-components.sh \
            --shipped "stage2-merge" \
            --format md --name container --out-dir /tmp/components

          # full-image bios / no-fips
          sh hack/gen-components.sh \
            --shipped "stage2-merge full-image-merge-base full-image-merge-no-fips full-image-pre-grub full-image-pre-preset full-image-final" \
            --format md --name full-image-bios-no-fips --out-dir /tmp/components

          # full-image bios / fips (openssl version swapped)
          sh hack/gen-components.sh \
            --shipped "stage2-merge full-image-merge-base full-image-merge-fips full-image-pre-grub full-image-pre-preset full-image-final" \
            --override openssl=OPENSSL_FIPS_VERSION \
            --format md --name full-image-bios-fips --out-dir /tmp/components

          # full-image trusted / no-fips
          sh hack/gen-components.sh \
            --shipped "stage2-merge full-image-merge-base full-image-merge-no-fips full-image-pre-systemd full-image-pre-preset full-image-final" \
            --format md --name full-image-trusted --out-dir /tmp/components

          {
            printf '## 🧩 Component versions (amd64)\n\n'

            for variant in \
              "container|ttl.sh/hadron-container-amd64:${SHA}|container (stage2-merge)" \
              "full-image-bios-no-fips|ttl.sh/hadron-cloud-amd64:${SHA}|bios / no-fips" \
              "full-image-bios-fips|ttl.sh/hadron-cloud-fips-amd64:${SHA}|bios / fips" \
              "full-image-trusted|ttl.sh/hadron-cloud-trusted-${SHA}:24h|trusted (systemd / no-fips)"
            do
              name="${variant%%|*}"; rest="${variant#*|}"
              image="${rest%%|*}"; label="${rest#*|}"
              printf '<details>\n<summary><code>%s</code> — <code>%s</code></summary>\n\n' "$label" "$image"
              cat "/tmp/components/${name}.md"
              printf '\n</details>\n\n'
            done
          } > /tmp/component-comment.md
      - name: Post sticky PR comment
        # Fork PRs only get a read-only token; never block the pipeline on it.
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: component-versions-report
          path: /tmp/component-comment.md

  build-kairos-bios-amd64:
    runs-on: ubuntu-latest
    needs:
      - hadron-bios-amd64
    strategy:
      matrix:
        fips: [ "no-fips", "fips" ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
      - name: Download Dockerfile from kairos repository
        run: |
          mkdir -p build
          curl -sSL https://raw.githubusercontent.com/kairos-io/kairos/master/images/Dockerfile -o build/Dockerfile.kairos
      - name: Build and push
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./
          file: ./build/Dockerfile.kairos
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ttl.sh/hadron-init-bios${{ matrix.fips == 'fips' && '-fips' || '' }}-amd64:${{ github.sha }}
          build-args: |
            BASE_IMAGE=ttl.sh/hadron-cloud${{ matrix.fips == 'fips' && '-fips' || '' }}-amd64:${{ github.sha }}
            VERSION=v0.0.1-${{ github.sha }}
            TRUSTED_BOOT=false
            FIPS=${{ matrix.fips }}

  build-kairos-trusted-amd64:
    runs-on: ubuntu-latest
    needs:
      - hadron-trusted-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
      - name: Download Dockerfile from kairos repository
        run: |
          mkdir -p build
          curl -sSL https://raw.githubusercontent.com/kairos-io/kairos/master/images/Dockerfile -o build/Dockerfile.kairos
      - name: Build and push
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./
          file: ./build/Dockerfile.kairos
          push: true
          platforms: linux/amd64
          provenance: false
          tags: ttl.sh/hadron-init-trusted:${{ github.sha }}
          build-args: |
            BASE_IMAGE=ttl.sh/hadron-cloud-trusted-${{ github.sha }}:24h
            VERSION=v0.0.1-${{ github.sha }}
            TRUSTED_BOOT=true

  build-bios-iso-amd64:
    runs-on: ubuntu-latest
    needs:
      - build-kairos-bios-amd64
    strategy:
      matrix:
        fips: [ "no-fips", "fips" ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
      - name: Build ISO
        run: |
          mkdir build
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
          -v $PWD/build/:/output \
          quay.io/kairos/auroraboot:v0.21.0-alpha.4 --debug build-iso --output /output/ \
          --override-name kairos-hadron-bios${{ matrix.fips == 'fips' && '-fips' || '' }}-${{ github.sha }} \
          docker:ttl.sh/hadron-init-bios${{ matrix.fips == 'fips' && '-fips' || '' }}-amd64:${{ github.sha }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: kairos-hadron-bios${{ matrix.fips == 'fips' && '-fips' || '' }}-${{ github.sha }}.iso.zip
          path: build/*.iso

  build-trusted-iso-amd64:
    runs-on: ubuntu-latest
    needs:
      - build-kairos-trusted-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
      - name: Build ISO
        run: | # when agent has fixed the bootentry selection, we can add --sdboot-in-source to use the bundled sdboot
          mkdir build
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
          -v $PWD/tests/assets/keys:/keys \
          -v $PWD/build/:/output \
          -v $PWD/tests/assets/sysext/:/overlay \
          quay.io/kairos/auroraboot:v0.21.0-alpha.4 --debug build-uki \
          --output-dir /output/ --public-keys /keys \
          --tpm-pcr-private-key /keys/tpm2-pcr-private.pem \
          --sb-key /keys/db.key \
          --sb-cert /keys/db.pem \
          --output-type iso \
          --overlay-iso /overlay \
          docker:ttl.sh/hadron-init-trusted:${{ github.sha }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: kairos-hadron-trusted-${{ github.sha }}.iso.zip
          path: build/*.iso

  tests-bios-amd64:
    runs-on: fast # Custom runner, more memory and CPU
    name: ${{ matrix.test }} tests
    needs:
      - build-bios-iso-amd64
    strategy:
      matrix:
        test:
          - "acceptance"
          - "reset"
          - "custom-partitioning"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Go
        uses: actions/setup-go@v7
        timeout-minutes: 5
        with:
          go-version-file: tests/go.mod
          cache-dependency-path: tests/go.sum
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: kairos-hadron-bios-${{ github.sha }}.iso.zip
      - name: Enable KVM group perms
        run: |
          sudo apt-get update
          sudo apt-get install -y libvirt-clients libvirt-daemon-system libvirt-daemon virtinst bridge-utils qemu-system qemu-system-x86 qemu-system-x86 qemu-utils qemu-kvm acl udev mkisofs swtpm
          sudo setfacl -m u:runner:rwx /dev/kvm
      - name: Run tests
        env:
          USE_QEMU: true
          KVM: true
          MEMORY: 5000
          DRIVE_SIZE: 50000
          CREATE_VM: true
          CPUS: 4
        run: |
          export ISO=$PWD/$(ls *.iso|grep -v ipxe | head -1 )
          echo "ISO is: $ISO"
          cp tests/go.* .
          go mod download
          go run github.com/onsi/ginkgo/v2/ginkgo -v --fail-fast -r --label-filter "${{ matrix.test }}" ./tests/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: acceptance-${{github.sha}}.logs.zip
          path: tests/**/logs/*
          if-no-files-found: warn

  tests-trusted-amd64:
    runs-on: fast # Custom runner, more memory and CPU
    name: ${{ matrix.test }} tests
    needs:
      - build-trusted-iso-amd64
    strategy:
      matrix:
        test:
          - "acceptance-trusted-generic"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Go
        uses: actions/setup-go@v7
        timeout-minutes: 5
        with:
          go-version-file: tests/go.mod
          cache-dependency-path: tests/go.sum
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: kairos-hadron-trusted-${{ github.sha }}.iso.zip
      - name: Enable KVM group perms
        run: |
          sudo apt-get update
          sudo apt-get install -y libvirt-clients libvirt-daemon-system libvirt-daemon virtinst bridge-utils qemu-system qemu-system-x86 qemu-system-x86 qemu-utils qemu-kvm acl udev mkisofs swtpm
          sudo setfacl -m u:runner:rwx /dev/kvm
      - name: Run tests
        env:
          USE_QEMU: true
          KVM: true
          MEMORY: 5000
          DRIVE_SIZE: 50000
          CREATE_VM: true
          CPUS: 4
          FIRMWARE: /usr/share/OVMF/OVMF_CODE_4M.secboot.fd
          EMULATE_TPM: true
          UKI_TEST: true
        run: |
          export ISO=$PWD/$(ls *.iso|grep -v ipxe | head -1 )
          echo "ISO is: $ISO"
          cp tests/go.* .
          go mod download
          go run github.com/onsi/ginkgo/v2/ginkgo -v --fail-fast -r --label-filter "${{ matrix.test }}" ./tests/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: acceptance-trusted-${{github.sha}}.logs.zip
          path: tests/**/logs/*
          if-no-files-found: warn

  tests-bios-fips-amd64:
    runs-on: fast # Custom runner, more memory and CPU
    name: ${{ matrix.test }} tests (FIPS)
    needs:
      - build-bios-iso-amd64
    strategy:
      matrix:
        test:
          - "acceptance"
          - "reset"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Go
        uses: actions/setup-go@v7
        timeout-minutes: 5
        with:
          go-version-file: tests/go.mod
          cache-dependency-path: tests/go.sum
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: kairos-hadron-bios-fips-${{ github.sha }}.iso.zip
      - name: Enable KVM group perms
        run: |
          sudo apt-get update
          sudo apt-get install -y libvirt-clients libvirt-daemon-system libvirt-daemon virtinst bridge-utils qemu-system qemu-system-x86 qemu-system-x86 qemu-utils qemu-kvm acl udev mkisofs swtpm
          sudo setfacl -m u:runner:rwx /dev/kvm
      - name: Run tests
        env:
          USE_QEMU: true
          KVM: true
          MEMORY: 5000
          DRIVE_SIZE: 50000
          CREATE_VM: true
          CPUS: 4
          FIPS: true
        run: |
          export ISO=$PWD/$(ls *.iso|grep -v ipxe | head -1 )
          echo "ISO is: $ISO"
          cp tests/go.* .
          go mod download
          go run github.com/onsi/ginkgo/v2/ginkgo -v --fail-fast -r --label-filter "${{ matrix.test }}" ./tests/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: ${{ matrix.test }}-${{github.sha}}.logs.zip
          path: tests/**/logs/*
          if-no-files-found: warn

  image-size-report-amd64:
    # Informational only: compares the full images built for this PR against
    # the published :main baseline and posts a sticky PR comment. Never fails.
    runs-on: ubuntu-latest
    needs:
      - hadron-bios-amd64
      - hadron-trusted-amd64
    permissions:
      contents: read
      packages: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Log in to ghcr.io (for :main baseline images)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate size report
        run: |
          .github/scripts/image-size-report.sh "${{ github.sha }}" "${{ github.repository }}" | tee report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post sticky PR comment
        # Fork PRs only get a read-only token, so posting will fail there; the
        # step summary above is still written. Never block the pipeline on it.
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: image-size-report
          path: report.md

  hadron-grub-arm64:
    runs-on: oracle-vm-32cpu-128gb-arm64
    needs:
      - container-arm64  # Take advantage of cached layers from the container build
    strategy:
      matrix:
        kernel: [ "cloud" ]
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
      # ttl.sh tags must not match the amd64 jobs in this workflow: both trigger on the same
      # github.sha, so last-writer wins would cause amd64 BIOS jobs to silently pull linux/arm64.
      - name: Log in to quay.io (push per-PR build cache)
        if: ${{ env.PR_CACHE_WRITE == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}
      - name: Build PR
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./
          file: ./Dockerfile
          platforms: linux/arm64
          push: true
          tags: ttl.sh/hadron${{ matrix.kernel == 'cloud' && '-cloud' || '' }}-arm64:${{ github.sha }}
          labels: |
            ${{ steps.meta.outputs.labels }}
          target: default
          cache-from: |
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-grub-${{ matrix.kernel }}-arm64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-container-arm64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-toolchain-arm64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:toolchain-arm64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:container-arm64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:grub-${{ matrix.kernel }}-arm64,mode=max
          cache-to: ${{ env.PR_CACHE_WRITE == 'true' && format('type=registry,ref=quay.io/kairos/hadron-build-cache:pr-{0}-grub-{1}-arm64,mode=max,ignore-error=true,compression=zstd,compression-level=3,oci-mediatypes=true,image-manifest=true', env.PR_NUM, matrix.kernel) || '' }}
          build-args: |
            BOOTLOADER=grub
            KERNEL_TYPE=${{ matrix.kernel }}
            ARCH=aarch64
            BUILD_ARCH=aarch64

  build-kairos-grub-arm64:
    runs-on: ubuntu-24.04-arm
    needs:
      - hadron-grub-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
      - name: Download Dockerfile from kairos repository
        run: |
          mkdir -p build
          curl -sSL https://raw.githubusercontent.com/kairos-io/kairos/master/images/Dockerfile -o build/Dockerfile.kairos
      - name: Build and push
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./
          file: ./build/Dockerfile.kairos
          push: true
          platforms: linux/arm64
          tags: ttl.sh/hadron-init-bios-arm64:${{ github.sha }}
          build-args: |
            BASE_IMAGE=ttl.sh/hadron-cloud-arm64:${{ github.sha }}
            VERSION=v0.0.1-${{ github.sha }}
            TRUSTED_BOOT=false

  build-grub-iso-arm64:
    runs-on: ubuntu-24.04-arm
    needs:
      - build-kairos-grub-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
      - name: Build ISO
        run: |
          mkdir build
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock --platform=arm64 \
          -v $PWD/build/:/output \
          quay.io/kairos/auroraboot:v0.21.0-alpha.4 --debug build-iso --output /output/ \
          --override-name kairos-hadron-bios-${{ github.sha }} \
          docker:ttl.sh/hadron-init-bios-arm64:${{ github.sha }}
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: kairos-hadron-bios-${{ github.sha }}.iso.zip
          path: build/*.iso

