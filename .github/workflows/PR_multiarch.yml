  hadron-bios-amd64:
    runs-on: cncf-ubuntu-8-32-x86
    needs:
      - container-amd64  # Take advantage of cached layers from the container build
    strategy:
      matrix:
        kernel: ["cloud", "default"]
        fips: [ "no-fips" ]
        include:
          - kernel: "cloud"
            fips: "fips"
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
      - name: Log in to quay.io (push per-PR build cache)
        if: ${{ env.PR_CACHE_WRITE == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}
      - name: Build PR
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64
          # Loaded into the local image store and handed to the consuming jobs
          # (build-kairos-bios-amd64, image-size-report-amd64) as a tarball
          # artifact. No registry is involved, so this works on a pull request
          # from a fork, which has no secrets.
          load: true
          provenance: false
          tags: hadron${{ matrix.kernel == 'cloud' && '-cloud' || '' }}${{ matrix.fips == 'fips' && '-fips' || '' }}-amd64:${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          target: default
          cache-from: |
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-bios-${{ matrix.kernel }}-${{ matrix.fips }}-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-container-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-toolchain-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-stage0-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-stage1-merge-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-rsync-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-cmake-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-kernel-misc-${{ matrix.kernel }}-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-systemd-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-python-build-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage0-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage1-merge-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:rsync-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:cmake-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:kernel-misc-${{ matrix.kernel }}-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:systemd-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:python-build-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:toolchain-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:container-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:bios-${{ matrix.kernel }}-${{ matrix.fips }}-amd64,mode=max
          cache-to: ${{ env.PR_CACHE_WRITE == 'true' && format('type=registry,ref=quay.io/kairos/hadron-build-cache:pr-{0}-bios-{1}-{2}-amd64,mode=max,ignore-error=true,compression=zstd,compression-level=3,oci-mediatypes=true,image-manifest=true', env.PR_NUM, matrix.kernel, matrix.fips) || '' }}
          build-args: |
            BOOTLOADER=grub
            KERNEL_TYPE=${{ matrix.kernel }}
            FIPS=${{ matrix.fips }}
      - name: Install Go
        uses: actions/setup-go@v7
        # These workers cap at 100Mb/s, so a congested one turns even the Go
        # toolchain download into a crawl, and a worker that cannot manage two
        # minutes here is not going to manage the image pulls later either.
        # Fail it fast rather than burn five minutes first
        # (kairos-io/kairos#4564).
        timeout-minutes: 2
        with:
          go-version-file: tests/go.mod
          # The dependency cache costs more than it saves. Restoring it moves
          # ~305MB where a cold "go mod download" of tests/go.sum moves 124MB,
          # and in run 35681926163 it missed nine times out of twelve. It also
          # writes from a post step, and a step's timeout-minutes covers its
          # post action too, so packing the 449MB module cache ran past the
          # budget above and failed two jobs whose work had already passed.
          cache: false
      - name: Run full-image structure tests
        env:
          # container-amd64 structure-tests the minimal base. The firmware
          # layout exists only in the full image, which is also what
          # downstream consumers pull, so assert it here.
          CONTAINER_IMAGE: hadron${{ matrix.kernel == 'cloud' && '-cloud' || '' }}${{ matrix.fips == 'fips' && '-fips' || '' }}-amd64:${{ github.sha }}
        run: |
          cp tests/go.* .
          go mod download
          go run github.com/onsi/ginkgo/v2/ginkgo -v -r --label-filter "firmware-layout || audit" ./tests/
      - name: Save the image as a tarball
        # The file name carries the variant: this artifact and its siblings
        # (other kernel/fips combos) are all downloaded into one workspace by
        # image-size-report-amd64, so a shared file name would silently
        # overwrite the earlier download.
        run: |
          docker save hadron${{ matrix.kernel == 'cloud' && '-cloud' || '' }}${{ matrix.fips == 'fips' && '-fips' || '' }}-amd64:${{ github.sha }} | gzip > hadron${{ matrix.kernel == 'cloud' && '-cloud' || '' }}${{ matrix.fips == 'fips' && '-fips' || '' }}-amd64.tar.gz
      - name: Upload the image
        uses: actions/upload-artifact@v7
        with:
          name: hadron${{ matrix.kernel == 'cloud' && '-cloud' || '' }}${{ matrix.fips == 'fips' && '-fips' || '' }}-amd64-image
          path: hadron${{ matrix.kernel == 'cloud' && '-cloud' || '' }}${{ matrix.fips == 'fips' && '-fips' || '' }}-amd64.tar.gz
          if-no-files-found: error
          retention-days: 1
          # already gzipped
          compression-level: 0

