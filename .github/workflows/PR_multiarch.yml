---
name: 'PR build and test images (multiarch)'

on:
  pull_request:
  workflow_dispatch:

# Read-only by default. A job that needs more (packages, attestations,
# id-token, pull-requests) asks for it in its own permissions block.
permissions:
  contents: read

concurrency:
  group: ci-image-multiarch-${{ github.head_ref || github.ref }}-${{ github.repository }}
  cancel-in-progress: true

env:
  # Per-PR BuildKit cache. Each build job reads its own pr-<number>-* tag first
  # (warm from a prior push or an earlier job in this same run) and falls back to
  # the shared main cache tag. Only a run that can read repository secrets may
  # WRITE it; the rest still read the public cache. Stale pr-* tags are reclaimed
  # by pr-cache-cleanup.yml when the PR closes.
  #
  # Two kinds of run get no secrets, and both have to be excluded here. A run
  # that is not excluded does not quietly skip the push: the login step fails
  # with "Username and password required", which fails stage0 and skips every
  # job that needs it, so the image is never built and never tested.
  #
  #   1. A pull request from a fork. Its head repository is not this one.
  #   2. A pull request raised by dependabot. Its branch IS in this repository,
  #      so the head check passes, but GitHub withholds secrets from a
  #      pull_request event whose actor is dependabot. See kairos-io/kairos#5481.
  PR_CACHE_WRITE: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
  PR_NUM: ${{ github.event.pull_request.number }}
  # Pinned commit, not a branch: see the matching comment on
  # KAIROS_DOCKERFILE_REF in the Makefile. Keep the two in sync.
  KAIROS_DOCKERFILE_REF: c2426c11c34198fcb50bfe4d43e827619292e26f
  # Temporary override until a kairos-init release cuts with the merged
  # kairos-io/kairos#5035 (sshd-hardening consolidation this PR carries
  # on the Hadron side). Without it the built ISO ships the released
  # kairos-init (v0.17.3) whose 05-kairos-hardening.conf still sets
  # `PermitRootLogin no`, and assertSSHHardening fails expecting
  # `prohibit-password`. PR 5035 has already merged; the `:master-scratch`
  # kairos-init image tracks kairos master (untested-but-freshest, unlike `:master` which promotes only on green) and carries the merged
  # drop-in content.
  #
  # The pinned images/Dockerfile at KAIROS_DOCKERFILE_REF hard-wires
  # `FROM quay.io/kairos/kairos-init:${KAIROS_INIT}`, so overriding the
  # image reference alone (KAIROS_INIT_IMAGE, etc.) is silently ignored.
  # The kairos-image build job pulls KAIROS_INIT_OVERRIDE_SOURCE, retags
  # it as `quay.io/kairos/kairos-init:${KAIROS_INIT_OVERRIDE_TAG}` in the
  # local docker image store (plain `docker build` resolves FROM against
  # that store), and passes `--build-arg KAIROS_INIT=<tag>` so the FROM
  # in the pinned Dockerfile resolves to the retagged image. It also
  # asserts the override actually took effect on the built image so a
  # dropped arg never masquerades as a wait-for-release.
  #
  # Remove all of this (env + pull + tag + build-arg + assertion) once
  # a kairos release lands with the merged 05-kairos-hardening.conf and
  # the pinned images/Dockerfile's ARG KAIROS_INIT default points at it.
  KAIROS_INIT_OVERRIDE_SOURCE: ghcr.io/kairos-io/kairos/kairos-init:master-scratch
  KAIROS_INIT_OVERRIDE_TAG: master-scratch

jobs:
  # This is the light pass. A pull request builds and boot-tests two flavors,
  # both amd64, default kernel, no FIPS: the bios (grub) image and the trusted
  # (systemd-boot) image. arm64, the cloud kernel and the FIPS flavors are
  # built on main by build-multiarch-images.yml, and the cache tags that main
  # writes are what every job below falls back to, so most of a pull request
  # run is cache hits.
  #
  # Ensure every ghcr source image the Dockerfile references is
  # published before any docker/build-push-action starts. On a warm
  # cache this is a quick matrix of manifest inspects; on a cold
  # cache (fresh version bump) it actually fetches and publishes,
  # which can take a couple of minutes. Either way, toolchain must
  # wait, otherwise its FROM ghcr.io/.../pkg:VER can fail with
  # "not found" while populate-sources is still catching up.
  populate-sources:
    uses: ./.github/workflows/populate-sources.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit

  # The static checks live in quick-checks.yml so the merge queue runs the
  # same list.
  check-kernel-configs:
    uses: ./.github/workflows/quick-checks.yml

  # ============================================================================
  # amd64 per-stage cache jobs (PR-scoped)
  # ============================================================================
  # Same shape as the main-branch pipeline: one job per compiled sub-tree so
  # each writes its own per-PR cache tag. Splitting the tags means a subsequent
  # push to the same PR gets an already-warm cache down to whichever stage
  # actually changed, instead of a single monolithic toolchain tag that fails
  # to help once anything mid-way is edited.

  stage0-amd64:
    runs-on: cncf-ubuntu-32-128-x86
    needs: populate-sources
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          cleanup: false
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
      - name: Log in to quay.io (push per-PR build cache)
        if: ${{ env.PR_CACHE_WRITE == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}
      - name: Build stage0
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          target: stage0
          cache-from: |
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-stage0-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage0-amd64,mode=max
          cache-to: ${{ env.PR_CACHE_WRITE == 'true' && format('type=registry,ref=quay.io/kairos/hadron-build-cache:pr-{0}-stage0-amd64,mode=max,ignore-error=true,compression=zstd,compression-level=3,oci-mediatypes=true,image-manifest=true', env.PR_NUM) || '' }}

  stage1-amd64:
    runs-on: cncf-ubuntu-32-128-x86
    needs: [stage0-amd64]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          cleanup: false
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
      - name: Log in to quay.io (push per-PR build cache)
        if: ${{ env.PR_CACHE_WRITE == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}
      - name: Build stage1-merge
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          target: stage1-merge
          cache-from: |
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-stage1-merge-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-stage0-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage0-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage1-merge-amd64,mode=max
          cache-to: ${{ env.PR_CACHE_WRITE == 'true' && format('type=registry,ref=quay.io/kairos/hadron-build-cache:pr-{0}-stage1-merge-amd64,mode=max,ignore-error=true,compression=zstd,compression-level=3,oci-mediatypes=true,image-manifest=true', env.PR_NUM) || '' }}

  rsync-amd64:
    runs-on: cncf-ubuntu-16-64-x86
    needs: [stage1-amd64]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          cleanup: false
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
      - name: Log in to quay.io (push per-PR build cache)
        if: ${{ env.PR_CACHE_WRITE == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}
      - name: Build rsync
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          target: rsync
          cache-from: |
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-rsync-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-stage1-merge-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-stage0-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage0-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage1-merge-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:rsync-amd64,mode=max
          cache-to: ${{ env.PR_CACHE_WRITE == 'true' && format('type=registry,ref=quay.io/kairos/hadron-build-cache:pr-{0}-rsync-amd64,mode=max,ignore-error=true,compression=zstd,compression-level=3,oci-mediatypes=true,image-manifest=true', env.PR_NUM) || '' }}

  cmake-amd64:
    runs-on: cncf-ubuntu-32-128-x86
    needs: [rsync-amd64]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          cleanup: false
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
      - name: Log in to quay.io (push per-PR build cache)
        if: ${{ env.PR_CACHE_WRITE == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}
      - name: Build cmake
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          target: cmake
          cache-from: |
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-cmake-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-rsync-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-stage1-merge-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-stage0-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage0-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage1-merge-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:rsync-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:cmake-amd64,mode=max
          cache-to: ${{ env.PR_CACHE_WRITE == 'true' && format('type=registry,ref=quay.io/kairos/hadron-build-cache:pr-{0}-cmake-amd64,mode=max,ignore-error=true,compression=zstd,compression-level=3,oci-mediatypes=true,image-manifest=true', env.PR_NUM) || '' }}

  kernel-amd64:
    runs-on: cncf-ubuntu-32-128-x86
    needs: [rsync-amd64]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          cleanup: false
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
      - name: Log in to quay.io (push per-PR build cache)
        if: ${{ env.PR_CACHE_WRITE == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}
      - name: Build kernel-misc
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          target: kernel-misc
          # The last cache-from entry seeds from main's full-image cache for the
          # same leg, until the per-leg kernel tag above has been published once.
          cache-from: |
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-kernel-misc-default-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-rsync-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-stage1-merge-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-stage0-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage0-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage1-merge-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:rsync-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:kernel-misc-default-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:bios-default-no-fips-amd64,mode=max
          cache-to: ${{ env.PR_CACHE_WRITE == 'true' && format('type=registry,ref=quay.io/kairos/hadron-build-cache:pr-{0}-kernel-misc-default-amd64,mode=max,ignore-error=true,compression=zstd,compression-level=3,oci-mediatypes=true,image-manifest=true', env.PR_NUM) || '' }}
          build-args: |
            KERNEL_TYPE=default
            FIPS=no-fips

  systemd-amd64:
    runs-on: cncf-ubuntu-16-64-x86
    needs: [rsync-amd64]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          cleanup: false
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
      - name: Log in to quay.io (push per-PR build cache)
        if: ${{ env.PR_CACHE_WRITE == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}
      - name: Build systemd
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          target: systemd
          cache-from: |
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-systemd-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-rsync-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-stage1-merge-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-stage0-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage0-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage1-merge-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:rsync-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:systemd-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:bios-default-no-fips-amd64,mode=max
          cache-to: ${{ env.PR_CACHE_WRITE == 'true' && format('type=registry,ref=quay.io/kairos/hadron-build-cache:pr-{0}-systemd-amd64,mode=max,ignore-error=true,compression=zstd,compression-level=3,oci-mediatypes=true,image-manifest=true', env.PR_NUM) || '' }}
          build-args: |
            FIPS=no-fips

  python-amd64:
    runs-on: cncf-ubuntu-16-64-x86
    needs: [rsync-amd64]
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          cleanup: false
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
      - name: Log in to quay.io (push per-PR build cache)
        if: ${{ env.PR_CACHE_WRITE == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}
      - name: Build python-build
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          target: python-build
          cache-from: |
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-python-build-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-rsync-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-stage1-merge-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-stage0-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage0-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage1-merge-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:rsync-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:python-build-amd64,mode=max
          cache-to: ${{ env.PR_CACHE_WRITE == 'true' && format('type=registry,ref=quay.io/kairos/hadron-build-cache:pr-{0}-python-build-amd64,mode=max,ignore-error=true,compression=zstd,compression-level=3,oci-mediatypes=true,image-manifest=true', env.PR_NUM) || '' }}

  toolchain-amd64:
    runs-on: cncf-ubuntu-16-64-x86
    needs: [cmake-amd64, kernel-amd64, systemd-amd64, python-amd64]
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          cleanup: false
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
      - name: Log in to quay.io (push per-PR build cache)
        if: ${{ env.PR_CACHE_WRITE == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_IO_USERNAME }}
          password: ${{ secrets.QUAY_IO_PASSWORD }}
      - name: Build PR
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64
          tags: hadron-toolchain-amd64:${{ github.sha }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            cache-label=quay-remote-amd64
          cache-from: |
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-toolchain-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-stage0-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-stage1-merge-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-rsync-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-cmake-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-kernel-misc-default-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-systemd-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:pr-${{ env.PR_NUM }}-python-build-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage0-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage1-merge-amd64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:rsync-amd64,mode=max
