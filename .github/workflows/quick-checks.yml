name: Quick checks

# The fast, static checks every change gets: the repository's make test
# targets, the kernel config checks and a parse of the Dockerfile. They need
# no secrets and take a couple of minutes.
#
# Called from PR_multiarch.yml on every pull request and from merge-queue.yml
# on every merge queue branch, so both run the same list. Add a check here,
# not in one of the callers.

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  # Kernel config version + BTF checks are arch-independent (they read the
  # single linux version pinned in the Dockerfile), so run them once for
  # all four config files: x86_64 (cloud.config, default.config) and
  # arm64 (cloud-arm64.config, default-arm64.config).
  check-kernel-configs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install PyYAML
        run: sudo apt-get update && sudo apt-get install -y python3-yaml
      - name: Verify fork-PR upstream source rewrite
        run: make test-render
      - name: Verify the local base image tag invariant
        run: make test-image-tags
      - name: Verify make help, run-qemu and the removed bump-deps
        run: make test-make-helpers
      - name: Verify the source-cache probe retries a stalled connection
        run: make test-source-probe
      - name: Verify the quay login gates exclude forks and dependabot
        run: make test-workflow-gates
      - name: Verify the sources.yaml checksum refresher
        run: make test-source-checksums
      - name: Verify the autobumper's pull request decision
        run: make test-bump-pr-action
      - name: Verify the autobumper never downgrades a version
        run: make test-version-downgrades
      - name: Verify the autobumper's release-notes excerpt
        run: make test-autobumper-changelog
      - name: Verify the release notes keep one components section
        run: make test-release-notes
      - name: Verify the bash patch level source
        run: make test-bash-patch-level
      - name: Verify every carried patch has a header
        run: make test-patch-headers
      - name: Verify every Dockerfile COPY source is in the build context
        run: make test-copy-context
      - name: Verify every updatecli shell source fails on empty output
        run: make test-updatecli-sources
      - name: Verify the component-manifest generator
        run: make test-components
      - name: Verify kernel configs are resolved against current kernel version
        run: |
          KERNEL_VERSION=$(awk -F= '/^ARG KERNEL_VERSION=/{print $2; exit}' Dockerfile)
          [[ "$KERNEL_VERSION" =~ ^[0-9]+\.[0-9]+$ ]] && KERNEL_VERSION="${KERNEL_VERSION}.0"
          FAILED=0
          for cfg in files/kernel/cloud.config files/kernel/default.config files/kernel/cloud-arm64.config files/kernel/default-arm64.config; do
            CONFIG_VERSION=$(grep '^# Linux/' "$cfg" | grep -oP '\d+\.\d+(\.\d+)?' || true)
            [[ "$CONFIG_VERSION" =~ ^[0-9]+\.[0-9]+$ ]] && CONFIG_VERSION="${CONFIG_VERSION}.0"
            if [ "$CONFIG_VERSION" != "$KERNEL_VERSION" ]; then
              echo "ERROR: $cfg is stale (generated for $CONFIG_VERSION, current kernel is $KERNEL_VERSION)"
              echo "Run 'make update-kernel-configs' and commit the result."
              FAILED=1
            else
              echo "OK: $cfg matches kernel $KERNEL_VERSION"
            fi
          done
          exit $FAILED
      - name: Verify BTF is enabled in all kernel configs
        run: |
          FAILED=0
          for cfg in files/kernel/cloud.config files/kernel/default.config files/kernel/cloud-arm64.config files/kernel/default-arm64.config; do
            if ! grep -q '^CONFIG_DEBUG_INFO_BTF=y' "$cfg"; then
              echo "ERROR: $cfg is missing CONFIG_DEBUG_INFO_BTF=y"
              FAILED=1
            else
              echo "OK: $cfg has CONFIG_DEBUG_INFO_BTF=y"
            fi
          done
          exit $FAILED
      - name: Verify every kernel with fbdev core provides /dev/fb*
        run: |
          # kairos-io/kairos#5526: fbcon and DRM fbdev emulation register fb0,
          # but without FB_DEVICE there is no /dev/fb0 and no /sys/class/graphics/fb0.
          FAILED=0
          for cfg in files/kernel/*.config; do
            grep -q '^CONFIG_FB_CORE=y' "$cfg" || continue
            if ! grep -q '^CONFIG_FB_DEVICE=y' "$cfg"; then
              echo "ERROR: $cfg has CONFIG_FB_CORE=y but not CONFIG_FB_DEVICE=y"
              FAILED=1
            else
              echo "OK: $cfg has CONFIG_FB_DEVICE=y"
            fi
          done
          exit $FAILED
      - name: Check the Dockerfile and every image it starts from
        # BuildKit parses every stage, runs its lint rules and resolves every
        # FROM, so a merge that breaks a stage name or an ARG fails here in
        # seconds. A source image a change adds can be missing for now:
        # populate-sources publishes it on a pull request from this
        # repository and on main, never on a fork, so a missing
        # hadron-sources tag is only a warning. Any other error fails.
        #
        # BuildKit stops at the first FROM it cannot resolve, so a missing
        # source tag hides every error after it. On a merge group every source
        # was already published by the pull request, and this check is the
        # only one that runs there, so a missing tag fails it too.
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          rc=0
          docker buildx build --check -f Dockerfile . > dockerfile-check.log 2>&1 || rc=$?
          cat dockerfile-check.log
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          if [ "$EVENT_NAME" = "merge_group" ]; then
            exit 1
          fi
          other=$(grep '^ERROR:' dockerfile-check.log | grep -v 'hadron-sources/[^ ]*: not found' || true)
          if [ -n "$other" ]; then
            exit 1
          fi
          grep '^ERROR:' dockerfile-check.log | sed 's|^ERROR: |::warning title=Source image not published yet::|'
