name: Build examples

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'examples/add-packages/**'
      - '.github/workflows/examples.yml'

# Read-only by default. A job that needs more (packages, attestations,
# id-token, pull-requests) asks for it in its own permissions block.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.extra-file }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Not built here: Dockerfile.doom builds a full wayland/mesa image and
        # its `default` is that image, not a layer; Dockerfile.Thor cross
        # compiles an arm64 kernel and has no `default` stage.
        extra-file:
          - "Dockerfile.git"
          - "Dockerfile.gpg"
          - "Dockerfile.fwupd"
          - "Dockerfile.nvidia"
          - "Dockerfile.open-vm-tools"
          - "Dockerfile.qemu-guest-agent"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Render Dockerfile
        uses: ./.github/actions/render-dockerfile
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Dockerfile
        uses: docker/build-push-action@v7
        with:
          file: examples/add-packages/${{ matrix.extra-file }}
      # The step above builds the last stage of the file (hadron-extension or
      # smoketest), which never depends on `default`, the target the examples
      # tell users to build. Build it too. Every stage it needs is already in
      # this job's buildx cache from the step above, so it costs the COPY
      # lines only.
      - name: Build the default target
        uses: docker/build-push-action@v7
        with:
          file: examples/add-packages/${{ matrix.extra-file }}
          target: default
