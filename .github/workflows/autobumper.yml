name: Updatecli

on:
  workflow_dispatch:
  # Trigger Updatecli once day by a cronjob
  schedule:
    # * is a special character in YAML so you have to quote this string
    # Run once a day
    - cron: "0 0 * * *"

permissions:
  # Required by Updatecli to create Git Commit(s)
  contents: "write"
  # Required by Updatecli to open GitHub pull request
  pull-requests: "write"
  # Required by Updatecli to update GitHub action workflows
  actions: "write"

jobs:
  updatecli:
    runs-on: "ubuntu-latest"
    strategy:
        # Each config is an independent bump group. Letting one failure cancel
        # the rest hides which of the other nine groups had updates to offer.
        fail-fast: false
        matrix:
            config:
              - build-tools
              - compiler-tools
              - compression-tools
              - core-system
              - kernel-and-boot
              - misc-tools
              - network-tools
              - security-tools
              - storage-tools
              - system-libraries
    steps:
      - name: Install Updatecli in the runner
        uses: updatecli/updatecli-action@v3.9.0
      - name: commit and push changes
        env:
          # updatecli's github release sources, autobumper-changelog.rb and gh
          # all read this. It stays a user token: a pull request opened by the
          # workflow's own token does not start `pull_request` runs.
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          # git pushes the bump branch with the workflow's own token, which has
          # contents: write on this repository (declared above). No ruleset
          # applies to branches other than main.
          REPO_TOKEN: ${{ github.token }}
        run: |
          set -ex
          # The bump branch lives in kairos-io/hadron, not in a fork.
          # PR_multiarch.yml gates its per-PR BuildKit cache on
          # `head.repo.full_name == github.repository`, because a pull request
          # opened from a fork cannot reach the quay credentials. On a fork
          # pull request every `cache-to` collapses to '', so the twenty-two
          # cache-warming jobs publish nothing and each image leg recompiles
          # the sub-trees they had just built. Measured on #670, the kernel
          # bump of 2026-10-04: 614 of that run's 1201 runner minutes went
          # into artifacts no later job could read.
          #
          # kairos-io/hadron carries no ruleset on branches other than main,
          # and no workflow triggers on an arbitrary branch push, so pushing
          # the bump branch here costs nothing and turns the handoff on.
          git clone "https://x-access-token:${REPO_TOKEN}@github.com/kairos-io/hadron.git" repo
          cd repo

          branch="bumps-${{ matrix.config }}-${{ github.sha }}"

          # The bump branches land in this repository now, so prune the ones
          # whose pull request is finished. Branches carrying the sha of the
          # run in progress belong to a sibling matrix job that may not have
          # opened its pull request yet, and a branch with no pull request at
          # all is left alone.
          for stale in $(git ls-remote --heads origin 'bumps-*' | sed 's#.*refs/heads/##'); do
            case "$stale" in
              *-${{ github.sha }}) continue ;;
            esac
            state=$(gh pr list --head "$stale" --base main --repo kairos-io/hadron --state all --json state -q '.[0].state // ""')
            if [ "$state" = "MERGED" ] || [ "$state" = "CLOSED" ]; then
              git push origin --delete "$stale" || echo "could not delete ${stale}"
            fi
          done

          # updatecli is deterministic against its manifest, so an earlier
          # attempt on the same branch has nothing to contribute: always start
          # from main.
          git checkout -B "$branch" origin/main
          
          updatecli apply --config updatecli.d/${{ matrix.config }}.yaml

          # updatecli moves the version ARG and nothing else, but the matching
          # sha256 lives in sources.yaml and still describes the previous
          # release. Both consumers of that field then reject the new tarball:
          # populate-sources fails the cell on a checksum mismatch, and the
          # downloader stages hack/render.sh writes for fork pull requests
          # exhaust their URL list without a match. Every bump opened a pull
          # request that could not build until this step existed.
          #
          # Runs before update-kernel-configs so a kernel version no URL serves
          # is reverted before the configs are regenerated against it.
          ./hack/refresh-source-checksums.sh --changed

          # For kernel-and-boot, regenerate kernel configs to match the new kernel version
          if [ "${{ matrix.config }}" = "kernel-and-boot" ]; then
            make update-kernel-configs
          fi

          git add Dockerfile sources.yaml

          # For kernel-and-boot, also stage the regenerated kernel config files
          if [ "${{ matrix.config }}" = "kernel-and-boot" ]; then
            git add files/kernel/
          fi
          
          # Check if there are staged changes
          if git diff --cached --quiet; then
            echo "No changes to commit. Checking PR state."
            PR_INFO=$(gh pr list --head "$branch" --base main --repo kairos-io/hadron --state all --json number,state -q '.[0]')
            PR_NUMBER=$(echo "$PR_INFO" | jq -r '.number // empty')
            PR_STATE=$(echo "$PR_INFO" | jq -r '.state // empty')
            if [ -n "$PR_NUMBER" ]; then
              if [ "$PR_STATE" = "CLOSED" ]; then
                # Check if PR is merged
                MERGED_AT=$(gh pr view $PR_NUMBER --repo kairos-io/hadron --json mergedAt -q '.mergedAt')
                if [ -z "$MERGED_AT" ]; then
                  echo "PR #$PR_NUMBER is closed and not merged. Deleting remote '$branch' branch to allow clean recreation."
                  git push origin --delete "$branch" || echo "Remote branch already deleted."
                else
                  echo "PR #$PR_NUMBER is merged. Nothing to do."
                fi
              else
                echo "Open PR #$PR_NUMBER already exists. Nothing to do."
              fi
            else
              echo "No PR found and no changes to commit. Nothing to do."
            fi
            exit 0
          fi
          
          # Commit and push changes
          git config user.name "ci-robbot"
          git config user.email "robot@c3os.io"
          export UPDATECLI_MANIFEST="updatecli.d/${{ matrix.config }}.yaml"
          ruby .github/scripts/autobumper-changelog.rb

          git commit -s -F /tmp/commit_msg.txt
          git push origin "$branch" --force
          PR_TITLE=$(cat /tmp/pr_title.txt)
          
          # Check if PR already exists (open or closed)
          PR_INFO=$(gh pr list --head "$branch" --base main --repo kairos-io/hadron --state all --json number,state -q '.[0]')
          PR_NUMBER=$(echo "$PR_INFO" | jq -r '.number // empty')
          PR_STATE=$(echo "$PR_INFO" | jq -r '.state // empty')
          if [ -n "$PR_NUMBER" ]; then
            if [ "$PR_STATE" = "CLOSED" ]; then
              # Check if PR is merged
              MERGED_AT=$(gh pr view $PR_NUMBER --repo kairos-io/hadron --json mergedAt -q '.mergedAt')
              if [ -z "$MERGED_AT" ]; then
                echo "PR #$PR_NUMBER is closed and not merged. Attempting to reopen."
                if ! gh pr reopen $PR_NUMBER --repo kairos-io/hadron; then
                  echo "Failed to reopen PR. Creating a new one."
                  gh pr create --title "$PR_TITLE" --body-file /tmp/pr_body.md --head "$branch" --base main --repo kairos-io/hadron
                else
                  gh pr edit $PR_NUMBER --title "$PR_TITLE" --body-file /tmp/pr_body.md --repo kairos-io/hadron
                fi
              else
                echo "PR #$PR_NUMBER is merged. Nothing to do."
              fi
            else
              echo "PR #$PR_NUMBER already exists and is open. Updating title and body."
              gh pr edit $PR_NUMBER --title "$PR_TITLE" --body-file /tmp/pr_body.md --repo kairos-io/hadron
            fi
          else
            echo "No PR found. Creating a new one."
            gh pr create --title "$PR_TITLE" --body-file /tmp/pr_body.md --head "$branch" --base main --repo kairos-io/hadron
          fi
