name: Updatecli

on:
  workflow_dispatch:
  # Trigger Updatecli once day by a cronjob
  schedule:
    # * is a special character in YAML so you have to quote this string
    # Run once a day
    - cron: "0 0 * * *"

permissions:
  # Required by Updatecli to create Git Commit(s)
  contents: "write"
  # Required by Updatecli to open GitHub pull request
  pull-requests: "write"
  # Required by Updatecli to update GitHub action workflows
  actions: "write"

jobs:
  updatecli:
    runs-on: "ubuntu-latest"
    strategy:
        matrix:
            config:
              - build-tools
              - compiler-tools
              - compression-tools
              - core-system
              - kernel-and-boot
              - misc-tools
              - network-tools
              - security-tools
              - storage-tools
              - system-libraries
    steps:
      - name: Install Updatecli in the runner
        uses: updatecli/updatecli-action@v3.3.0
      - name: commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          set -ex
          # Check if fork exists, create if not
          if ! gh repo view ci-forks/hadron --json name > /dev/null 2>&1; then
            echo "Fork does not exist. Creating fork..."
            gh repo fork kairos-io/hadron --clone=false --remote=false --org ci-forks
          else
            echo "Fork already exists."
          fi
          
          # Clone fork using HTTPS with the token embedded in the URL; credentials are not stored on disk
          git clone "https://ci-forks:${GITHUB_TOKEN}@github.com/ci-forks/hadron.git" fork
          cd fork
          
          # Ensure all pushes go to the fork using the authenticated URL
          git remote set-url origin "https://ci-forks:${GITHUB_TOKEN}@github.com/ci-forks/hadron.git"
          
          # Add upstream and sync main
          git remote add upstream https://github.com/kairos-io/hadron || true
          git fetch upstream
          git checkout main
          git reset --hard upstream/main
          git push origin main --force
          
          # Fetch all branches
          git fetch origin
          
          # Check if remote bumps branch exists
          if git ls-remote --exit-code --heads origin bumps-${{ matrix.config }}-${{ github.sha }} > /dev/null; then
            echo "Remote 'bumps-${{ matrix.config }}-${{ github.sha }}' branch exists. Checking it out."
            git checkout bumps-${{ matrix.config }}-${{ github.sha }}
          else
            echo "Remote 'bumps-${{ matrix.config }}-${{ github.sha }}' branch does not exist. Creating from upstream/main."
            git checkout -B bumps-${{ matrix.config }}-${{ github.sha }} upstream/main
          fi
          
          git reset --hard upstream/main
          
          updatecli apply --config updatecli.d/${{ matrix.config }}.yaml
          
          git add Dockerfile
          
          # Check if there are staged changes
          if git diff --cached --quiet; then
            echo "No changes to commit. Checking PR state."
            PR_INFO=$(gh pr list --head bumps-${{ matrix.config }}-${{ github.sha }} --base main --repo kairos-io/hadron --state all --json number,state -q '.[0]')
            PR_NUMBER=$(echo "$PR_INFO" | jq -r '.number // empty')
            PR_STATE=$(echo "$PR_INFO" | jq -r '.state // empty')
            if [ -n "$PR_NUMBER" ]; then
              if [ "$PR_STATE" = "CLOSED" ]; then
                # Check if PR is merged
                MERGED_AT=$(gh pr view $PR_NUMBER --repo kairos-io/hadron --json mergedAt -q '.mergedAt')
                if [ -z "$MERGED_AT" ]; then
                  echo "PR #$PR_NUMBER is closed and not merged. Deleting remote 'bumps-${{ matrix.config }}' branch to allow clean recreation."
                  git push origin --delete bumps-${{ matrix.config }} || echo "Remote branch already deleted."
                else
                  echo "PR #$PR_NUMBER is merged. Nothing to do."
                fi
              else
                echo "Open PR #$PR_NUMBER already exists. Nothing to do."
              fi
            else
              echo "No PR found and no changes to commit. Nothing to do."
            fi
            exit 0
          fi
          
          # Commit and push changes
          git config user.name "ci-robbot"
          git config user.email "robot@c3os.io"
          export UPDATECLI_MANIFEST="updatecli.d/${{ matrix.config }}.yaml"
          ruby <<'RUBY'
          require "json"
          require "net/http"
          require "uri"
          require "yaml"

          def parse_bumps(diff_text)
            bumps = []
            old_line = nil

            diff_text.each_line do |line|
              if line.start_with?("-") && !line.start_with?("---")
                old_line = line[1..].strip
                next
              end

              next unless line.start_with?("+") && !line.start_with?("+++")

              new_line = line[1..].strip

              if old_line && (old_match = old_line.match(/^ARG\s+([A-Z0-9_]+)=(.+)$/)) && (new_match = new_line.match(/^ARG\s+([A-Z0-9_]+)=(.+)$/))
                matcher = old_match[1]
                if matcher == new_match[1]
                  bumps << {
                    "matcher" => matcher,
                    "old_version" => old_match[2],
                    "new_version" => new_match[2]
                  }
                end
              end

              old_line = nil
            end

            bumps
          end

          def apply_transformers(value, transformers)
            return value if value.nil?

            Array(transformers).reduce(value.dup) do |current, transformer|
              key, spec = transformer.first

              case key
              when "trimprefix"
                current.start_with?(spec.to_s) ? current.delete_prefix(spec.to_s) : current
              when "trimsuffix"
                current.end_with?(spec.to_s) ? current.delete_suffix(spec.to_s) : current
              when "replacer"
                current.gsub(spec.fetch("from").to_s, spec.fetch("to").to_s)
              else
                current
              end
            end
          end

          def github_api_get(url, token)
            uri = URI(url)
            request = Net::HTTP::Get.new(uri)
            request["Accept"] = "application/vnd.github+json"
            request["User-Agent"] = "hadron-autobumper"
            request["Authorization"] = "Bearer " + token unless token.to_s.empty?

            Net::HTTP.start(uri.host, uri.port, use_ssl: uri.scheme == "https") do |http|
              response = http.request(request)
              raise "GitHub API request failed for #{url}: #{response.code} #{response.message}" unless response.is_a?(Net::HTTPSuccess)

              JSON.parse(response.body)
            end
          end

          def fetch_release_details(bump, token)
            owner = bump["owner"]
            repository = bump["repository"]
            return {} if owner.to_s.empty? || repository.to_s.empty?

            begin
              1.upto(10) do |page|
                releases = github_api_get("https://api.github.com/repos/#{owner}/#{repository}/releases?per_page=100&page=#{page}", token)
                break if releases.empty?

                matched = releases.find do |release|
                  apply_transformers(release["tag_name"].to_s, bump["transformers"]) == bump["new_version"]
                end

                return {
                  "release_url" => matched["html_url"],
                  "release_notes" => matched["body"].to_s,
                  "release_notes_status" => matched["body"].to_s.strip.empty? ? "empty" : "available"
                } if matched
              end
            rescue StandardError => e
              warn "Unable to fetch release details for #{owner}/#{repository}: #{e.message}"
              return {
                "release_url" => "https://github.com/#{owner}/#{repository}/releases",
                "release_notes_status" => "lookup_failed"
              }
            end

            {
              "release_url" => "https://github.com/#{owner}/#{repository}/releases",
              "release_notes_status" => "unavailable"
            }
          end

          def format_notes(notes, limit: 1200, max_lines: 25)
            text = notes.to_s.gsub("\r\n", "\n").strip
            return nil if text.empty?

            excerpt = text.lines.first(max_lines).join.strip
            truncated = text.lines.length > max_lines

            if excerpt.length > limit
              excerpt = excerpt[0, limit].rstrip + "…"
              truncated = true
            end

            [excerpt, truncated]
          end

          manifest = YAML.safe_load(File.read(ENV.fetch("UPDATECLI_MANIFEST")), aliases: false)
          targets = manifest.fetch("targets", {})
          sources = manifest.fetch("sources", {})

          target_lookup = {}
          targets.each do |target_name, target|
            matcher = target.dig("spec", "instruction", "matcher")
            next if matcher.to_s.empty?

            target_lookup[matcher] = {
              "target_name" => target_name,
              "sourceid" => target["sourceid"]
            }
          end

          bumps = parse_bumps(`git diff --cached -U0 -- Dockerfile`).map do |bump|
            target = target_lookup[bump["matcher"]] || {}
            sourceid = target["sourceid"]
            source = sources[sourceid] || {}

            bump.merge(
              "name" => (target["target_name"] || bump["matcher"].downcase),
              "sourceid" => sourceid,
              "source_kind" => source["kind"],
              "source_url" => source.dig("spec", "url"),
              "owner" => source.dig("spec", "owner"),
              "repository" => source.dig("spec", "repository"),
              "transformers" => source["transformers"] || []
            )
          end

          if bumps.empty?
            File.write("/tmp/pr_title.txt", "Automatic version bumps")
            File.write("/tmp/commit_msg.txt", "Automatic version bumps")
            File.write("/tmp/pr_body.md", "No version metadata was collected for this update.")
            exit 0
          end

          token = ENV["GITHUB_TOKEN"].to_s
          bumps.each do |bump|
            next unless bump["source_kind"] == "githubrelease"

            bump.merge!(fetch_release_details(bump, token))
          end

          title_names = bumps.first(8).map { |bump| bump["name"] }
          overflow = bumps.length - title_names.length
          title_suffix = overflow.positive? ? " and #{overflow} more" : ""
          joined_names = title_names.join(", ")
          pr_title = "Automatic version bumps for #{joined_names}#{title_suffix}"

          summary_lines = bumps.map do |bump|
            "- #{bump["name"]} was updated #{bump["old_version"]} -> #{bump["new_version"]}"
          end

          commit_msg = +"Automatic bumps for #{joined_names}#{title_suffix}\n\n"
          commit_msg << summary_lines.join("\n")

          body = +"## Summary\n\n"
          body << summary_lines.join("\n")
          body << "\n\n## Changelog\n"

          bumps.each do |bump|
            body << "\n### #{bump["name"]}\n"
            body << "- Version: `#{bump["old_version"]}` -> `#{bump["new_version"]}`\n"

            if bump["source_kind"] == "githubrelease"
              release_url = bump["release_url"]
              if release_url.to_s.empty?
                body << "- Release notes: unavailable\n"
              else
                body << "- Release: [#{bump.fetch("owner")}/#{bump.fetch("repository")} #{bump["new_version"]}](#{release_url})\n"
              end

              notes = format_notes(bump["release_notes"])
              if notes
                excerpt, truncated = notes
                body << "- Notes:\n"
                body << "  <details>\n"
                body << "  <summary>Release notes excerpt#{truncated ? " (truncated)" : ""}</summary>\n\n"
                body << excerpt
                body << "\n\n  </details>\n"
              else
                case bump["release_notes_status"]
                when "empty"
                  body << "- Notes: no release notes published for this release\n"
                when "lookup_failed"
                  body << "- Notes: unable to retrieve release notes during the workflow run\n"
                else
                  body << "- Notes: unavailable for this release\n"
                end
              end
            else
              if bump["source_url"].to_s.empty?
                body << "- Source: #{bump["source_kind"] || "unknown"}\n"
              else
                body << "- Source: [upstream](#{bump["source_url"]}) (#{bump["source_kind"]})\n"
              end
              body << "- Notes: unavailable for this source type\n"
            end
          end

          File.write("/tmp/pr_title.txt", pr_title)
          File.write("/tmp/commit_msg.txt", commit_msg)
          File.write("/tmp/pr_body.md", body)
          RUBY

          git commit -s -F /tmp/commit_msg.txt
          git push origin bumps-${{ matrix.config }}-${{ github.sha }} --force
          PR_TITLE=$(cat /tmp/pr_title.txt)
          
          # Check if PR already exists (open or closed)
          PR_INFO=$(gh pr list --head bumps-${{ matrix.config }}-${{ github.sha }} --base main --repo kairos-io/hadron --state all --json number,state -q '.[0]')
          PR_NUMBER=$(echo "$PR_INFO" | jq -r '.number // empty')
          PR_STATE=$(echo "$PR_INFO" | jq -r '.state // empty')
          if [ -n "$PR_NUMBER" ]; then
            if [ "$PR_STATE" = "CLOSED" ]; then
              # Check if PR is merged
              MERGED_AT=$(gh pr view $PR_NUMBER --repo kairos-io/hadron --json mergedAt -q '.mergedAt')
              if [ -z "$MERGED_AT" ]; then
                echo "PR #$PR_NUMBER is closed and not merged. Attempting to reopen."
                if ! gh pr reopen $PR_NUMBER --repo kairos-io/hadron; then
                  echo "Failed to reopen PR. Creating a new one."
                  gh pr create --title "$PR_TITLE" --body-file /tmp/pr_body.md --head ci-forks:bumps-${{ matrix.config }}-${{ github.sha }} --base main --repo kairos-io/hadron
                else
                  gh pr edit $PR_NUMBER --title "$PR_TITLE" --body-file /tmp/pr_body.md --repo kairos-io/hadron
                fi
              else
                echo "PR #$PR_NUMBER is merged. Nothing to do."
              fi
            else
              echo "PR #$PR_NUMBER already exists and is open. Updating title and body."
              gh pr edit $PR_NUMBER --title "$PR_TITLE" --body-file /tmp/pr_body.md --repo kairos-io/hadron
            fi
          else
            echo "No PR found. Creating a new one."
            gh pr create --title "$PR_TITLE" --body-file /tmp/pr_body.md --head ci-forks:bumps-${{ matrix.config }}-${{ github.sha }} --base main --repo kairos-io/hadron
          fi
