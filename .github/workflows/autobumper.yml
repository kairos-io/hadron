name: Updatecli

on:
  # Trigger Updatecli if a new commit land on the main branch
  push:
    branches: [main]
  # Trigger Updatecli if a pullrequest is open targeting the main branch.
  # This is useful to test Updatecli manifest change
  pull_request:
    branches: [main]
  # Manually trigger Updatecli via GitHub UI
  workflow_dispatch:
  # Trigger Updatecli once day by a cronjob
  schedule:
    # * is a special character in YAML so you have to quote this string
    # Run once a day
    - cron: "0 0 * * *"

permissions:
  # Required by Updatecli to create Git Commit(s)
  contents: "write"
  # Required by Updatecli to open GitHub pull request
  pull-requests: "write"
  # Required by Updatecli to update GitHub action workflows
  actions: "write"

jobs:
  updatecli:
    runs-on: "ubuntu-latest"
    strategy:
        matrix:
            config:
              - build-tools
              - compiler-tools
              - compression-tools
              - core-system
              - kernel-and-boot
              - misc-tools
              - network-tools
              - security-tools
              - storage-tools
              - system-libraries
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Updatecli in the runner
        uses: updatecli/updatecli-action@v2
      - name: Run Updatecli in apply mode
        run: "updatecli apply --config updatecli.d/${{ matrix.config }}.yaml"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
