        uses: docker/metadata-action@v6
        with:
          labels: |
            org.opencontainers.image.licenses=Apache-2.0
      - name: Build and push pre-preset image (${{ matrix.kernel }})
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./
          file: ./Dockerfile
          platforms: linux/riscv64
          push: true
          tags: ghcr.io/${{ github.repository }}-pre-preset-riscv64${{ matrix.kernel == 'cloud' && '-cloud' || '' }}:${{ github.ref_name }}
          labels: ${{ steps.meta.outputs.labels }}
          target: full-image-pre-preset
          cache-from: |
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage0-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:stage1-merge-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:rsync-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:cmake-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:kernel-misc-${{ matrix.kernel }}-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:kernel-misc-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:systemd-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:python-build-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:toolchain-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:container-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:grub-pre-final-${{ matrix.kernel }}-riscv64,mode=max
            type=registry,ref=quay.io/kairos/hadron-build-cache:grub-${{ matrix.kernel }}-riscv64,mode=max
          cache-to: ${{ github.ref_name == 'main' && format('type=registry,ref=quay.io/kairos/hadron-build-cache:grub-pre-final-{0}-riscv64,{1}', matrix.kernel, env.CACHE_TO_MIN) || '' }}
          build-args: |
            BOOTLOADER=grub
            KERNEL_TYPE=${{ matrix.kernel }}
            ARCH=riscv64
            BUILD_ARCH=riscv64

  hadron-bios-riscv64:
    runs-on: ubuntu-24.04-riscv
    needs: [hadron-bios-riscv64-warm]
    timeout-minutes: 60
    strategy:
      max-parallel: 1
      matrix:
        kernel: [cloud, default]
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          labels: |
            org.opencontainers.image.licenses=Apache-2.0
      - name: Build and push default image (${{ matrix.kernel }})
        uses: docker/build-push-action@v7
        env:
          SOURCE_DATE_EPOCH: 0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: ./
          file: ./Dockerfile
          platforms: linux/riscv64
          push: true
          tags: ghcr.io/${{ github.repository }}${{ matrix.kernel == 'cloud' && '-cloud' || '' }}:${{ github.ref_name }}-riscv64
          labels: ${{ steps.meta.outputs.labels }}
          target: default
          build-contexts: |
            full-image-pre-preset=docker-image://ghcr.io/${{ github.repository }}-pre-preset-riscv64${{ matrix.kernel == 'cloud' && '-cloud' || '' }}:${{ github.ref_name }}
          build-args: |
            VERSION=${{ env.VERSION }}
            BOOTLOADER=grub
            KERNEL_TYPE=${{ matrix.kernel }}
            ARCH=riscv64
            BUILD_ARCH=riscv64

  # ============================================================================
  # Image size history
  # ============================================================================
  # Records the uncompressed size of each shipped :main image once per merge and
  # appends it to a durable time series on the dedicated `size-history` branch
  # (size-history.csv + a regenerated Markdown table and SVG chart). Unlike the
  # per-PR report's step summary, this survives log/summary purging so we can see
  # how the images grow over time. Informational only: never blocks the build.
  size-history:
    if: ${{ github.ref_name == 'main' }}
    needs:
      - hadron-bios
      - hadron-trusted
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # push the size-history branch
      packages: read    # pull the :main images
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Log in to ghcr.io (to read :main images)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Record image sizes and render history
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO='${{ github.repository }}'
          BRANCH='size-history'
          DATA_DIR="${RUNNER_TEMP}/size-history"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          # Load the existing history branch, or start a fresh orphan one.
          if git clone --quiet --branch "$BRANCH" --single-branch "$REMOTE" "$DATA_DIR" 2>/dev/null; then
            echo "Loaded existing '$BRANCH' branch"
          else
            echo "No '$BRANCH' branch yet; starting a fresh one"
            mkdir -p "$DATA_DIR"
            git -C "$DATA_DIR" init -q -b "$BRANCH"
          fi
          "${GITHUB_WORKSPACE}/.github/scripts/size-history.sh" all \
            "${DATA_DIR}/size-history.csv" '${{ github.sha }}' "$REPO" "$DATA_DIR" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish history branch
        # Never fail the build on a history hiccup; the step summary above is
        # still written even if the commit/push cannot complete.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO='${{ github.repository }}'
          BRANCH='size-history'
          DATA_DIR="${RUNNER_TEMP}/size-history"
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          cd "$DATA_DIR"
          git add size-history.csv SIZE_HISTORY.md size-history.svg
          if git diff --cached --quiet; then
            echo "No size changes to commit"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "size-history: ${{ github.sha }}"
          # Merges can land close together: rebase-and-retry on push rejection so
          # two runs don't clobber each other's history.
          for attempt in 1 2 3 4 5; do
            if git push --quiet "$REMOTE" "HEAD:${BRANCH}"; then
              echo "Pushed history (attempt ${attempt})"
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); syncing and retrying"
            if git fetch --quiet "$REMOTE" "$BRANCH"; then
              git rebase --quiet FETCH_HEAD || { git rebase --abort || true; }
            fi
            sleep $((attempt * 3))
          done
          echo "Could not push history after retries" >&2
          exit 1

  release-notes:
    name: Update release notes with component manifest
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Generate component manifest (markdown)
        run: ./hack/gen-components.sh --ref "${GITHUB_REF_NAME}" --name release --out-dir . --format md

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          {
            echo
            echo "## 📦 Shipped components"
            echo
            cat release.md
          } > notes-append.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Append to the existing notes, preserving them.
            gh release view "$TAG" --json body --jq .body > existing.md || : > existing.md
            cat existing.md notes-append.md > final.md
            gh release edit "$TAG" --notes-file final.md
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
            gh release view "$TAG" --json body --jq .body > existing.md || : > existing.md
            cat existing.md notes-append.md > final.md
            gh release edit "$TAG" --notes-file final.md
          fi
