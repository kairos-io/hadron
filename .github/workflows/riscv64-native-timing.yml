---
name: 'riscv64 native build timing'

# One-off measurement. Builds cmake from its release tarball with the system
# compiler of a plain Alpine image, natively on a RISE riscv64 runner. This
# gives a native compile time to compare with the QEMU cmake build time of
# PR_riscv64.yml.
#
# It does not use the hadron Dockerfile, because every Dockerfile target
# starts from the mussel cross-compiler stage, which alone took 5.5 hours
# natively. So this measures compile speed, not the full hadron build.
#
# It pushes nothing and writes no cache, so it cannot affect any other
# pipeline. It only runs when this file changes, or when started by hand.

on:
  pull_request:
    paths:
      - .github/workflows/riscv64-native-timing.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: riscv64-native-timing-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-riscv
    timeout-minutes: 90
    name: build cmake natively
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Record runner
        run: |
          {
            echo "### cmake, native riscv64, plain Alpine compiler"
            echo "- runner: \`${{ runner.name }}\`"
            echo "- arch: \`$(uname -m)\`, cpus: \`$(nproc)\`, memory: \`$(free -g | awk '/Mem:/ {print $2}') GB\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build cmake
        run: |
          version="$(grep -oP '^ARG CMAKE_VERSION=\K.*' Dockerfile)"
          echo "- cmake version: \`${version}\`" >> "$GITHUB_STEP_SUMMARY"
          cat > build.sh <<'SCRIPT'
          set -eu
          now() { date +%s; }
          t0=$(now)
          apk add --no-cache build-base linux-headers curl perl
          t1=$(now)
          curl -fsSL -o cmake.tar.gz "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/cmake-${CMAKE_VERSION}.tar.gz"
          tar xzf cmake.tar.gz
          cd "cmake-${CMAKE_VERSION}"
          t2=$(now)
          ./bootstrap --parallel="$(nproc)" -- -DCMAKE_USE_OPENSSL=OFF
          t3=$(now)
          make -j"$(nproc)"
          t4=$(now)
          echo "setup_seconds=$((t1 - t0))"
          echo "bootstrap_seconds=$((t3 - t2))"
          echo "make_seconds=$((t4 - t3))"
          echo "compile_seconds=$((t4 - t2))"
          SCRIPT
          docker run --rm --platform linux/riscv64 \
            -e "CMAKE_VERSION=${version}" \
            -v "$PWD/build.sh:/build.sh:ro" \
            alpine:3.24.4@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf \
            sh /build.sh | tee result.txt
          {
            echo "- bootstrap: **$(( $(sed -n 's/^bootstrap_seconds=//p' result.txt) / 60 )) min**"
            echo "- make: **$(( $(sed -n 's/^make_seconds=//p' result.txt) / 60 )) min**"
            echo "- compile total (bootstrap plus make): **$(( $(sed -n 's/^compile_seconds=//p' result.txt) / 60 )) min $(( $(sed -n 's/^compile_seconds=//p' result.txt) % 60 )) s**"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Build kairos-init
        run: |
          cat > build-go.sh <<'SCRIPT'
          set -eu
          now() { date +%s; }
          apk add --no-cache go curl
          curl -fsSL -o kairos.tar.gz "https://github.com/kairos-io/kairos/archive/refs/tags/v4.4.0.tar.gz"
          tar xzf kairos.tar.gz
          cd kairos-4.4.0
          t0=$(now)
          go mod download
          t1=$(now)
          go build ./kairos-init/...
          t2=$(now)
          echo "download_seconds=$((t1 - t0))"
          echo "build_seconds=$((t2 - t1))"
          SCRIPT
          docker run --rm --platform linux/riscv64 \
            -v "$PWD/build-go.sh:/build-go.sh:ro" \
            alpine:3.24.4@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf \
            sh /build-go.sh | tee result-go.txt
          {
            echo "### kairos-init v4.4.0, Go, native riscv64, cold module cache"
            echo "- module download: **$(sed -n 's/^download_seconds=//p' result-go.txt) s**"
            echo "- go build: **$(sed -n 's/^build_seconds=//p' result-go.txt) s**"
          } >> "$GITHUB_STEP_SUMMARY"
