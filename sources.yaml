# Metadata for the per-package source cache.
#
# Each top-level key under `packages` becomes an OCI image at
# ghcr.io/kairos-io/hadron-sources/<name> tagged with the pinned
# `version` here. The populate-sources workflow fetches the tarball
# from `url` (or the first working entry in `urls`), verifies its
# `sha256`, and publishes a scratch image containing
# /sources/downloads/<filename>. Consumers in Dockerfile.tmpl do
#
#   FROM ghcr.io/kairos-io/hadron-sources/<name>:${<version_arg>} AS <name>-download
#
# and the render step (make render) substitutes ${<version_arg>} with
# `version` at build time using envsubst.
#
# This file is the single source of truth for the upstream versions
# this project builds against. To move the cache elsewhere (offline
# mirror, forked distro) all one needs is this file: fetch every
# listed url, verify each sha256, and push to a reachable registry
# under the same repository layout.
#
# Fields per package:
#   version      Upstream version. Rendered into Dockerfile.tmpl.
#   version_arg  Name of the environment variable (and Dockerfile ARG)
#                that expands to `version`. Historically some ARGs
#                use different identifiers than their package name
#                (JSONC_VERSION for json-c, KERNEL_VERSION for linux),
#                so this mapping is explicit.
#   sha256       Expected SHA256 of the fetched tarball. Publish fails
#                loudly on mismatch (upstream retagged, or wrong pin).
#   urls         List of upstream URLs tried in order until one returns
#                a non-empty body. Single-URL packages use a one-element
#                list; multi-mirror rings (GNU sources, for example)
#                list all mirrors and the workflow tries them in order.
#                ${version} is substituted at fetch time.
#   filename     Path the tarball lands at inside the source image
#                (/sources/downloads/<filename>). Must match the name
#                the Dockerfile expects downstream via COPY --from.

