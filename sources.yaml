# Metadata for the per-package source cache.
#
# Each top-level key under `packages` becomes an OCI image at
# ghcr.io/kairos-io/hadron-sources/<name> tagged with the version pulled
# from the corresponding Dockerfile ARG. The populate-sources workflow
# fetches the tarball from `url`, verifies its `sha256`, and publishes
# a scratch image containing /sources/downloads/<filename>. Consumers in
# the Dockerfile do
#
#   FROM ghcr.io/kairos-io/hadron-sources/<name>:${<version_arg>} AS <name>-download
#
# so bumping any single package's version invalidates only that image's
# tag; every other cache entry stays warm.
#
# Fields per package:
#   version_arg  Dockerfile ARG whose value the workflow reads to pick
#                the image tag. Bumping the ARG and the sha256 in the
#                same commit is enforced by the workflow.
#   sha256       Expected SHA256 of the fetched tarball. Publish fails
#                loudly on mismatch (upstream retagged, or wrong pin).
#   url          Upstream URL. ${version} is substituted from the ARG.
#                Mutually exclusive with `urls`.
#   urls         List of upstream URLs tried in order until one returns
#                a non-empty body. Use this for projects that publish
#                to multiple mirror hosts (for example the GNU mirror
#                ring at ftpmirror.gnu.org, ftp.gnu.org/gnu, and the
#                Cologne mirror). Mutually exclusive with `url`.
#   filename     Path the tarball lands at inside the source image
#                (/sources/downloads/<filename>). Must match the name
#                the Dockerfile expects downstream via COPY --from.

