---
name: Core System Updates

sources:
  musl:
    kind: gittag
    spec:
      url: git://git.musl-libc.org/musl
      lsremote: true
      versionfilter:
        kind: semver
        pattern: "v*"
    transformers:
      - trimprefix: v
    changelog:
      url: "https://git.musl-libc.org/cgit/musl/tree/WHATSNEW"
      compare: "https://git.musl-libc.org/cgit/musl/diff/?id={new_tag}&id2={old_tag}"

  busybox:
    kind: gittag
    spec:
      url: git://git.busybox.net/busybox
    transformers:
      - replacer:
          from: '_'
          to: '.'
    changelog:
      url: "https://git.busybox.net/busybox/log/"
      compare: "https://git.busybox.net/busybox/diff/?id={new_tag}&id2={old_tag}"

  systemd:
    kind: gittag
    spec:
      url: https://github.com/systemd/systemd.git
      lsremote: true
      versionfilter:
        kind: semver
        pattern: "v*"
    transformers:
      - trimprefix: v

  util_linux:
    kind: gittag
    spec:
      url: https://github.com/util-linux/util-linux.git
      lsremote: true
      versionfilter:
        kind: semver
        pattern: "*"
        replaceall:
          pattern: "^v"
          replacement: ""
    transformers:
      - trimprefix: v

  coreutils:
    kind: githubrelease
    spec:
      owner: coreutils
      repository: coreutils
    transformers:
      - trimprefix: v

  findutils:
    kind: gittag
    spec:
      url: git://git.git.savannah.gnu.org/findutils.git
      lsremote: true
      versionfilter:
        kind: semver
        pattern: "v*"
    transformers:
      - trimprefix: v
    changelog:
      url: "https://git.savannah.gnu.org/cgit/findutils.git/tree/NEWS"
      compare: "https://git.savannah.gnu.org/cgit/findutils.git/diff/?id={new_tag}&id2={old_tag}"

  grep:
    kind: gittag
    spec:
      url: git://git.git.savannah.gnu.org/grep.git
      lsremote: true
      versionfilter:
        kind: semver
        pattern: "v*"
    transformers:
      - trimprefix: v
    changelog:
      url: "https://git.savannah.gnu.org/cgit/grep.git/tree/NEWS"
      compare: "https://git.savannah.gnu.org/cgit/grep.git/diff/?id={new_tag}&id2={old_tag}"

  gperf:
    kind: gittag
    spec:
      url: git://git.git.savannah.gnu.org/gperf.git
      lsremote: true
      versionfilter:
        kind: semver
        pattern: "v*"
    transformers:
      - trimprefix: v
    changelog:
      url: "https://git.savannah.gnu.org/cgit/gperf.git/tree/NEWS"
      compare: "https://git.savannah.gnu.org/cgit/gperf.git/diff/?id={new_tag}&id2={old_tag}"

  diffutils:
    kind: gittag
    spec:
      url: git://git.git.savannah.gnu.org/diffutils.git
      lsremote: true
      versionfilter:
        kind: semver
        pattern: "v*"
    transformers:
      - trimprefix: v
    changelog:
      url: "https://git.savannah.gnu.org/cgit/diffutils.git/tree/NEWS"
      compare: "https://git.savannah.gnu.org/cgit/diffutils.git/diff/?id={new_tag}&id2={old_tag}"

  readline:
    kind: gittag
    spec:
      url: git://git.git.savannah.gnu.org/readline.git
      lsremote: true
      versionfilter:
        kind: regex
        pattern: "^readline-(\\d+\\.\\d+)$"
    transformers:
      - trimprefix: readline-
    changelog:
      url: "https://git.savannah.gnu.org/cgit/readline.git/tree/"
      compare: "https://git.savannah.gnu.org/cgit/readline.git/diff/?id={new_tag}&id2={old_tag}"

  bash:
    kind: gittag
    spec:
      url: git://git.git.savannah.gnu.org/bash.git
      lsremote: true
      versionfilter:
        kind: regex
        pattern: ^bash-(\d+\.\d+)$
    transformers:
      - trimprefix: bash-
    changelog:
      url: "https://git.savannah.gnu.org/cgit/bash.git/tree/"
      compare: "https://git.savannah.gnu.org/cgit/bash.git/diff/?id={new_tag}&id2={old_tag}"

  bash_patch_level:
    kind: shell
    spec:
      command: |
        version='{{ source "bash" }}'
        version_nodot=$(printf '%s' "$version" | tr -d '.')
        url="https://ftp.gnu.org/gnu/bash/bash-${version}-patches/"

        patch_level=$(
          wget -qO- "$url" \
            | grep -oE "bash${version_nodot}-[0-9]{3}" \
            | sed -E "s/^bash${version_nodot}-0*//" \
            | sort -n \
            | tail -n 1
        )

        if [ -z "$patch_level" ]; then
          misses=0
          i=1

          while [ "$misses" -lt 3 ]; do
            candidate=$(printf '%03d' "$i")
            if wget -q --spider "${url}bash${version_nodot}-${candidate}"; then
              patch_level=$i
              misses=0
            else
              misses=$((misses + 1))
            fi
            i=$((i + 1))
          done
        fi

        if [ -z "$patch_level" ]; then
          echo "unable to determine bash patch level for ${version}" >&2
          exit 1
        fi

        printf '%s' "$patch_level"


targets:
  musl:
    name: MUSL_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: MUSL_VERSION
    sourceid: musl

  busybox:
    name: BUSYBOX_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: BUSYBOX_VERSION
    sourceid: busybox

  systemd:
    name: SYSTEMD_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: SYSTEMD_VERSION
    sourceid: systemd

  util_linux:
    name: UTIL_LINUX_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: UTIL_LINUX_VERSION
    sourceid: util_linux

  coreutils:
    name: COREUTILS_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: COREUTILS_VERSION
    sourceid: coreutils

  findutils:
    name: FINDUTILS_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: FINDUTILS_VERSION
    sourceid: findutils

  grep:
    name: GREP_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: GREP_VERSION
    sourceid: grep

  gperf:
    name: GPERF_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: GPERF_VERSION
    sourceid: gperf

  diffutils:
    name: DIFFUTILS_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: DIFFUTILS_VERSION
    sourceid: diffutils

  readline:
    name: READLINE_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: READLINE_VERSION
    sourceid: readline

  bash:
    name: BASH_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: BASH_VERSION
    sourceid: bash

  bash_patch_level:
    name: PATCH_LEVEL in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: PATCH_LEVEL
    sourceid: bash_patch_level
