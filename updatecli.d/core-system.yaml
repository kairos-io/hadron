---
name: Core System Updates

sources:
  musl:
    kind: gittag
    spec:
      url: git://git.musl-libc.org/musl
      lsremote: true
      versionfilter:
        kind: semver
        pattern: "v*"
    transformers:
      - trimprefix: v
    changelog:
      url: "https://git.musl-libc.org/cgit/musl/tree/WHATSNEW"
      compare: "https://git.musl-libc.org/cgit/musl/diff/?id={new_tag}&id2={old_tag}"

  busybox:
    kind: gittag
    spec:
      url: git://git.busybox.net/busybox
    transformers:
      - replacer:
          from: '_'
          to: '.'
    changelog:
      url: "https://git.busybox.net/busybox/log/"
      compare: "https://git.busybox.net/busybox/diff/?id={new_tag}&id2={old_tag}"

  systemd:
    kind: gittag
    spec:
      url: https://github.com/systemd/systemd.git
      lsremote: true
      versionfilter:
        kind: semver
        pattern: "v*"
    transformers:
      - trimprefix: v

  util_linux:
    kind: gittag
    spec:
      url: https://github.com/util-linux/util-linux.git
      lsremote: true
      versionfilter:
        kind: semver
        pattern: "*"
        replaceall:
          pattern: "^v"
          replacement: ""
    transformers:
      - trimprefix: v

  coreutils:
    kind: githubrelease
    spec:
      owner: coreutils
      repository: coreutils
    transformers:
      - trimprefix: v

  findutils:
    kind: gittag
    spec:
      url: git://git.git.savannah.gnu.org/findutils.git
      lsremote: true
      versionfilter:
        kind: semver
        pattern: "v*"
    transformers:
      - trimprefix: v
    changelog:
      url: "https://git.savannah.gnu.org/cgit/findutils.git/tree/NEWS"
      compare: "https://git.savannah.gnu.org/cgit/findutils.git/diff/?id={new_tag}&id2={old_tag}"

  grep:
    kind: gittag
    spec:
      url: git://git.git.savannah.gnu.org/grep.git
      lsremote: true
      versionfilter:
        kind: semver
        pattern: "v*"
    transformers:
      - trimprefix: v
    changelog:
      url: "https://git.savannah.gnu.org/cgit/grep.git/tree/NEWS"
      compare: "https://git.savannah.gnu.org/cgit/grep.git/diff/?id={new_tag}&id2={old_tag}"

  gperf:
    kind: gittag
    spec:
      url: git://git.git.savannah.gnu.org/gperf.git
      lsremote: true
      versionfilter:
        kind: semver
        pattern: "v*"
    transformers:
      - trimprefix: v
    changelog:
      url: "https://git.savannah.gnu.org/cgit/gperf.git/tree/NEWS"
      compare: "https://git.savannah.gnu.org/cgit/gperf.git/diff/?id={new_tag}&id2={old_tag}"

  diffutils:
    kind: gittag
    spec:
      url: git://git.git.savannah.gnu.org/diffutils.git
      lsremote: true
      versionfilter:
        kind: semver
        pattern: "v*"
    transformers:
      - trimprefix: v
    changelog:
      url: "https://git.savannah.gnu.org/cgit/diffutils.git/tree/NEWS"
      compare: "https://git.savannah.gnu.org/cgit/diffutils.git/diff/?id={new_tag}&id2={old_tag}"

  readline:
    kind: gittag
    spec:
      url: git://git.git.savannah.gnu.org/readline.git
      lsremote: true
      versionfilter:
        kind: regex
        pattern: "^readline-(\\d+\\.\\d+)$"
    transformers:
      - trimprefix: readline-
    changelog:
      url: "https://git.savannah.gnu.org/cgit/readline.git/tree/"
      compare: "https://git.savannah.gnu.org/cgit/readline.git/diff/?id={new_tag}&id2={old_tag}"

  bash:
    kind: gittag
    spec:
      url: git://git.git.savannah.gnu.org/bash.git
      lsremote: true
      versionfilter:
        kind: regex
        pattern: ^bash-(\d+\.\d+)$
    transformers:
      - trimprefix: bash-
    changelog:
      url: "https://git.savannah.gnu.org/cgit/bash.git/tree/"
      compare: "https://git.savannah.gnu.org/cgit/bash.git/diff/?id={new_tag}&id2={old_tag}"

  bash_patch_level:
    kind: shell
    spec:
      command: |
        # A release GNU has not patched yet gives 0 (kairos-io/kairos#5841).
        # updatecli may run this from updatecli.d, so find the script from
        # the repository root.
        sh "$(git rev-parse --show-toplevel)/.github/scripts/bash-patch-level.sh" '{{ source "bash" }}'

  ncurses:
    # GNU only carries the x.y releases, not the dated patch snapshots.
    kind: shell
    spec:
      command: |
        curl -fsSL --retry 3 https://ftp.gnu.org/gnu/ncurses/ \
        | grep -oE 'ncurses-[0-9]+\.[0-9]+\.tar\.gz' \
        | sed -e 's/^ncurses-//' -e 's/\.tar\.gz$//' | sort -V | tail -n 1
    changelog:
      url: "https://invisible-island.net/ncurses/NEWS.html"

  procps_ng:
    kind: gittag
    spec:
      url: https://gitlab.com/procps-ng/procps.git
      versionfilter:
        kind: semver
        # rc tags (v4.0.7rc1, v4.0.2_rc1) are not valid semver and drop out.
        pattern: '*'
    transformers:
      - trimprefix: v

  less:
    # Plain vNNN tags include betas; only vNNN-rel marks a release, the same
    # one greenwoodsoftware.com lists as RECOMMENDED.
    kind: gittag
    spec:
      url: https://github.com/gwsw/less.git
      versionfilter:
        kind: regex/semver
        regex: '^v([0-9]+)-rel$'
        pattern: '*'
    transformers:
      - trimprefix: v
      - trimsuffix: -rel

targets:
  musl:
    name: MUSL_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: MUSL_VERSION
    sourceid: musl

  busybox:
    name: BUSYBOX_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: BUSYBOX_VERSION
    sourceid: busybox

  systemd:
    name: SYSTEMD_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: SYSTEMD_VERSION
    sourceid: systemd

  util_linux:
    name: UTIL_LINUX_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: UTIL_LINUX_VERSION
    sourceid: util_linux

  coreutils:
    name: COREUTILS_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: COREUTILS_VERSION
    sourceid: coreutils

  findutils:
    name: FINDUTILS_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: FINDUTILS_VERSION
    sourceid: findutils

  grep:
    name: GREP_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: GREP_VERSION
    sourceid: grep

  gperf:
    name: GPERF_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: GPERF_VERSION
    sourceid: gperf

  diffutils:
    name: DIFFUTILS_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: DIFFUTILS_VERSION
    sourceid: diffutils

  readline:
    name: READLINE_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: READLINE_VERSION
    sourceid: readline

  bash:
    name: BASH_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: BASH_VERSION
    sourceid: bash

  bash_patch_level:
    name: PATCH_LEVEL in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: PATCH_LEVEL
    sourceid: bash_patch_level

  ncurses:
    name: NCURSES_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: NCURSES_VERSION
    sourceid: ncurses

  procps_ng:
    name: PROCPS_NG_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: PROCPS_NG_VERSION
    sourceid: procps_ng

  less:
    name: LESS_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: LESS_VERSION
    sourceid: less
