---
name: Security Tools Updates

sources:
  openssl:
    kind: githubrelease
    spec:
      owner: openssl
      repository: openssl
      versionfilter:
        kind: regex/semver
        # capture group 1 is the semver
        regex: '^openssl-([0-9]+\.[0-9]+\.[0-9]+)$'
        # Restrict to 3.6.x branch; do not auto-bump to 4.x.x (incompatible)
        pattern: '>=3.6.0 <3.7.0'
    transformers:
      - trimprefix: openssl-

  openssh:
    # Read the release tarballs, not the openssh-portable git tags. The tags
    # can lag the release: 10.6p2 was on the CDN while the newest tag was still
    # V_10_6_P1, and the tag source took the pin back to 10.6p1 (#814). The
    # Dockerfile downloads from this same directory, so a version listed here
    # is one we can fetch.
    kind: shell
    spec:
      command: |
        curl -fsSL --retry 3 https://cdn.openbsd.org/pub/OpenBSD/OpenSSH/portable/ \
        | grep -oE 'openssh-[0-9]+\.[0-9]+p[0-9]+\.tar\.gz' \
        | sed -e 's/^openssh-//' -e 's/\.tar\.gz$//' | sort -uV | tail -n 1 | grep .
    changelog:
      url: "https://www.openssh.com/releasenotes.html"

  sudo:
    kind: githubrelease
    spec:
      owner: sudo-project
      repository: sudo
    transformers:
      - trimprefix: v

  pam:
    kind: gittag
    spec:
      url: https://github.com/linux-pam/linux-pam.git
      versionfilter:
        kind: semver
        pattern: '*'
    transformers:
      - trimprefix: v

  shadow:
    kind: githubrelease
    spec:
      owner: shadow-maint
      repository: shadow

  cryptsetup:
    kind: gittag
    spec:
      url: https://gitlab.com/cryptsetup/cryptsetup.git
      versionfilter:
        kind: semver
        pattern: '*'
    transformers:
      - trimprefix: v

  audit:
    kind: gittag
    spec:
      url: https://github.com/linux-audit/audit-userspace.git
      versionfilter:
        kind: regex/semver
        # Skips the odd historic tags (audit-2.7.4, v4.0.4b).
        regex: '^v([0-9]+\.[0-9]+(?:\.[0-9]+)?)$'
        pattern: '*'
    transformers:
      - trimprefix: v

  cracklib:
    kind: gittag
    spec:
      url: https://github.com/cracklib/cracklib.git
      versionfilter:
        kind: semver
        pattern: '*'
    transformers:
      - trimprefix: v

  libpwquality:
    kind: gittag
    spec:
      url: https://github.com/libpwquality/libpwquality.git
      versionfilter:
        kind: regex/semver
        regex: '^libpwquality-([0-9]+\.[0-9]+\.[0-9]+)$'
        pattern: '*'
    transformers:
      - trimprefix: libpwquality-

  openssl_fips:
    # FIPS builds compile the whole of openssl, fips provider included, from
    # OPENSSL_FIPS_VERSION, so it must only ever name a release whose fips
    # provider holds a FIPS 140-3 certificate. A newer patch release of the
    # same branch (3.1.8 against the validated 3.1.2) is NOT validated, so a
    # semver constraint would be wrong here. Read the official validated list
    # instead and take the newest FIPS 140-3 entry; a new validated release
    # only shows up once OpenSSL adds it to that table.
    kind: shell
    spec:
      command: |
        set -eu
        page=$(curl -fsSL --retry 3 https://openssl-library.org/source/)
        version=$(printf '%s\n' "$page" \
          | tr -d '\n' \
          | sed 's#</tr>#</tr>\n#g' \
          | grep -E '<td>FIPS 140-3</td>' \
          | sed -nE 's#.*<tr>[[:space:]]*<td>([0-9]+\.[0-9]+\.[0-9]+)</td>.*#\1#p' \
          | sort -V | tail -n 1)
        if [ -z "$version" ]; then
          echo "no FIPS 140-3 validated release found on openssl-library.org/source" >&2
          exit 1
        fi
        printf '%s\n' "$version"
    changelog:
      url: "https://openssl-library.org/source/"

targets:
  openssl:
    name: OPENSSL_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: OPENSSL_VERSION
    sourceid: openssl

  openssh:
    name: OPENSSH_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: OPENSSH_VERSION
    sourceid: openssh

  sudo:
    name: SUDO_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: SUDO_VERSION
    sourceid: sudo

  pam:
    name: PAM_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: PAM_VERSION
    sourceid: pam

  shadow:
    name: SHADOW_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: SHADOW_VERSION
    sourceid: shadow

  cryptsetup:
    name: CRYPTSETUP_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: CRYPTSETUP_VERSION
    sourceid: cryptsetup

  audit:
    name: AUDIT_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: AUDIT_VERSION
    sourceid: audit

  cracklib:
    name: CRACKLIB_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: CRACKLIB_VERSION
    sourceid: cracklib

  libpwquality:
    name: LIBPWQUALITY_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: LIBPWQUALITY_VERSION
    sourceid: libpwquality

  openssl_fips:
    name: OPENSSL_FIPS_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: OPENSSL_FIPS_VERSION
    sourceid: openssl_fips
