---
name: Storage Tools Updates


sources:
  lvm2:
    kind: gittag
    spec:
      url: https://gitlab.com/lvmteam/lvm2.git
      lsremote: true
      versionfilter:
        kind: regex
        pattern: '^v[0-9]+_[0-9]+_[0-9]+$'
    transformers:
      - trimprefix: v
      - sort:
          method: alphanum
      - replacer:
          from: '_'
          to: '.'

  multipath:
    kind: gittag
    spec:
      url: https://github.com/opensvc/multipath-tools.git
      lsremote: true
      versionfilter:
        kind: semver
        pattern: '*'

  e2fsprogs:
    kind: gittag
    spec:
      url: git://git.kernel.org/pub/scm/fs/ext2/e2fsprogs.git
      lsremote: true
    transformers:
      - trimprefix: v
      - sort:
          method: semver
      - semver:
          constraint: '*'
    changelog:
      url: "https://git.kernel.org/pub/scm/fs/ext2/e2fsprogs.git/tree/"
      compare: "https://git.kernel.org/pub/scm/fs/ext2/e2fsprogs.git/diff/?id={new_tag}&id2={old_tag}"

  dosfstools:
    kind: gittag
    spec:
      url: https://github.com/dosfstools/dosfstools.git
      lsremote: true
    transformers:
      - trimprefix: v

  parted:
    # Much faster to query this thant to use the gittag which actually clones the repository fully
    kind: gittag
    spec:
      url: https://git.savannah.gnu.org/git/parted.git
      lsremote: true
    transformers:
      - trimprefix: v
      - sort:
          method: semver
      - semver:
          constraint: '*'
    changelog:
      url: "https://git.savannah.gnu.org/cgit/parted.git/tree/NEWS"
      compare: "https://git.savannah.gnu.org/cgit/parted.git/diff/?id={new_tag}&id2={old_tag}"

  urcu:
    kind: gittag
    spec:
      url: https://github.com/urcu/userspace-rcu.git
      lsremote: true
      versionfilter:
        kind: semver
        pattern: '*'
    transformers:
      - trimprefix: v

  libtirpc:
    kind: gittag
    spec:
      # NB: only the unencrypted git:// transport on this host serves these
      # refs; the https endpoint returns 403. If CI blocks outbound port 9418,
      # switch to a `shell`/`releasechecker` source.
      url: git://git.linux-nfs.org/projects/steved/libtirpc.git
      lsremote: true
      versionfilter:
        kind: regex
        # GA only - exclude libtirpc-X-Y-Z-rcN
        pattern: '^libtirpc-[0-9]+-[0-9]+-[0-9]+$'
    transformers:
      - trimprefix: libtirpc-
      - replacer:
          from: '-'
          to: '.'
      - sort:
          method: semver
      - semver:
          constraint: '*'

  nfs-utils:
    kind: gittag
    spec:
      url: git://git.linux-nfs.org/projects/steved/nfs-utils.git
      lsremote: true
      versionfilter:
        kind: regex
        # GA only - exclude nfs-utils-X-Y-Z-rcN
        pattern: '^nfs-utils-[0-9]+-[0-9]+-[0-9]+$'
    transformers:
      - trimprefix: nfs-utils-
      - replacer:
          from: '-'
          to: '.'
      - sort:
          method: semver
      - semver:
          constraint: '*'

  drbd:
    # Out-of-tree DRBD 9 kernel module (LINBIT). Track the latest 9.x GA only,
    # excluding pre-releases (e.g. drbd-10.0.0a1) and the 10.x series.
    kind: gittag
    spec:
      url: https://github.com/LINBIT/drbd.git
      lsremote: true
      versionfilter:
        kind: regex
        pattern: '^drbd-9\.[0-9]+\.[0-9]+$'
    transformers:
      - trimprefix: drbd-
      - sort:
          method: semver
      - semver:
          constraint: '*'

  drbd-utils:
    # DRBD userspace tools (LINBIT). Track the latest 9.x GA only, excluding
    # release candidates (e.g. v9.34.0-rc.1).
    kind: gittag
    spec:
      url: https://github.com/LINBIT/drbd-utils.git
      lsremote: true
      versionfilter:
        kind: regex
        pattern: '^v9\.[0-9]+\.[0-9]+$'
    transformers:
      - trimprefix: v
      - sort:
          method: semver
      - semver:
          constraint: '*'

targets:
  lvm2:
    name: LVM2_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: LVM2_VERSION
    sourceid: lvm2

  multipath:
    name: MULTIPATH_TOOLS_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: MULTIPATH_TOOLS_VERSION
    sourceid: multipath

  e2fsprogs:
    name: E2FSPROGS_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: E2FSPROGS_VERSION
    sourceid: e2fsprogs

  dosfstools:
    name: DOSFSTOOLS_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: DOSFSTOOLS_VERSION
    sourceid: dosfstools

  parted:
    name: PARTED_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: PARTED_VERSION
    sourceid: parted

  urcu:
    name: URCU_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: URCU_VERSION
    sourceid: urcu

  libtirpc:
    name: LIBTIRPC_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: LIBTIRPC_VERSION
    sourceid: libtirpc

  nfs-utils:
    name: NFS_UTILS_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: NFS_UTILS_VERSION
    sourceid: nfs-utils

  drbd:
    name: DRBD_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: DRBD_VERSION
    sourceid: drbd

  drbd-utils:
    name: DRBD_UTILS_VERSION in Dockerfile
    kind: dockerfile
    spec:
      file: Dockerfile
      instruction:
        keyword: ARG
        matcher: DRBD_UTILS_VERSION
    sourceid: drbd-utils
