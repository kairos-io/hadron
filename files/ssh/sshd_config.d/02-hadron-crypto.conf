# Hadron non-FIPS crypto hardening for sshd.
# Ships ONLY in non-FIPS images (the FIPS image uses 02-hadron-fips.conf
# instead, which pins the FIPS-validated subset). Same 02- prefix as the FIPS
# file so exactly one crypto drop-in is ever present per image and neither can
# override the other. Numbered 02-, not 100-: kairos-init's own
# 05-kairos-hardening.conf sets these same directives (Ciphers/KexAlgorithms/
# MACs/HostKeyAlgorithms), and sshd is first-value-wins across
# sshd_config.d/*.conf in lexical order — a 100- filename sorted after it and
# lost, silently replacing this list (and the FIPS-validated one in
# 02-hadron-fips.conf) with kairos-init's non-FIPS-validated defaults.
Ciphers aes256-gcm@openssh.com,chacha20-poly1305@openssh.com,aes256-ctr,aes128-gcm@openssh.com,aes128-ctr
KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512,diffie-hellman-group14-sha256
MACs hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,umac-128-etm@openssh.com,hmac-sha2-256,hmac-sha2-512,umac-128@openssh.com
HostKeyAlgorithms ssh-ed25519,ecdsa-sha2-nistp256,ecdsa-sha2-nistp384,ecdsa-sha2-nistp521,rsa-sha2-512,rsa-sha2-256
