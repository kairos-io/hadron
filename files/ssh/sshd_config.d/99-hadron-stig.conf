# Hadron STIG-hardening sshd drop-in (applies to ALL images).
#
# IMPORTANT: this file intentionally contains NO crypto-negotiation keywords
# (Ciphers, MACs, KexAlgorithms, HostKeyAlgorithms). sshd uses the FIRST value
# obtained for those keywords, and this file sorts lexically BEFORE the 100-*
# crypto drop-in (100-hadron-fips.conf in FIPS images, 100-hadron-crypto.conf
# otherwise). Putting crypto lists here would silently override the FIPS-approved
# algorithms in FIPS images and break FIPS compliance. Crypto is owned solely by
# the 100-* drop-in. Do NOT add crypto keywords here.
#
# PasswordAuthentication is deliberately left at its default (yes): Kairos
# provisions node users with passwords. Downstream key-only deployments can
# disable it with their own higher-numbered drop-in.

# --- Access control ---
PermitRootLogin prohibit-password
PermitEmptyPasswords no
PermitUserEnvironment no
IgnoreRhosts yes
IgnoreUserKnownHosts yes
HostbasedAuthentication no
# NOTE: GSSAPIAuthentication / KerberosAuthentication are intentionally NOT set.
# Hadron's openssh is built without krb5 (no --with-kerberos5), so those auth
# methods are not compiled in — already disabled. Setting the directives would
# only emit "Unsupported option" warnings on every config parse.

# --- Session / forwarding hardening ---
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
GatewayPorts no
PermitTunnel no
Compression no
StrictModes yes

# --- Login policy ---
MaxAuthTries 4
MaxSessions 10
MaxStartups 10:30:60
LoginGraceTime 60
ClientAliveInterval 600
ClientAliveCountMax 1

# --- Logging / accountability ---
# VERBOSE logs key fingerprints on login (accountability / intrusion detection).
# PrintLastLog is intentionally omitted: Hadron's openssh is built with
# --disable-lastlog, so the directive is unsupported and would warn.
LogLevel VERBOSE

# --- Rekey ---
RekeyLimit 1G 1h
