# Hadron FIPS-specific sshd config
#
# No post-quantum hybrid is listed here, and none can be, while the image
# claims FIPS. Both hybrids OpenSSH offers (mlkem768x25519-sha256 and
# sntrup761x25519-sha512) are computed inside sshd itself, not by the
# validated OpenSSL FIPS provider: ML-KEM-768 comes from the libcrux code
# bundled in libcrux-mlkem-mldsa.c, sntrup761 from sntrup761.c, and the
# X25519 half from smult_curve25519_ref.c. None of them reach libcrypto, so
# adding them here would let sshd negotiate a shared secret outside the
# validated module boundary. The X25519 half is not an approved key
# agreement scheme either, which is the same reason curve25519-sha256 is
# absent from this list while 02-hadron-crypto.conf carries it.
# Consequence: OpenSSH 10.1+ clients print the "connection is not using a
# post-quantum key exchange algorithm" warning against FIPS images. That is
# expected, and clients that want it silenced can set
# WarnWeakCrypto no-pq-kex in ssh_config.
Ciphers aes256-gcm@openssh.com,aes256-ctr,aes128-gcm@openssh.com,aes128-ctr
KexAlgorithms ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521
MACs hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com,hmac-sha2-256,hmac-sha2-512
HostKeyAlgorithms ecdsa-sha2-nistp256,ecdsa-sha2-nistp384,ecdsa-sha2-nistp521,rsa-sha2-256,rsa-sha2-512
HostKey /etc/ssh/ssh_host_ecdsa_key
HostKey /etc/ssh/ssh_host_rsa_key
