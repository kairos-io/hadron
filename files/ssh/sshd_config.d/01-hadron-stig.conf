# Hadron STIG-hardening sshd drop-in (applies to ALL images).
#
# Numbered 01-, not 99-: sshd applies sshd_config.d/*.conf in lexical order
# and uses the FIRST value it sees per directive. A 99- filename sorts after
# kairos-init's own hardening drop-in (/etc/ssh/sshd_config.d/05-kairos-
# hardening.conf, shipped since kairos-init v0.17.3) and silently loses every
# directive both files set — including PermitRootLogin. Hit in practice: this
# file used to be named 99-hadron-stig.conf, and hadron's acceptance tests
# started failing "expected effective sshd config to contain 'permitrootlogin
# prohibit-password'" the moment a hadron build picked up a kairos-init
# release carrying that drop-in, because kairos-init's `PermitRootLogin no`
# was winning instead. 01- sorts before kairos-init's 05-, so this file wins
# on every directive it sets, same intent as before, now actually enforced.
#
# IMPORTANT: this file intentionally contains NO crypto-negotiation keywords
# (Ciphers, MACs, KexAlgorithms, HostKeyAlgorithms). This file sorts lexically
# BEFORE the 02-* crypto drop-in (02-hadron-fips.conf in FIPS images,
# 02-hadron-crypto.conf otherwise). Putting crypto lists here would silently
# override the FIPS-approved algorithms in FIPS images and break FIPS
# compliance. Crypto is owned solely by the 02-* drop-in. Do NOT add crypto
# keywords here.
#
# PasswordAuthentication is deliberately left at its default (yes): Kairos
# provisions node users with passwords. Downstream key-only deployments can
# disable it with their own drop-in numbered between 02 and 05.

# --- Access control ---
PermitRootLogin prohibit-password
PermitEmptyPasswords no
PermitUserEnvironment no
IgnoreRhosts yes
IgnoreUserKnownHosts yes
HostbasedAuthentication no
# NOTE: GSSAPIAuthentication / KerberosAuthentication are intentionally NOT set.
# Hadron's openssh is built without krb5 (no --with-kerberos5), so those auth
# methods are not compiled in — already disabled. Setting the directives would
# only emit "Unsupported option" warnings on every config parse.

# --- Session / forwarding hardening ---
X11Forwarding no
AllowTcpForwarding no
AllowAgentForwarding no
GatewayPorts no
PermitTunnel no
Compression no
StrictModes yes

# --- Login policy ---
MaxAuthTries 4
MaxSessions 10
MaxStartups 10:30:60
LoginGraceTime 60
ClientAliveInterval 600
ClientAliveCountMax 1

# --- Logging / accountability ---
# VERBOSE logs key fingerprints on login (accountability / intrusion detection).
# PrintLastLog is intentionally omitted: Hadron's openssh is built with
# --disable-lastlog, so the directive is unsupported and would warn.
LogLevel VERBOSE

# --- Rekey ---
RekeyLimit 1G 1h
