# Disable legacy / rarely-used network protocols (STIG / CIS hardening,
# kairos-io/kairos#4058 finding 4).
#
# `install <mod> /bin/false` blocks BOTH kernel auto-load (e.g. a socket() for
# the protocol family) and manual `modprobe`, since modprobe runs the install
# command instead of loading the module.
#
# On Hadron's kernels: RDS, TIPC and ATM are loadable modules (=m) on the
# default kernel, so these rules actively prevent loading them. DCCP, AX25 and
# NETROM are not compiled at all, so their rules are defense-in-depth (effective
# if a future kernel build adds them). None of these protocols are built-in
# (=y), so modprobe.d is sufficient — no kernel reconfiguration needed.
#
# SCTP is intentionally NOT disabled here: it has legitimate Kubernetes use
# (Service/Endpoint protocol: SCTP).
install dccp /bin/false
install rds /bin/false
install tipc /bin/false
install atm /bin/false
install ax25 /bin/false
install netrom /bin/false
