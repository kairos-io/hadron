# Hadron STIG/GPOS-SRG kernel-parameter (sysctl) hardening baseline.
# Derived from the RHEL 9 STIG sysctl rules + General Purpose OS SRG, tuned to
# be SAFE on a Kubernetes node (Kairos; Cilium/Calico; k3s/k0s).
#
# Keys whose kernel option is not compiled into every Hadron kernel variant use
# the leading "-" (ignore-if-missing) so `sysctl --system` never returns nonzero
# on the cloud / riscv64 kernels where the option is absent. See sysctl.d(5).
#
# DELIBERATELY OMITTED — owned by the CNI / kubelet / workload, would break k8s:
#   net.ipv4.ip_forward, net.ipv4.conf.all.forwarding, net.ipv6.conf.all.forwarding
#                                          (Kubernetes requires forwarding=1)
#   net.ipv4.conf.{all,default}.rp_filter  (strict RPF breaks Cilium/Calico pod routing)
#   net.ipv4.conf.all.send_redirects       (a k8s node is a router; CNI manages this)
#   net.bridge.bridge-nf-call-*            (needs br_netfilter loaded; CNI-dependent)
#   fs.inotify.* / fs.file-max / vm.max_map_count  (k8s tunes these UP, not down)
#   user.max_user_namespaces               (=0 breaks userns / rootless pods)
#   kernel.core_pattern=|/bin/false        (kept out so cores remain debuggable;
#                                           downstream STIG profiles can add it)

# --- Kernel pointer / info-leak hardening ---
kernel.kptr_restrict = 1                       # RHEL-09-213025 — hide kernel pointers in /proc
kernel.dmesg_restrict = 1                      # RHEL-09-213010 — restrict kernel ring buffer to root
kernel.randomize_va_space = 2                  # RHEL-09-213070 — full ASLR
kernel.unprivileged_bpf_disabled = 1           # RHEL-09-213075 — only CAP_SYS_ADMIN may call bpf() (Cilium sets this itself; safe)
-kernel.perf_event_paranoid = 2                # restrict unprivileged perf (absent on cloud-riscv64)
-kernel.yama.ptrace_scope = 1                  # RHEL-09-213080 — restrict ptrace (CONFIG_SECURITY_YAMA)
-kernel.kexec_load_disabled = 1                # RHEL-09-213020 — block kexec (CONFIG_KEXEC; irreversible per boot)
-kernel.sysrq = 0                              # disable magic SysRq on headless nodes (CONFIG_MAGIC_SYSRQ)
-net.core.bpf_jit_harden = 2                   # constant-blind BPF JIT vs JIT-spray (CONFIG_BPF_JIT)

# --- SUID core-dump hardening ---
fs.suid_dumpable = 0                           # no core dumps for setuid / privilege-changed processes

# --- Filesystem link / FIFO / regular-file protections ---
fs.protected_hardlinks = 1                     # RHEL-09-213030 — block hardlink-to-unowned-file attacks
fs.protected_symlinks = 1                      # RHEL-09-213035 — restrict symlink following in sticky dirs
fs.protected_fifos = 2                         # block O_CREAT on FIFOs in world/group-writable sticky dirs
fs.protected_regular = 2                       # block O_CREAT on regular files in world/group-writable sticky dirs

# --- IPv4 network hardening (safe on a forwarding node) ---
net.ipv4.tcp_syncookies = 1                    # RHEL-09-253010 — SYN-flood protection (CONFIG_SYN_COOKIES enabled on all Hadron kernel variants)
net.ipv4.conf.all.accept_redirects = 0         # RHEL-09-253015 — ignore ICMP redirects (MITM)
net.ipv4.conf.default.accept_redirects = 0     # RHEL-09-253040
net.ipv4.conf.all.accept_source_route = 0      # RHEL-09-253020 — drop source-routed packets
net.ipv4.conf.default.accept_source_route = 0  # RHEL-09-253045
net.ipv4.conf.all.log_martians = 1             # RHEL-09-253025 — log impossible-address packets
net.ipv4.conf.default.log_martians = 1         # RHEL-09-253030
net.ipv4.icmp_echo_ignore_broadcasts = 1       # RHEL-09-253055 — no broadcast-ping amplification
net.ipv4.icmp_ignore_bogus_error_responses = 1 # RHEL-09-253060 — drop bogus ICMP error responses
net.ipv4.conf.default.send_redirects = 0       # RHEL-09-253070 — new interfaces don't emit redirects

# --- IPv6 network hardening ---
net.ipv6.conf.all.accept_redirects = 0         # RHEL-09-254015 — ignore IPv6 ICMP redirects
net.ipv6.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_source_route = 0      # RHEL-09-254020 — drop IPv6 source-routed packets
net.ipv6.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_ra = 0                # RHEL-09-254010 — don't auto-config from router advertisements
net.ipv6.conf.default.accept_ra = 0            # RHEL-09-254030
